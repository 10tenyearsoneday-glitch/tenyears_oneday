<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>優惠碼後台</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body{font-family:system-ui}
.wrap{max-width:900px;margin:auto;padding:20px}
.row{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #ccc}
button{padding:8px 14px;border-radius:999px;border:0;background:#5d6b59;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.panel{background:#fff;padding:16px;border-radius:12px;width:420px}
</style>
</head>

<body>
<div class="wrap">

<h2>運費 / 折扣</h2>

<div class="row">
<label>運費</label>
<input id="shipping_fee">

<label>免運門檻</label>
<input id="free_shipping_threshold">

<button onclick="saveSettings()">儲存設定</button>
<div id="toastSettings"></div>
</div>

<hr>

<h2>優惠碼</h2>

<button onclick="openAdd()">新增優惠碼</button>

<div id="list"></div>

</div>

<div class="modal" id="modal">
<div class="panel">

<input id="code" placeholder="CODE">
<select id="enabled">
<option value="true">啟用</option>
<option value="false">停用</option>
</select>

<select id="type">
<option value="rate">打折</option>
<option value="amount">折抵</option>
</select>

<input id="rate" placeholder="0.9">
<input id="amount" placeholder="100">

<button onclick="saveCoupon()">儲存</button>
<button onclick="delCoupon()">刪除</button>
<button onclick="closeModal()">取消</button>

</div>
</div>

<script src="./include-common.js"></script>

<script>
let COUPONS=[]
let editing=null

const $=id=>document.getElementById(id)

async function init(){
  const s=await getSettings()
  shipping_fee.value=s.shipping_fee||0
  free_shipping_threshold.value=s.free_shipping_threshold||0
  COUPONS=await fetchCoupons()
  render()
}

function render(){
  list.innerHTML=COUPONS.map(c=>`
    <div class="row">
    <b>${c.code}</b>
    <button onclick="edit('${c.code}')">編輯</button>
    </div>
  `).join("")
}

function openAdd(){
  editing=null
  code.value=""
  modal.classList.add("open")
}

function edit(c){
  const x=COUPONS.find(i=>i.code===c)
  editing=c
  code.value=x.code
  enabled.value=String(x.enabled)
  type.value=x.type
  rate.value=x.rate||""
  amount.value=x.amount||""
  modal.classList.add("open")
}

function closeModal(){modal.classList.remove("open")}

async function saveCoupon(){
  const p={
    code:code.value.trim().toUpperCase(),
    enabled:enabled.value==="true",
    type:type.value,
    rate:Number(rate.value||0),
    amount:Number(amount.value||0)
  }

  if(editing) await updateCoupon(p)
  else await addCoupon(p)

  COUPONS=await fetchCoupons()
  render()
  closeModal()
}

async function delCoupon(){
  if(!editing) return
  await deleteCoupon(editing)
  COUPONS=await fetchCoupons()
  render()
  closeModal()
}

async function saveSettings(){
  await updateSettings({
    shipping_fee:Number(shipping_fee.value||0),
    free_shipping_threshold:Number(free_shipping_threshold.value||0)
  })
  toastSettings.textContent="已儲存"
}

init()
</script>

</body>
</html>
