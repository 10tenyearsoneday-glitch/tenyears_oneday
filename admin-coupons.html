<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>後台管理｜優惠碼 / 運費設定</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .admin-wrap{max-width:980px;margin:auto;padding:18px;}
    .admin-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0 14px;}
    .admin-title{font-size:1.15rem;letter-spacing:.08em;color:rgba(47,58,44,.85)}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn2{border:none;border-radius:999px;padding:10px 14px;background:#5d6b59;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn2.secondary{background:rgba(0,0,0,.08);color:rgba(47,58,44,.9)}
    .btn2.danger{background:#8a3b3b}
    .hint{font-size:.85rem;opacity:.7}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px;}
    .tab{border:1px solid rgba(0,0,0,.10);background:rgba(255,255,255,.60);padding:10px 14px;border-radius:999px;cursor:pointer}
    .tab.active{background:#2c3a2c;color:#fff;border-color:#2c3a2c}
    .cardx{background:rgba(255,255,255,.70);border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 30px rgba(0,0,0,.06);border-radius:14px;padding:14px;margin-bottom:14px}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .form .full{grid-column:1/-1}
    label{display:block;font-size:.82rem;opacity:.75;margin:2px 0 6px}
    input, select, textarea{
      width:100%;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.12);
      background:rgba(255,255,255,.85);
      outline:none;
    }
    textarea{min-height:90px;resize:vertical}
    .table{width:100%;border-collapse:separate;border-spacing:0 10px;}
    .row{background:rgba(255,255,255,.70);border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 30px rgba(0,0,0,.06);border-radius:14px;overflow:hidden}
    .row td{padding:12px 12px;vertical-align:middle}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.06);font-size:.82rem;white-space:nowrap}
    .pill.on{background:rgba(93,107,89,.18);color:rgba(47,58,44,.9)}
    .pill.off{background:rgba(138,59,59,.12);color:#8a3b3b}
    .toast{margin-top:10px;font-size:.9rem}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;z-index:9999;}
    .modal.open{display:flex}
    .panel{width:min(760px,100%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:18px;padding:16px 16px 14px;border:1px solid rgba(0,0,0,.08);max-height:calc(100vh - 36px);overflow:auto;}
    .panel-actions{position:sticky;bottom:0;background:rgba(255,255,255,.92);padding:12px 0 4px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid rgba(0,0,0,.06);}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid2 .full{grid-column:1/-1}
    .muted{opacity:.75}
  </style>
</head>
<body>
<iframe name="gasFrame" style="display:none"></iframe>


<main class="admin-wrap">
  <div class="admin-top">
    <div>
      <div class="admin-title">後台管理（優惠碼 / 運費設定）</div>
      <div class="hint">這頁會直接寫入 Google Sheet（需要 ADMIN_KEY）。</div>
    </div>
    <div class="admin-actions">
      <a class="btn2 secondary" href="admin.html">← 回後台</a>
      <button class="btn2 secondary" id="btnReload" type="button">重新載入</button>
      <button class="btn2" id="btnAddCoupon" type="button">新增優惠碼</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="settings" type="button">運費 / 折扣設定</button>
    <button class="tab" data-tab="coupons" type="button">優惠碼管理</button>
  </div>

  <!-- Settings -->
  <section id="tabSettings" class="cardx">
    <h3 style="margin:0 0 10px;">運費 / 首購 / 生日月</h3>
    <div class="form">
      <div>
        <label>是否啟用運費（shipping_enabled）</label>
        <select id="sShipEnabled">
          <option value="true">啟用</option>
          <option value="false">停用（全站免運）</option>
        </select>
      </div>
      <div>
        <label>運費（shipping_fee）</label>
        <input id="sShipFee" type="number" min="0" step="1" placeholder="例如 60">
      </div>
      <div>
        <label>免運門檻（free_shipping_threshold）</label>
        <input id="sFreeOver" type="number" min="0" step="1" placeholder="例如 1000">
      </div>
      <div>
        <label>首購折扣率（first_purchase_discount）</label>
        <input id="sFirstRate" type="number" min="0" max="1" step="0.01" placeholder="例如 0.9（9折）">
      </div>
      <div>
        <label>生日月折扣率（birthday_discount）</label>
        <input id="sBdayRate" type="number" min="0" max="1" step="0.01" placeholder="例如 0.85（85折）">
      </div>
      <div class="full">
        <button class="btn2" id="btnSaveSettings" type="button">儲存設定</button>
        <div class="toast" id="toastSettings"></div>
      </div>
    </div>
  </section>

  <!-- Coupons -->
  <section id="tabCoupons" class="cardx" style="display:none;">
    <h3 style="margin:0 0 10px;">優惠碼列表</h3>
    <table class="table" id="tblCoupons"></table>
    <div class="toast" id="toastCoupons"></div>
  </section>
</main>

<!-- Coupon Modal -->
<div class="modal" id="modal">
  <div class="panel">
    <h3 id="modalTitle" style="margin:0 0 10px;">新增優惠碼</h3>

    <div class="grid2">
      <div>
        <label>優惠碼 code（主鍵，英數）</label>
        <input id="cCode" placeholder="例如 HELLO" style="text-transform:uppercase">
      </div>
      <div>
        <label>啟用 enabled</label>
        <select id="cEnabled">
          <option value="true">啟用</option>
          <option value="false">停用</option>
        </select>
      </div>

      <div>
        <label>類型 type</label>
        <select id="cType">
          <option value="rate">打折（rate）</option>
          <option value="amount">折抵金額（amount）</option>
        </select>
      </div>
      <div>
        <label>rate（例如 0.9）</label>
        <input id="cRate" type="number" min="0" max="1" step="0.01" placeholder="0.9">
      </div>

      <div>
        <label>amount（例如 100）</label>
        <input id="cAmount" type="number" min="0" step="1" placeholder="100">
      </div>
      <div>
        <label>最低消費 minSpend</label>
        <input id="cMinSpend" type="number" min="0" step="1" placeholder="0">
      </div>

      <div>
        <label>開始 startAt（可空）</label>
        <input id="cStartAt" type="datetime-local">
      </div>
      <div>
        <label>結束 endAt（可空）</label>
        <input id="cEndAt" type="datetime-local">
      </div>

      <div>
        <label>每會員限用一次 oncePerMember</label>
        <select id="cOnce">
          <option value="false">否</option>
          <option value="true">是</option>
        </select>
      </div>
      <div>
        <label>全站限量 maxUses（0=不限）</label>
        <input id="cMaxUses" type="number" min="0" step="1" placeholder="0">
      </div>

      <div class="full">
        <label>備註 note</label>
        <textarea id="cNote" placeholder="例如：新客優惠"></textarea>
      </div>
    </div>

    <div class="panel-actions">
      <button class="btn2 secondary" id="btnCancel" type="button">取消</button>
      <button class="btn2 danger" id="btnDelete" type="button" style="display:none;">刪除</button>
      <button class="btn2" id="btnSave" type="button">儲存</button>
    </div>

    <div class="hint muted" id="modalHint" style="margin-top:10px;"></div>
  </div>
</div>


<script src="./include-common.js"></script>
<script src="./include-admin-coupons.js"></script>

</body>
</html>
