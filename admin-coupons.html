<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>後台管理｜優惠碼 / 運費設定</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>後台管理（優惠碼 / 運費設定）</h1>
  <p>這頁會直接寫入 Google Sheet（需要 ADMIN_KEY）。</p>

  <div class="actions">
    <a href="./admin.html">返回商品管理</a>
    <button class="reload">重新載入</button>
    <button class="add-coupon">新增優惠碼</button>
  </div>

  <table id="tbl"></table>
  <div id="toast"></div>

  <!-- 共用 Modal -->
  <div id="modalBackdrop" class="modal-backdrop" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <h2 id="modalTitle">操作</h2>
      <form id="modalForm">
        <div id="modalFields"></div>
        <div class="modal-actions">
          <button type="submit">確認</button>
          <button type="button" id="modalCancel">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./include-common.js"></script>
  <script src="./include-admin-coupons.js"></script>
</body>
</html>
