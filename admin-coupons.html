<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>後台｜優惠碼與全站設定</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      margin:0;
      background:#f7f8f6;
      color:#2c3a2c;
    }
    header{
      padding:14px 18px;
      background:#2c3a2c;
      color:#fff;
      font-weight:700;
      letter-spacing:.08em;
    }
    main{
      max-width:1100px;
      margin:auto;
      padding:18px;
    }
    h2{
      margin:28px 0 12px;
      font-size:1.2rem;
    }
    .card{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,.08);
      padding:14px;
      margin-bottom:20px;
    }
    table{
      width:100%;
      border-collapse:collapse;
      font-size:.9rem;
    }
    th,td{
      border-bottom:1px solid rgba(0,0,0,.08);
      padding:8px 6px;
      text-align:left;
      white-space:nowrap;
    }
    th{
      background:#f1f3ef;
      font-weight:700;
    }
    input,select{
      padding:6px 8px;
      border-radius:8px;
      border:1px solid rgba(0,0,0,.2);
      font-size:.9rem;
    }
    button{
      padding:6px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      background:#2c3a2c;
      color:#fff;
      font-size:.85rem;
    }
    button.sub{
      background:#e6ebe3;
      color:#2c3a2c;
    }
    .row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }
    .row label{
      font-size:.85rem;
      opacity:.85;
    }
    .danger{
      background:#8a3b3b;
      color:#fff;
    }
    .muted{
      opacity:.6;
      font-size:.85rem;
    }
  </style>
</head>

<body>
<header>後台管理｜優惠碼 & 全站設定</header>

<main>

  <!-- ===== 全站設定 ===== -->
  <h2>全站設定</h2>
  <div class="card">
    <div class="row">
      <label>是否啟用運費</label>
      <select id="shipping_enabled">
        <option value="true">是</option>
        <option value="false">否</option>
      </select>

      <label>運費</label>
      <input id="shipping_fee" type="number" value="60">

      <label>免運門檻</label>
      <input id="free_shipping_threshold" type="number" value="1000">

      <label>首購折扣（0.9 = 9折）</label>
      <input id="first_purchase_discount" type="number" step="0.01" value="0.9">

      <label>生日折扣</label>
      <input id="birthday_discount" type="number" step="0.01" value="0.85">

      <button onclick="saveSettings()">儲存設定</button>
    </div>
    <div id="settingsMsg" class="muted"></div>
  </div>

  <!-- ===== 優惠碼 ===== -->
  <h2>優惠碼</h2>
  <div class="card">
    <div class="row">
      <input id="c_code" placeholder="CODE">
      <select id="c_type">
        <option value="amount">金額折抵</option>
        <option value="rate">折數</option>
      </select>
      <input id="c_amount" placeholder="金額" type="number">
      <input id="c_rate" placeholder="折數 0.9" type="number" step="0.01">
      <input id="c_min" placeholder="最低消費" type="number">
      <input id="c_max" placeholder="總使用次數" type="number">
      <select id="c_once">
        <option value="false">不限會員次數</option>
        <option value="true">每會員限一次</option>
      </select>
      <select id="c_enabled">
        <option value="true">啟用</option>
        <option value="false">停用</option>
      </select>
      <button onclick="addCoupon()">新增 / 更新</button>
    </div>
  </div>

  <div class="card">
    <table id="couponTable">
      <thead>
        <tr>
          <th>CODE</th>
          <th>類型</th>
          <th>折扣</th>
          <th>最低消費</th>
          <th>會員限一次</th>
          <th>啟用</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</main>

<script>
const GAS_URL = "請貼上你的 GAS /exec URL";
const ADMIN_KEY = "10years1day911321";

async function apiGet(path){
  const r = await fetch(`${GAS_URL}?path=${path}`);
  return r.json();
}
async function apiPost(path, body, method="POST", id=""){
  const url =
    `${GAS_URL}?path=${path}&key=${ADMIN_KEY}` +
    (method!=="POST" ? `&method=${method}&id=${encodeURIComponent(id)}` : "");
  const r = await fetch(url,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body||{})
  });
  return r.json();
}

/* ===== settings ===== */
async function loadSettings(){
  const s = await apiGet("settings");
  if(!s) return;
  shipping_enabled.value = String(s.shipping_enabled);
  shipping_fee.value = s.shipping_fee;
  free_shipping_threshold.value = s.free_shipping_threshold;
  first_purchase_discount.value = s.first_purchase_discount;
  birthday_discount.value = s.birthday_discount;
}
async function saveSettings(){
  await apiPost("settings_update",{
    shipping_enabled: shipping_enabled.value==="true",
    shipping_fee: Number(shipping_fee.value),
    free_shipping_threshold: Number(free_shipping_threshold.value),
    first_purchase_discount: Number(first_purchase_discount.value),
    birthday_discount: Number(birthday_discount.value)
  });
  settingsMsg.textContent = "已儲存";
}

/* ===== coupons ===== */
async function loadCoupons(){
  const list = await apiGet("coupons");
  const tb = document.querySelector("#couponTable tbody");
  tb.innerHTML = "";
  (list||[]).forEach(c=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${c.code}</td>
      <td>${c.type}</td>
      <td>${c.type==="rate"?c.rate:c.amount}</td>
      <td>${c.minSpend||0}</td>
      <td>${c.oncePerMember}</td>
      <td>${c.enabled}</td>
      <td>
        <button class="sub" onclick='editCoupon(${JSON.stringify(c)})'>編輯</button>
        <button class="danger" onclick='delCoupon("${c.code}")'>刪除</button>
      </td>
    `;
    tb.appendChild(tr);
  });
}
function editCoupon(c){
  c_code.value = c.code;
  c_type.value = c.type;
  c_amount.value = c.amount||"";
  c_rate.value = c.rate||"";
  c_min.value = c.minSpend||"";
  c_max.value = c.maxUses||"";
  c_once.value = String(!!c.oncePerMember);
  c_enabled.value = String(!!c.enabled);
}
async function addCoupon(){
  const code = c_code.value.trim().toUpperCase();
  if(!code) return;
  await apiPost("coupons",{
    code,
    type: c_type.value,
    amount: Number(c_amount.value||0),
    rate: Number(c_rate.value||0),
    minSpend: Number(c_min.value||0),
    maxUses: Number(c_max.value||0),
    oncePerMember: c_once.value==="true",
    enabled: c_enabled.value==="true"
  });
  loadCoupons();
}
async function delCoupon(code){
  if(!confirm("確定刪除 "+code+" ?")) return;
  await apiPost("coupons",null,"DELETE",code);
  loadCoupons();
}

loadSettings();
loadCoupons();
</script>
</body>
</html>
