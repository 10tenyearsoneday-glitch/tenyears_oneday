<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>會員中心</title>
<script src="include.js"></script>
<style>
body{font-family:"Noto Serif TC";padding:40px}
</style>
</head>
<body>

<h2 id="hello"></h2>
<div id="discount"></div>

<p>電話：<span id="phone"></span></p>
<p>地址：<input id="addr"><button onclick="save()">儲存</button></p>

<h3>我的訂單</h3>
<ul id="orders"></ul>

<script>
const API="https://script.google.com/macros/s/AKfycbxV6GCa_MUn-s-bNMH7Y7HJzF1DL1oJ2mb9taU8tGprY8fqb-DxknfFfOBzRWHi3RZzMw/exec";
const OLD_ORDER_API="https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";
const token=localStorage.getItem("TEN_TOKEN");

async function api(path,data){
  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify(Object.assign({path,token},data))
  });
  return r.json();
}

(async()=>{
  const me=await api("member_me",{});
  if(!me.ok){ location.href="member.html"; return; }

  const m=me.member;
  hello.textContent = m.name +
    ((new Date().getMonth()+1===m.birth_m)?" 🎂":"");

  phone.textContent=m.phone;
  addr.value=m.address;

  discount.textContent =
    "首購 / 生日折數會在結帳時自動套用";

  const o=await api("member_orders",{});
  // 這裡再用 OLD_ORDER_API 查你的訂單（照你原本做法）
})();
async function save(){
  await api("member_update",{address:addr.value});
  alert("已更新");
}
</script>
</body>
</html>
