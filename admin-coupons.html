<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>後台管理｜優惠碼 / 運費設定</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .admin-wrap{max-width:980px;margin:auto;padding:18px;}
    .admin-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0 14px;}
    .admin-title{font-size:1.15rem;letter-spacing:.08em;color:rgba(47,58,44,.85)}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn2{border:none;border-radius:999px;padding:10px 14px;background:#5d6b59;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
    .btn2.secondary{background:rgba(0,0,0,.08);color:rgba(47,58,44,.9)}
    .btn2.danger{background:#8a3b3b}
    .hint{font-size:.85rem;opacity:.7}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px;}
    .tab{border:1px solid rgba(0,0,0,.10);background:rgba(255,255,255,.60);padding:10px 14px;border-radius:999px;cursor:pointer}
    .tab.active{background:#2c3a2c;color:#fff;border-color:#2c3a2c}
    .cardx{background:rgba(255,255,255,.70);border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 30px rgba(0,0,0,.06);border-radius:14px;padding:14px;margin-bottom:14px}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .form .full{grid-column:1/-1}
    label{display:block;font-size:.82rem;opacity:.75;margin:2px 0 6px}
    input, select, textarea{
      width:100%;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.12);
      background:rgba(255,255,255,.85);
      outline:none;
    }
    textarea{min-height:90px;resize:vertical}
    .table{width:100%;border-collapse:separate;border-spacing:0 10px;}
    .row{background:rgba(255,255,255,.70);border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 30px rgba(0,0,0,.06);border-radius:14px;overflow:hidden}
    .row td{padding:12px 12px;vertical-align:middle}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.06);font-size:.82rem;white-space:nowrap}
    .pill.on{background:rgba(93,107,89,.18);color:rgba(47,58,44,.9)}
    .pill.off{background:rgba(138,59,59,.12);color:#8a3b3b}
    .toast{margin-top:10px;font-size:.9rem}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;z-index:9999;}
    .modal.open{display:flex}
    .panel{width:min(760px,100%);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:18px;padding:16px 16px 14px;border:1px solid rgba(0,0,0,.08);max-height:calc(100vh - 36px);overflow:auto;}
    .panel-actions{position:sticky;bottom:0;background:rgba(255,255,255,.92);padding:12px 0 4px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid rgba(0,0,0,.06);}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid2 .full{grid-column:1/-1}
    .muted{opacity:.75}
  </style>
</head>
<body>
<script>
(function(){
 const t=localStorage.getItem("ten_admin_token");
 const e=Number(localStorage.getItem("ten_admin_exp")||0);

 if(t!=="ok"||Date.now()>e){
   localStorage.clear();
   location.href="admin-login.html";
 }
})();
</script>
 <button class="ck-btn primary" id="logout">登出</button>
<script>
logout.onclick=()=>{
 localStorage.clear();
 location.href="admin-login.html";
};
</script>

<main class="admin-wrap">
  <div class="admin-top">
    <div>
      <div class="admin-title">後台管理（優惠碼 / 運費設定）</div>
      <div class="hint">這頁會直接寫入 Google Sheet（需要 ADMIN_KEY）。</div>
    </div>
    <div class="admin-actions">
      <a class="btn2 secondary" href="admin.html">← 回商品後台</a>
      <button class="btn2 secondary" id="btnReload" type="button">重新載入</button>
         <a class="btn2 secondary" href="orders.html">訂單管理</a>
      <button class="btn2" id="btnAddCoupon" type="button">新增優惠碼</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="settings" type="button">運費 / 折扣設定</button>
    <button class="tab" data-tab="coupons" type="button">優惠碼管理</button>
  </div>

  <!-- Settings -->
  <section id="tabSettings" class="cardx">
    <h3 style="margin:0 0 10px;">運費 / 首購 / 生日月</h3>
    <div class="form">
      <div>
        <label>是否啟用運費（shipping_enabled）</label>
        <select id="sShipEnabled">
          <option value="true">啟用</option>
          <option value="false">停用（全站免運）</option>
        </select>
      </div>
      <div>
        <label>運費（shipping_fee）</label>
        <input id="sShipFee" type="number" min="0" step="1" placeholder="例如 60">
      </div>
      <div>
        <label>免運門檻（free_shipping_threshold）</label>
        <input id="sFreeOver" type="number" min="0" step="1" placeholder="例如 1000">
      </div>
    
      <div class="full">
        <button class="btn2" id="btnSaveSettings" type="button">儲存設定</button>
        <div class="toast" id="toastSettings"></div>
      </div>
    </div>
  </section>

  <!-- Coupons -->
  <section id="tabCoupons" class="cardx" style="display:none;">
    <h3 style="margin:0 0 10px;">優惠碼列表</h3>
    <table class="table" id="tblCoupons"></table>
    <div class="toast" id="toastCoupons"></div>
  </section>
</main>

<!-- Coupon Modal -->
<div class="modal" id="modal">
  <div class="panel">
    <h3 id="modalTitle" style="margin:0 0 10px;">新增優惠碼</h3>

    <div class="grid2">
      <div>
        <label>優惠碼 code（主鍵，英數）</label>
        <input id="cCode" placeholder="例如 HELLO" style="text-transform:uppercase">
      </div>
      <div>
        <label>啟用 enabled</label>
        <select id="cEnabled">
          <option value="true">啟用</option>
          <option value="false">停用</option>
        </select>
      </div>

      <div>
        <label>類型 type</label>
        <select id="cType">
          <option value="rate">打折（rate）</option>
          <option value="amount">折抵金額（amount）</option>
        </select>
      </div>
      <div>
        <label>rate（例如 0.9）</label>
        <input id="cRate" type="number" min="0" max="1" step="0.01" placeholder="0.9">
      </div>

      <div>
        <label>amount（例如 100）</label>
        <input id="cAmount" type="number" min="0" step="1" placeholder="100">
      </div>
      <div>
        <label>最低消費 minSpend</label>
        <input id="cMinSpend" type="number" min="0" step="1" placeholder="0">
      </div>

      <div>
        <label>開始 startAt（可空）</label>
        <input id="cStartAt" type="datetime-local">
      </div>
      <div>
        <label>結束 endAt（可空）</label>
        <input id="cEndAt" type="datetime-local">
      </div>

      <div>
        <label>每會員限用一次 oncePerMember</label>
        <select id="cOnce">
          <option value="false">否</option>
          <option value="true">是</option>
        </select>
      </div>
      <div>
        <label>全站限量 maxUses（0=不限）</label>
        <input id="cMaxUses" type="number" min="0" step="1" placeholder="0">
      </div>

      <div class="full">
        <label>備註 note</label>
        <textarea id="cNote" placeholder="例如：新客優惠"></textarea>
      </div>
    </div>

    <div class="panel-actions">
      <button class="btn2 secondary" id="btnCancel" type="button">取消</button>
      <button class="btn2 danger" id="btnDelete" type="button" style="display:none;">刪除</button>
      <button class="btn2" id="btnSave" type="button">儲存</button>
    </div>

    <div class="hint muted" id="modalHint" style="margin-top:10px;"></div>
  </div>
</div>

<script>
(() => {
  // ✅ 改成你的
  const GAS_URL = "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";
  const ADMIN_KEY = "10years1day911321";

  const $ = (id) => document.getElementById(id);

  const tabs = document.querySelectorAll(".tab");
  const tabSettings = $("tabSettings");
  const tabCoupons = $("tabCoupons");

  const btnReload = $("btnReload");
  const btnAddCoupon = $("btnAddCoupon");

  // settings fields
  const sShipEnabled = $("sShipEnabled");
  const sShipFee = $("sShipFee");
  const sFreeOver = $("sFreeOver");
  const sFirstRate = $("sFirstRate");
  const sBdayRate = $("sBdayRate");
  const btnSaveSettings = $("btnSaveSettings");
  const toastSettings = $("toastSettings");

  // coupons
  const tblCoupons = $("tblCoupons");
  const toastCoupons = $("toastCoupons");

  // modal
  const modal = $("modal");
  const modalTitle = $("modalTitle");
  const modalHint = $("modalHint");
  const btnCancel = $("btnCancel");
  const btnDelete = $("btnDelete");
  const btnSave = $("btnSave");

  const cCode = $("cCode");
  const cEnabled = $("cEnabled");
  const cType = $("cType");
  const cRate = $("cRate");
  const cAmount = $("cAmount");
  const cMinSpend = $("cMinSpend");
  const cStartAt = $("cStartAt");
  const cEndAt = $("cEndAt");
  const cOnce = $("cOnce");
  const cMaxUses = $("cMaxUses");
  const cNote = $("cNote");

  let COUPONS = [];
  let editingCode = null;

  function toast(el, msg, ok=true){
    el.textContent = msg || "";
    el.style.color = ok ? "rgba(47,58,44,.85)" : "#8a3b3b";
  }

  function toISOFromLocal(v){
    // datetime-local => "YYYY-MM-DDTHH:mm"
    const s = String(v || "").trim();
    if(!s) return "";
    const d = new Date(s);
    if (isNaN(d.getTime())) return "";
    return d.toISOString();
  }

  function toLocalFromAny(v){
    // ISO or Date string => "YYYY-MM-DDTHH:mm"
    const s = String(v || "").trim();
    if(!s) return "";
    const d = new Date(s);
    if (isNaN(d.getTime())) return "";
    const pad = (n)=> String(n).padStart(2,"0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function gasPost(path, method, body, id=""){
    const url =
      `${GAS_URL}?path=${encodeURIComponent(path)}` +
      `&key=${encodeURIComponent(ADMIN_KEY)}` +
      (method ? `&method=${encodeURIComponent(method)}` : "") +
      (id ? `&id=${encodeURIComponent(id)}` : "");

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // ✅ 避免 preflight
      body: JSON.stringify(body || {})
    });

    const out = await res.json().catch(()=> ({}));
    if (!res.ok || out?.error) throw new Error(out?.error || "GAS_WRITE_FAILED");
    return out;
  }

  async function loadSettings(){
    toast(toastSettings, "載入設定中…");
    try{
      const res = await fetch(`${GAS_URL}?path=settings`, { cache: "no-store" });
      const s = await res.json().catch(()=> ({}));

      sShipEnabled.value = String(!!(s.shipping_enabled === true || s.shipping_enabled === "TRUE" || s.shipping_enabled === "true"));
      sShipFee.value = Number(s.shipping_fee ?? 0);
      sFreeOver.value = Number(s.free_shipping_threshold ?? 0);
      sFirstRate.value = Number(s.first_purchase_discount ?? 1);
      sBdayRate.value = Number(s.birthday_discount ?? 1);

      toast(toastSettings, "設定已載入 ✅");
    }catch(e){
      console.error(e);
      toast(toastSettings, "載入設定失敗（請看 Console / 檢查 GAS）", false);
    }
  }

  async function saveSettings(){
    toast(toastSettings, "儲存中…");
    try{
      const payload = {
        shipping_enabled: (sShipEnabled.value === "true"),
        shipping_fee: Number(sShipFee.value || 0),
        free_shipping_threshold: Number(sFreeOver.value || 0),
        first_purchase_discount: Number(sFirstRate.value || 1),
        birthday_discount: Number(sBdayRate.value || 1),
      };

      await gasPost("settings_update", "", payload);
      toast(toastSettings, "已儲存 ✅");
      // 同步前台快取：你前台會抓 /settings，所以等下刷新就會更新
    }catch(e){
      console.error(e);
      toast(toastSettings, "儲存失敗（請看 Console / 檢查 ADMIN_KEY / GAS 寫入）", false);
    }
  }

  function pillEnabled(x){
    const on = !!(x.enabled === true || x.enabled === "TRUE" || x.enabled === "true");
    return `<span class="pill ${on ? "on":"off"}">${on ? "啟用":"停用"}</span>`;
  }

  function rowCouponHtml(c){
    const code = String(c.code || "").toUpperCase();
    const type = String(c.type || "");
    const rate = Number(c.rate || 0);
    const amount = Number(c.amount || 0);
    const minSpend = Number(c.minSpend || 0);

    const display =
      type === "rate" ? `打折 ${rate || ""}` :
      type === "amount" ? `折抵 ${amount || ""}` : type;

    return `
      <tr class="row">
        <td style="width:150px;">
          <div style="font-weight:800;letter-spacing:.03em;">${code}</div>
          <div class="mini">${pillEnabled(c)}</div>
        </td>
        <td>
          <div class="mini">類型：${display}</div>
          <div class="mini">門檻：${minSpend > 0 ? ("滿 " + minSpend) : "無"}</div>
          <div class="mini">期限：${c.startAt ? "有" : "無"} ～ ${c.endAt ? "有" : "無"}</div>
        </td>
        <td style="width:120px;text-align:right;">
          <button class="btn2 secondary" type="button" data-edit="${code}">編輯</button>
        </td>
      </tr>
    `;
  }

  function renderCoupons(){
    if(!COUPONS.length){
      tblCoupons.innerHTML = `<tr><td class="muted">目前沒有優惠碼</td></tr>`;
      return;
    }
    tblCoupons.innerHTML = COUPONS.map(rowCouponHtml).join("");
    tblCoupons.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => {
        const code = btn.getAttribute("data-edit");
        const item = COUPONS.find(x => String(x.code || "").toUpperCase() === String(code).toUpperCase());
        if(item) openModal("edit", item);
      });
    });
  }

  async function loadCoupons(){
    toast(toastCoupons, "載入優惠碼中…");
    try{
      const res = await fetch(`${GAS_URL}?path=coupons`, { cache: "no-store" });
      const data = await res.json().catch(()=> ([]));
      COUPONS = Array.isArray(data) ? data : [];
      renderCoupons();
      toast(toastCoupons, `載入完成：${COUPONS.length} 組`);
    }catch(e){
      console.error(e);
      toast(toastCoupons, "載入失敗（請看 Console / 檢查 GAS）", false);
    }
  }

  function openModal(mode, item){
    modal.classList.add("open");

    if(mode === "add"){
      editingCode = null;
      modalTitle.textContent = "新增優惠碼";
      btnDelete.style.display = "none";
      modalHint.textContent = "新增時 code 不可重複。";
      cCode.disabled = false;

      cCode.value = "";
      cEnabled.value = "true";
      cType.value = "rate";
      cRate.value = 0.9;
      cAmount.value = 0;
      cMinSpend.value = 0;
      cStartAt.value = "";
      cEndAt.value = "";
      cOnce.value = "false";
      cMaxUses.value = 0;
      cNote.value = "";

    }else{
      editingCode = String(item.code || "").toUpperCase();
      modalTitle.textContent = `編輯優惠碼：${editingCode}`;
      btnDelete.style.display = "inline-flex";
      modalHint.textContent = "編輯時不建議改 code（如需改，建議新增一組再刪除舊的）。";
      cCode.disabled = true;

      cCode.value = editingCode;
      cEnabled.value = String(!!(item.enabled === true || item.enabled === "TRUE" || item.enabled === "true"));
      cType.value = String(item.type || "rate");
      cRate.value = Number(item.rate ?? 0);
      cAmount.value = Number(item.amount ?? 0);
      cMinSpend.value = Number(item.minSpend ?? 0);
      cStartAt.value = toLocalFromAny(item.startAt);
      cEndAt.value = toLocalFromAny(item.endAt);
      cOnce.value = String(!!(item.oncePerMember === true || item.oncePerMember === "TRUE" || item.oncePerMember === "true"));
      cMaxUses.value = Number(item.maxUses ?? 0);
      cNote.value = String(item.note || "");
    }
  }

  function closeModal(){ modal.classList.remove("open"); }

  function buildCouponPayload(){
    const code = String(cCode.value || "").trim().toUpperCase();
    return {
      code,
      enabled: (cEnabled.value === "true"),
      type: String(cType.value || "rate"),
      rate: Number(cRate.value || 0),
      amount: Number(cAmount.value || 0),
      minSpend: Number(cMinSpend.value || 0),
      startAt: toISOFromLocal(cStartAt.value),
      endAt: toISOFromLocal(cEndAt.value),
      oncePerMember: (cOnce.value === "true"),
      maxUses: Number(cMaxUses.value || 0),
      note: String(cNote.value || "")
    };
  }

  async function saveCoupon(){
    toast(toastCoupons, "");
    try{
      const payload = buildCouponPayload();
      if(!payload.code){
        toast(toastCoupons, "請填 code", false);
        return;
      }
      if(payload.type === "rate" && !(payload.rate > 0 && payload.rate < 1)){
        toast(toastCoupons, "rate 必須是 0~1 之間（例如 0.9）", false);
        return;
      }
      if(payload.type === "amount" && !(payload.amount > 0)){
        toast(toastCoupons, "amount 必須 > 0", false);
        return;
      }

      if(editingCode === null){
        await gasPost("coupons", "POST", payload);
        closeModal();
        await loadCoupons();
        toast(toastCoupons, "新增成功 ✅");
      }else{
        await gasPost("coupons", "PUT", payload, editingCode);
        closeModal();
        await loadCoupons();
        toast(toastCoupons, "儲存成功 ✅");
      }
    }catch(e){
      console.error(e);
      toast(toastCoupons, "儲存失敗（請看 Console / 檢查 ADMIN_KEY / GAS 寫入）", false);
    }
  }

  async function deleteCoupon(){
    if(!editingCode) return;
    const ok = confirm(`確定刪除優惠碼 ${editingCode} 嗎？`);
    if(!ok) return;

    try{
      await gasPost("coupons", "DELETE", {}, editingCode);
      closeModal();
      await loadCoupons();
      toast(toastCoupons, "刪除成功 ✅");
    }catch(e){
      console.error(e);
      toast(toastCoupons, "刪除失敗（請看 Console / 檢查 ADMIN_KEY / GAS 寫入）", false);
    }
  }

  function switchTab(key){
    tabs.forEach(t => t.classList.toggle("active", t.dataset.tab === key));
    tabSettings.style.display = (key === "settings") ? "" : "none";
    tabCoupons.style.display = (key === "coupons") ? "" : "none";
  }

  // events
  tabs.forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));

  btnReload.addEventListener("click", async () => {
    await loadSettings();
    await loadCoupons();
  });
  btnAddCoupon.addEventListener("click", () => openModal("add", null));
  btnSaveSettings.addEventListener("click", saveSettings);

  btnCancel.addEventListener("click", closeModal);
  btnSave.addEventListener("click", saveCoupon);
  btnDelete.addEventListener("click", deleteCoupon);

  modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });

  // init
  (async () => {
    await loadSettings();
    await loadCoupons();
  })();
})();
</script>

</body>
</html>
