
<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>商品管理</title><script src="include.js"></script></head>
<body>
<h2>商品管理（原本新增方式）</h2>
<input id="imgFile" type="file" accept="image/*"><br>
<input id="imgSlug"><button id="copySlug">複製檔名</button><br>
<input id="imgUrl"><button id="copyUrl">複製網址</button><br>
<img id="imgPreview" style="max-width:200px;display:none">
<script>
const IMG_BASE = location.origin + "/assets/products/";
const imgFile = document.getElementById("imgFile");
const imgSlug = document.getElementById("imgSlug");
const imgUrl  = document.getElementById("imgUrl");
const imgPreview = document.getElementById("imgPreview");
imgFile.onchange=()=>{
  const f=imgFile.files[0]; if(!f)return;
  const ext=f.name.split(".").pop();
  const name="product-"+Date.now()+"."+ext;
  imgSlug.value=name;
  imgUrl.value=IMG_BASE+encodeURIComponent(name);
  imgPreview.src=URL.createObjectURL(f);
  imgPreview.style.display="block";
};
copySlug.onclick=()=>navigator.clipboard.writeText(imgSlug.value);
copyUrl.onclick=()=>navigator.clipboard.writeText(imgUrl.value);
</script>
</body></html>
