<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十年一日｜後台管理</title>

  <!-- 你剛剛自己驗證過：少了這個樣式就會壞 -->
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>
  <!-- 可選：上方標題區 -->
  <div class="admin-wrap" style="max-width:1100px;margin:0 auto;padding:18px 14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;">
      <h1 style="margin:0;font-size:18px;letter-spacing:.08em;">後台｜商品管理</h1>
      <div style="display:flex;gap:8px;">
        <a class="btn" href="./admin-coupons.html">優惠碼</a>
        <button class="btn primary" id="btnOpenCreate">＋ 新增商品</button>
      </div>
    </div>

    <!-- 篩選列 -->
    <div class="card" style="padding:12px;margin-bottom:12px;">
      <div style="display:grid;grid-template-columns: 1fr 1fr 1fr 1fr; gap:10px;">
        <div>
          <label>系列</label>
          <select id="filterSeries">
            <option value="">全部</option>
            <option value="韓系飾品">韓系飾品</option>
            <option value="純銀飾品">純銀飾品</option>
          </select>
        </div>
        <div>
          <label>分類</label>
          <select id="filterCategory">
            <option value="">全部</option>
            <option value="項鍊">項鍊</option>
            <option value="手鏈">手鏈</option>
            <option value="耳環">耳環</option>
            <option value="戒指">戒指</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div>
          <label>狀態</label>
          <select id="filterStatus">
            <option value="">全部</option>
            <option value="上架">上架</option>
            <option value="下架">下架</option>
          </select>
        </div>
        <div>
          <label>搜尋</label>
          <input id="filterQ" placeholder="輸入 id / title" />
        </div>
      </div>
    </div>

    <!-- 列表 -->
    <div class="card" style="overflow:auto;">
      <table class="admin-table" style="width:100%;border-collapse:collapse;">
        <thead>
          <tr>
            <th style="min-width:110px;">id</th>
            <th style="min-width:160px;">title</th>
            <th style="min-width:110px;">series</th>
            <th style="min-width:90px;">category</th>
            <th style="min-width:90px;">price</th>
            <th style="min-width:90px;">status</th>
            <th style="min-width:180px;">image</th>
            <th style="min-width:140px;">updatedAt</th>
            <th style="min-width:140px;">操作</th>
          </tr>
        </thead>
        <tbody id="productTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ✅ 新增/編輯：彈窗（按下才出現，不佔版面） -->
  <div id="pModalBd" class="modal-bd" hidden></div>
  <div id="pModal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <div id="pModalTitle" class="modal-title">新增商品</div>
        <button id="pModalClose" class="modal-x" type="button">✕</button>
      </div>

      <form id="pForm" class="modal-body">
        <div class="grid2">
          <div>
            <label>商品ID *</label>
            <input id="fId" placeholder="例如: P001" required />
          </div>
          <div>
            <label>名稱 *</label>
            <input id="fTitle" placeholder="商品名稱" required />
          </div>

          <div>
            <label>系列 *</label>
            <select id="fSeries" required>
              <option value="韓系飾品">韓系飾品</option>
              <option value="純銀飾品">純銀飾品</option>
            </select>
            <div style="font-size:12px;opacity:.7;margin-top:4px;">選「純銀飾品」就會出現在純銀頁面（前台是用 series 過濾）。</div>
          </div>

          <div>
            <label>分類 *</label>
            <select id="fCategory" required>
              <option value="項鍊">項鍊</option>
              <option value="手鏈">手鏈</option>
              <option value="耳環">耳環</option>
              <option value="戒指">戒指</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div>
            <label>價格 *</label>
            <input id="fPrice" type="number" min="0" step="1" placeholder="0" required />
          </div>

          <div>
            <label>狀態 *</label>
            <select id="fStatus" required>
              <option value="上架">上架</option>
              <option value="下架">下架</option>
            </select>
          </div>

          <div style="grid-column:1/-1;">
            <label>主圖網址（image）</label>
            <input id="fImage" placeholder="https://...jpg" />
          </div>

          <div style="grid-column:1/-1;">
            <label>多圖網址（images，用逗號分隔）</label>
            <textarea id="fImages" rows="2" placeholder="https://...1.jpg, https://...2.jpg"></textarea>
          </div>

          <div style="grid-column:1/-1;">
            <label>描述（desc）</label>
            <textarea id="fDesc" rows="4" placeholder="商品描述..."></textarea>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="btnDelete">刪除</button>
          <div style="flex:1"></div>
          <button type="button" class="btn" id="btnCancel">取消</button>
          <button type="submit" class="btn primary" id="btnSave">儲存</button>
        </div>

        <div id="pToast" class="toast"></div>
      </form>
    </div>
  </div>

  <!-- ✅ 你可以不接 include-common.js；這版 include-admin.js 會自帶必需工具 -->
  <script src="./include-admin.js"></script>
</body>
</html>
