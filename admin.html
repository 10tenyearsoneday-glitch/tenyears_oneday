<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>後台管理｜商品</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>後台管理（商品）</h1>
  <p>這頁會直接寫入 Google Sheet（需要 ADMIN_KEY）。</p>

  <div class="actions">
    <a href="./admin-coupons.html">優惠碼 / 運費設定</a>
    <button class="reload">重新載入</button>
    <button class="add-product">新增商品</button>
  </div>

  <!-- 商品表格 -->
  <table id="tbl"></table>

  <!-- 提示訊息 -->
  <div id="toast"></div>

  <!-- 共用 Modal -->
  <div id="modalBackdrop" class="modal-backdrop" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <h2 id="modalTitle">操作</h2>
      <form id="modalForm">
        <div id="modalFields"></div>
        <div class="modal-actions">
          <button type="submit">確認</button>
          <button type="button" id="modalCancel">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 先載入共用，再載入 admin -->
  <script src="./include-common.js"></script>
  <script src="./include-admin.js"></script>
</body>
</html>
