<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>後台管理｜十年一日</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { background:#fafafa; }
    .admin-wrap { max-width:1100px; margin:40px auto; padding:0 16px; }
    .admin-tabs { display:flex; gap:8px; margin-bottom:24px; }
    .admin-tabs button {
      padding:10px 16px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,.15);
      background:#fff;
      cursor:pointer;
    }
    .admin-tabs button.active {
      background:#2f3a2c;
      color:#fff;
      border-color:#2f3a2c;
    }
    .admin-tab { display:none; }
    .admin-tab.active { display:block; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:8px; border-bottom:1px solid #ddd; text-align:left; }
    input,select,textarea {
      padding:6px 8px;
      width:100%;
      box-sizing:border-box;
    }
    .row-actions button { margin-right:6px; }
  </style>
</head>

<body>
<div class="admin-wrap">

  <h1>後台管理</h1>

  <!-- Tabs -->
  <div class="admin-tabs">
    <button data-tab="products" class="active">商品管理</button>
    <button data-tab="coupons">優惠碼管理</button>
    <button data-tab="settings">運費 / 折扣</button>
  </div>

  <!-- 商品 -->
  <section id="tab-products" class="admin-tab active">
    <p>⚠️ 這裡保留你原本商品後台（不動結構）</p>
    <iframe src="admin-products.html" style="width:100%;height:70vh;border:none;"></iframe>
  </section>

  <!-- 優惠碼 -->
  <section id="tab-coupons" class="admin-tab">
    <h2>優惠碼管理</h2>

    <button id="btnAddCoupon">＋ 新增優惠碼</button>

    <table id="couponTable">
      <thead>
        <tr>
          <th>Code</th>
          <th>啟用</th>
          <th>類型</th>
          <th>折扣</th>
          <th>最低金額</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" class="admin-tab">
    <h2>運費 / 折扣設定</h2>

    <label>
      運費金額
      <input id="set_shipping_fee" type="number">
    </label>

    <label>
      免運門檻
      <input id="set_free_shipping_threshold" type="number">
    </label>

    <label>
      首購折扣（0.9 = 9折）
      <input id="set_first_purchase_discount" type="number" step="0.01">
    </label>

    <label>
      生日折扣
      <input id="set_birthday_discount" type="number" step="0.01">
    </label>

    <button id="btnSaveSettings">儲存設定</button>
  </section>

</div>

<script src="admin.js"></script>
</body>
</html>
