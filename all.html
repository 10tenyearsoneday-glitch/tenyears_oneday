
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>韓系飾品｜十年一日</title>
<script src="include.js"></script></head>
<body>
<h2>韓系飾品</h2>
<div id="list"></div>
<script>
fetch(TEN_CONFIG.PRODUCTS_GAS+"?path=products").then(r=>r.json()).then(d=>{
  const items=d.filter(p=>p.status==='上架' && String(p.series||'').trim()==='韓系飾品');
  document.getElementById("list").innerHTML=items.length
    ? items.map(p=>"<div>"+p.title+"</div>").join("")
    : "<p>目前尚無「韓系飾品」商品（請到後台把商品 series 設為「韓系飾品」）。</p>";
});
</script>
</body></html>
