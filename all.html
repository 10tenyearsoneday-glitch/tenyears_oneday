<!doctype html>
<html lang="zh-Hant">
<head>
<title>十年一日｜全系列</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>

<main>
<div class="subcats" id="subcats">
  <button class="chip active" data-filter="全部" type="button">全部</button>
  <button class="chip" data-filter="項鍊" type="button">項鍊</button>
  <button class="chip" data-filter="手鏈" type="button">手鏈</button>
  <button class="chip" data-filter="耳環" type="button">耳環</button>
  <button class="chip" data-filter="戒指" type="button">戒指</button>
  <button class="chip" data-filter="其他" type="button">其他</button>
  
  </div>
  <!-- ✅ 優惠提示列 -->
<div class="grid" id="productGrid"></div>
</main>

<footer>
  <a class="admin-link" href="admin.html" aria-label="admin"></a>
  <div class="footer-row">
    <div class="col">💎 精選材質<small>不含鉛，安心佩戴</small></div>
    <div class="col center">✨ 獨特設計<small>韓日歐美風格齊聚</small></div>
    <div class="col right">🚚 便利配送<small>超商取貨、宅配到府</small></div>
  </div>
  <div class="footer-brand">
    <div class="t">十年一日</div>
    <div class="s">tenyears_oneday</div>
  </div>
  <div class="footer-links">
  <a href="https://www.instagram.com/tenyears_oneday" target="_blank">Instagram</a>
  <span>｜</span>
  <a href="https://line.me/R/ti/p/@396kwrga" target="_blank">LINE</a>
</div>


</footer>
  <!-- ✅ 商品跳出框框 Modal -->
<div class="ui-backdrop" id="pdBackdrop" aria-hidden="true">
  <div class="ui-panel" role="dialog" aria-modal="true" aria-label="商品資訊">
    <div class="ui-hd">
      <div style="font-weight:800;">商品資訊</div>
      <button class="ui-close" id="pdClose" aria-label="關閉">×</button>
    </div>

    <div class="pd-wrap" id="pdWrap">
      <!-- 內容由 JS 塞 -->
    </div>
  </div>
</div>

<button id="backToTop" aria-label="回到頂端">↑</button>

<script src="include.js"></script>
<script>
  const API_BASE = "https://tenyears-oneday-api.onrender.com";

  const grid = document.getElementById("productGrid");
  const chips = document.querySelectorAll("#subcats .chip");

  // ✅ settings 預設值
  let SETTINGS = {
    shipping_enabled: true,
    shipping_fee: 60,
    free_shipping_threshold: 1000,
    first_purchase_discount: 0.9,
    birthday_discount: 0.85
  };

  let ALL_PRODUCTS = [];

  // ✅ 多圖：統一從各種欄位抓出來
  function getImages(p){
    let arr = [];

    if(Array.isArray(p.images)) arr = arr.concat(p.images);
    if(Array.isArray(p.image_urls)) arr = arr.concat(p.image_urls);

    if(typeof p.images_csv === "string" && p.images_csv.trim()){
      arr = arr.concat(p.images_csv.split(",").map(s=>s.trim()).filter(Boolean));
    }

    ["image","image2","image3","image4","image5"].forEach(k=>{
      if(typeof p[k] === "string" && p[k].trim()) arr.push(p[k].trim());
    });

    arr = arr.filter(Boolean);
    arr = [...new Set(arr)];
    if(!arr.length) arr = ["assets/placeholder.png"];
    return arr;
  }

  // ✅ 商品卡：前 2 張 eager + high priority
  function productCard(p, index){
    const isHero = index < 2;
    const loading = isHero ? "eager" : "lazy";
    const fetchprio = isHero ? 'fetchpriority="high"' : "";

    const img = (p.image || p.image1 || p.cover || "assets/placeholder.png");
    const title = p.title || "（未命名）";
    const series = p.series || "全系列";
    const cat = p.category || "其他";
    const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);

    return `
      <a class="product-link js-open-product"
         href="#"
         data-id="${encodeURIComponent(p.id)}">
        <div class="product">
          <div class="thumb">
            <img 
              src="${img}"
              alt="${title}"
              loading="${loading}"
              decoding="async"
              ${fetchprio}
            >
          </div>

          <div class="body">
            <div>
              <div class="name">${title}</div>
              <div class="meta">${series}｜${cat}</div>
            </div>
            <div class="price">NT$ ${price}</div>
          </div>
        </div>
      </a>
    `;
  }

  function render(products){
    grid.innerHTML = products.map((p, i) => productCard(p, i)).join("");

    // ✅ 預載第一張（render 之後才知道是哪張）
    const firstImg = products?.[0]?.image || products?.[0]?.image1 || products?.[0]?.cover;
    if(firstImg && !document.querySelector('link[data-preload="first-product"]')){
      const link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.href = firstImg;
      link.setAttribute("data-preload","first-product");
      document.head.appendChild(link);
    }
  }

  function applyFilter(filter){
    const visible = ALL_PRODUCTS
      .filter(p => (p.status || "上架") === "上架")
      .filter(p => {
        const cat = p.category || "其他";
        return (filter === "全部" || cat === filter);
      });

    render(visible);
  }

  // ✅ 子分類切換
  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      chips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");

      const f = chip.dataset.filter || "全部";
      applyFilter(f);
      grid.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });

  // ✅ settings 快取（不阻塞頁面）
  async function loadSettings(){
    const cacheKey = "tyod_settings_cache_v1";
    const cached = localStorage.getItem(cacheKey);

    if(cached){
      try{
        const s = JSON.parse(cached);
        if(s && typeof s === "object"){
          SETTINGS = { ...SETTINGS, ...s };
        }
      }catch(e){}
    }

    try{
      const res = await fetch(`${API_BASE}/settings`, { cache: "no-store" });
      if(!res.ok) throw new Error("settings error " + res.status);

      const s = await res.json();
      if(s && typeof s === "object"){
        SETTINGS = {
          ...SETTINGS,
          ...s,
          shipping_fee: Number(s.shipping_fee ?? SETTINGS.shipping_fee),
          free_shipping_threshold: Number(s.free_shipping_threshold ?? SETTINGS.free_shipping_threshold),
          first_purchase_discount: Number(s.first_purchase_discount ?? SETTINGS.first_purchase_discount),
          birthday_discount: Number(s.birthday_discount ?? SETTINGS.birthday_discount),
          shipping_enabled: !!s.shipping_enabled
        };
        localStorage.setItem(cacheKey, JSON.stringify(SETTINGS));
      }
    }catch(e){
      console.warn("loadSettings failed, fallback cache/default", e);
    }
  }

  // ✅ products 快取：秒顯示 + 背景更新
  async function loadProducts(){
    const cacheKey = "tyod_products_cache_v1";
    const cached = localStorage.getItem(cacheKey);

    if(cached){
      try{
        ALL_PRODUCTS = JSON.parse(cached) || [];
        applyFilter(document.querySelector("#subcats .chip.active")?.dataset.filter || "全部");
      }catch(e){}
    }else{
      grid.innerHTML = `<div style="opacity:.7; padding:18px;">載入中...</div>`;
    }

    try{
      const res = await fetch(`${API_BASE}/products`, { cache: "no-store" });
      if(!res.ok) throw new Error("API error " + res.status);
      const data = await res.json();

      ALL_PRODUCTS = Array.isArray(data) ? data : [];
      localStorage.setItem(cacheKey, JSON.stringify(ALL_PRODUCTS));

      applyFilter(document.querySelector("#subcats .chip.active")?.dataset.filter || "全部");
    }catch(err){
      console.error(err);
      if(!cached){
        grid.innerHTML = `<div style="color:#8a3b3b; padding:18px;">商品載入失敗，請稍後再試。</div>`;
      }
    }
  }

  // ===== 商品 Modal：多圖版 =====
  const pdBackdrop = document.getElementById("pdBackdrop");
  const pdClose = document.getElementById("pdClose");
  const pdWrap = document.getElementById("pdWrap");

  function openProductModalById(id){
    const p = ALL_PRODUCTS.find(x => String(x.id) === String(id));
    if(!p) return;

    const title = p.title || "（未命名）";
    const cat = p.category || "其他";
    const series = p.series || "全系列";
    const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);
    const desc = p.description || p.desc || "（尚未提供商品說明）";

    const imgs = getImages(p);
    const main = imgs[0];

    pdWrap.innerHTML = `
      <div class="pd-grid">
        <div class="pd-media">
          <img id="pdMainImg" src="${main}" alt="${title}" loading="eager" decoding="async">
          ${imgs.length > 1 ? `
            <div class="pd-thumbs">
              ${imgs.map((src,i)=>`
                <button class="pd-thumb ${i===0?'active':''}" type="button" data-src="${src}">
                  <img src="${src}" alt="${title} ${i+1}" loading="lazy" decoding="async">
                </button>
              `).join("")}
            </div>
          ` : ``}
        </div>

        <div class="pd-info">
          <h2 class="pd-name">${title}</h2>
          <div class="pd-meta">${series}｜${cat}</div>
          <div class="pd-price">NT$ ${price}</div>
          <div class="pd-desc">${desc}</div>
<div class="pd-actions">
  <div class="qty">
    <button class="qty-btn" type="button" id="qtyMinus" aria-label="減少">−</button>
    <input class="qty-input" id="qtyInput" type="number" min="1" value="1" inputmode="numeric">
    <button class="qty-btn" type="button" id="qtyPlus" aria-label="增加">+</button>
  </div>

  <button class="pd-btn primary" type="button" id="pdAddCart">加入購物車</button>
  <button class="pd-btn secondary" type="button" id="pdClose2">關閉</button>
</div>


          <div class="pd-toast" id="pdToast" style="display:none;">已加入購物車 ✅</div>
        </div>
      </div>
    `;

    // ✅ 縮圖切換
    const mainImgEl = pdWrap.querySelector("#pdMainImg");
    pdWrap.querySelectorAll(".pd-thumb").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        pdWrap.querySelectorAll(".pd-thumb").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        mainImgEl.src = btn.dataset.src;
      });
    });

    // 先做最小版：加入購物車先提示（下一步接購物車抽屜）
    pdWrap.querySelector("#pdAddCart").addEventListener("click", () => {
      const t = pdWrap.querySelector("#pdToast");
      t.style.display = "block";
      setTimeout(()=> t.style.display="none", 1200);
    });
    pdWrap.querySelector("#pdClose2").addEventListener("click", closeProductModal);

    pdBackdrop.classList.add("open");
    pdBackdrop.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeProductModal(){
    pdBackdrop.classList.remove("open");
    pdBackdrop.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  pdClose.addEventListener("click", closeProductModal);
  pdBackdrop.addEventListener("click", (e) => {
    if(e.target === pdBackdrop) closeProductModal();
  });
  window.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && pdBackdrop.classList.contains("open")) closeProductModal();
  });

  // ✅ 點商品開 modal（事件委派）
  document.addEventListener("click", (e) => {
    const a = e.target.closest(".js-open-product");
    if(!a) return;
    e.preventDefault();
    const id = decodeURIComponent(a.dataset.id || "");
    openProductModalById(id);
  });

  // ===== 回到頂端 =====
  const btn = document.getElementById("backToTop");
  window.addEventListener("scroll", () => {
    btn.style.display = window.scrollY > 300 ? "block" : "none";
  });
  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ===== init =====
  loadProducts(); // 先快顯商品
  loadSettings(); // 背景載入設定
  // ===== Cart (localStorage) =====
const CART_KEY = "tyod_cart_v1";

function readCart(){
  try{
    return JSON.parse(localStorage.getItem(CART_KEY) || "[]");
  }catch(e){
    return [];
  }
}

function writeCart(items){
  localStorage.setItem(CART_KEY, JSON.stringify(items));
}

function addToCart(product, qty){
  const items = readCart();
  const id = String(product.id);

  // ✅ 同一商品 id：累加數量
  const hit = items.find(x => String(x.id) === id);
  if(hit){
    hit.qty = Number(hit.qty || 0) + Number(qty || 1);
  }else{
    items.push({
      id,
      title: product.title || "（未命名）",
      price: Number(product.price || 0),
      image: (product.image || product.image1 || product.cover || "assets/placeholder.png"),
      qty: Number(qty || 1)
    });
  }

  writeCart(items);
  updateCartBadge();
}

function cartCount(){
  return readCart().reduce((sum, it) => sum + Number(it.qty || 0), 0);
}

// 如果你的 header 有 badge 元素（例如 id="cartCount"），會自動更新
function updateCartBadge(){
  const el = document.getElementById("cartCount");
  if(!el) return;

  const n = cartCount();
  if(n > 0){
    el.textContent = String(n);
    el.style.display = "inline-flex";
    el.classList.add("cart-badge");
  }else{
    el.textContent = "";
    el.style.display = "none";
  }
}

</script>

</body>
</html>
