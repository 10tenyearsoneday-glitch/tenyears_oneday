<!doctype html>
<html lang="zh-Hant">
<head>
<title>十年一日｜全系列</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>

<main>
<div class="subcats" id="subcats">
  <button class="chip active" data-filter="全部" type="button">全部</button>
  <button class="chip" data-filter="項鍊" type="button">項鍊</button>
  <button class="chip" data-filter="手鏈" type="button">手鏈</button>
  <button class="chip" data-filter="耳環" type="button">耳環</button>
  <button class="chip" data-filter="戒指" type="button">戒指</button>
  <button class="chip" data-filter="其他" type="button">其他</button>
  
  </div>
  <!-- ✅ 優惠提示列 -->
<div class="grid" id="productGrid"></div>
</main>

<footer>
  <a class="admin-link" href="admin.html" aria-label="admin"></a>
  <div class="footer-row">
    <div class="col">💎 精選材質<small>不含鉛，安心佩戴</small></div>
    <div class="col center">✨ 獨特設計<small>韓日歐美風格齊聚</small></div>
    <div class="col right">🚚 便利配送<small>超商取貨、宅配到府</small></div>
  </div>
  <div class="footer-brand">
    <div class="t">十年一日</div>
    <div class="s">tenyears_oneday</div>
  </div>
  <div class="footer-links">
  <a href="https://www.instagram.com/tenyears_oneday" target="_blank">Instagram</a>
  <span>｜</span>
  <a href="https://line.me/R/ti/p/@396kwrga" target="_blank">LINE</a>
</div>


</footer>
  <!-- ✅ 商品跳出框框 Modal -->
<div class="ui-backdrop" id="pdBackdrop" aria-hidden="true">
  <div class="ui-panel" role="dialog" aria-modal="true" aria-label="商品資訊">
    <div class="ui-hd">
      <div style="font-weight:800;">商品資訊</div>
      <button class="ui-close" id="pdClose" aria-label="關閉">×</button>
    </div>

    <div class="pd-wrap" id="pdWrap">
      <!-- 內容由 JS 塞 -->
    </div>
  </div>
</div>

<button id="backToTop" aria-label="回到頂端">↑</button>

<script src="include.js"></script>
<script>
  const API_BASE = "https://tenyears-oneday-api.onrender.com";

  const grid = document.getElementById("productGrid");
  const chips = document.querySelectorAll("#subcats .chip");
  const promoBar = document.getElementById("promoBar");

  // ✅ settings 預設值
  let SETTINGS = {
    shipping_enabled: true,
    shipping_fee: 60,
    free_shipping_threshold: 1000,
    first_purchase_discount: 0.9,
    birthday_discount: 0.85
  };

  function rateToZhe(rate){
    if(rate >= 1 || rate <= 0) return null;
    const z = Math.round(rate * 100) / 10;
    return String(z).replace(/\.0$/, "");
  }

  let ALL_PRODUCTS = [];

function productCard(p, index){
  const isHero = index < 2; // 前 2 個商品
  const loading = isHero ? "eager" : "lazy";
  const fetchprio = isHero ? 'fetchpriority="high"' : "";

  return `
    <a class="product-link js-open-product"
       href="#"
       data-id="${encodeURIComponent(p.id)}">
      <div class="product">
        <div class="thumb">
          <img 
            src="${p.image || 'assets/placeholder.png'}"
            alt="${p.title}"
            loading="${loading}"
            decoding="async"
            ${fetchprio}
          >
        </div>

        <div class="body">
          <div>
            <div class="name">${p.title}</div>
            <div class="meta">${p.series}｜${p.category}</div>
          </div>
          <div class="price">NT$ ${p.price}</div>
        </div>
      </div>
    </a>
  `;
}


function render(products){
 grid.innerHTML = products.map((p, i) => productCard(p, i)).join("");
}

  async function loadSettings(){
    try{
      const res = await fetch(`${API_BASE}/settings`, { cache: "no-store" });
      if(!res.ok) throw new Error("settings error " + res.status);

      const s = await res.json();
      if(s && typeof s === "object"){
        SETTINGS = {
          ...SETTINGS,
          ...s,
          shipping_fee: Number(s.shipping_fee ?? SETTINGS.shipping_fee),
          free_shipping_threshold: Number(s.free_shipping_threshold ?? SETTINGS.free_shipping_threshold),
          first_purchase_discount: Number(s.first_purchase_discount ?? SETTINGS.first_purchase_discount),
          birthday_discount: Number(s.birthday_discount ?? SETTINGS.birthday_discount),
          shipping_enabled: !!s.shipping_enabled
        };
      }
    }catch(e){
      console.warn("loadSettings failed, fallback defaults", e);
    }

    renderPromoBar();
  }

  function renderPromoBar(){
    if(!promoBar) return;

    const shipOn = !!SETTINGS.shipping_enabled;
    const fee = Number(SETTINGS.shipping_fee || 0);
    const freeOver = Number(SETTINGS.free_shipping_threshold || 0);

    const firstRate = Number(SETTINGS.first_purchase_discount || 1);
    const bdayRate  = Number(SETTINGS.birthday_discount || 1);

    const items = [];

    if(shipOn){
      items.push(`運費 NT$${fee}`);
      if(freeOver > 0) items.push(`滿 NT$${freeOver} 免運`);
    }else{
      items.push(`免運活動中`);
    }

    const firstZhe = rateToZhe(firstRate);
    const bdayZhe  = rateToZhe(bdayRate);

    if(firstZhe) items.push(`首購 ${firstZhe} 折`);
    if(bdayZhe)  items.push(`生日月 ${bdayZhe} 折`);

    promoBar.innerHTML = items.map(t => `<span class="promo-chip">${t}</span>`).join("");
    promoBar.style.display = items.length ? "flex" : "none";
  }

  function applyFilter(filter){
    const visible = ALL_PRODUCTS
      .filter(p => (p.status || "上架") === "上架")
      .filter(p => {
        const cat = p.category || "其他";
        return (filter === "全部" || cat === filter);
      });

    render(visible);
  }

  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      chips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");

      const f = chip.dataset.filter || "全部";
      applyFilter(f);
      grid.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });

async function loadProducts(){
  // ✅ 先從快取顯示（秒開）
  const cacheKey = "tyod_products_cache_v1";
  const cacheTimeKey = "tyod_products_cache_time_v1";
  const cached = localStorage.getItem(cacheKey);

  if(cached){
    try{
      ALL_PRODUCTS = JSON.parse(cached) || [];
      applyFilter(document.querySelector("#subcats .chip.active")?.dataset.filter || "全部");
    }catch(e){}
  }else{
    grid.innerHTML = `<div style="opacity:.7; padding:18px;">載入中...</div>`;
  }

  // ✅ 再去 API 背景更新（拿最新）
  try{
    const res = await fetch(`${API_BASE}/products`, { cache: "no-store" });
    if(!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();

    ALL_PRODUCTS = Array.isArray(data) ? data : [];
    localStorage.setItem(cacheKey, JSON.stringify(ALL_PRODUCTS));
    localStorage.setItem(cacheTimeKey, String(Date.now()));

    applyFilter(document.querySelector("#subcats .chip.active")?.dataset.filter || "全部");
  }catch(err){
    console.error(err);
    if(!cached){
      grid.innerHTML = `<div style="color:#8a3b3b; padding:18px;">商品載入失敗，請稍後再試。</div>`;
    }
  }
}


  // ===== 商品 Modal：開/關 =====
  const pdBackdrop = document.getElementById("pdBackdrop");
  const pdClose = document.getElementById("pdClose");
  const pdWrap = document.getElementById("pdWrap");

  function openProductModalById(id){
    const p = ALL_PRODUCTS.find(x => String(x.id) === String(id));
    if(!p) return;

    const title = p.title || "（未命名）";
    const cat = p.category || "其他";
    const series = p.series || "全系列";
    const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);
    const img = p.image || "assets/placeholder.png";
    const desc = p.description || p.desc || "（尚未提供商品說明）";

    pdWrap.innerHTML = `
      <div class="pd-grid">
        <div class="pd-media">
          <img src="${img}" alt="${title}">
        </div>

        <div class="pd-info">
          <h2 class="pd-name">${title}</h2>
          <div class="pd-meta">${series}｜${cat}</div>
          <div class="pd-price">NT$ ${price}</div>
          <div class="pd-desc">${desc}</div>

          <div class="pd-actions">
            <button class="pd-btn primary" type="button" id="pdAddCart">加入購物車</button>
            <button class="pd-btn secondary" type="button" id="pdClose2">關閉</button>
          </div>

          <div class="pd-toast" id="pdToast" style="display:none;">已加入購物車 ✅</div>
        </div>
      </div>
    `;

    pdWrap.querySelector("#pdAddCart").addEventListener("click", () => {
      const t = pdWrap.querySelector("#pdToast");
      t.style.display = "block";
      setTimeout(()=> t.style.display="none", 1200);
    });
    pdWrap.querySelector("#pdClose2").addEventListener("click", closeProductModal);

    pdBackdrop.classList.add("open");
    pdBackdrop.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeProductModal(){
    pdBackdrop.classList.remove("open");
    pdBackdrop.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  pdClose.addEventListener("click", closeProductModal);
  pdBackdrop.addEventListener("click", (e) => {
    if(e.target === pdBackdrop) closeProductModal();
  });
  window.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && pdBackdrop.classList.contains("open")) closeProductModal();
  });

  document.addEventListener("click", (e) => {
    const a = e.target.closest(".js-open-product");
    if(!a) return;
    e.preventDefault();
    const id = decodeURIComponent(a.dataset.id || "");
    openProductModalById(id);
  });

  // ===== 回到頂端 =====
  const btn = document.getElementById("backToTop");
  window.addEventListener("scroll", () => {
    btn.style.display = window.scrollY > 300 ? "block" : "none";
  });
  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ===== init =====
 // 🚀 商品先載（最重要）
loadProducts();

// ⚙️ 設定背景載入，不阻塞商品
loadSettings();

</script>

</body>
</html>
