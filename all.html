<!doctype html>
<html lang="zh-Hant">
<head>
<title>十年一日｜全系列</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

</head>
<body>

<main>
<div class="subcats" id="subcats">
  <button class="chip active" data-filter="全部" type="button">全部</button>
  <button class="chip" data-filter="項鍊" type="button">項鍊</button>
  <button class="chip" data-filter="手鏈" type="button">手鏈</button>
  <button class="chip" data-filter="耳環" type="button">耳環</button>
  <button class="chip" data-filter="戒指" type="button">戒指</button>
  <button class="chip" data-filter="其他" type="button">其他</button>
  
  </div>
  <!-- ✅ 優惠提示列 -->
<div class="promo-bar" id="promoBar" style="display:none"></div>
<div class="grid" id="productGrid"></div>
</main>

<footer>
  <a class="admin-link" href="admin.html" aria-label="admin"></a>
  <div class="footer-row">
    <div class="col">💎 精選材質<small>不含鉛，安心佩戴</small></div>
    <div class="col center">✨ 獨特設計<small>韓日歐美風格齊聚</small></div>
    <div class="col right">🚚 便利配送<small>超商取貨、宅配到府</small></div>
  </div>
  <div class="footer-brand">
    <div class="t">十年一日</div>
    <div class="s">tenyears_oneday</div>
  </div>
  <div class="footer-social">
  <a href="https://www.instagram.com/tenyears_oneday" target="_blank" aria-label="Instagram">
    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg" alt="IG">
  </a>
  <a href="https://line.me/R/ti/p/@396kwrga" target="_blank" aria-label="LINE">
    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/line.svg" alt="LINE">
  </a>
</div>

</footer>
<button id="backToTop" aria-label="回到頂端">↑</button>

<script src="include.js"></script>

<script>
  const API_BASE = "https://tenyears-oneday-api.onrender.com";

  const grid = document.getElementById("productGrid");
  const chips = document.querySelectorAll("#subcats .chip");
  const promoBar = document.getElementById("promoBar");

// ✅ settings 預設值（就算 settings 讀不到也不會壞）
let SETTINGS = {
  shipping_enabled: true,
  shipping_fee: 60,
  free_shipping_threshold: 1000,
  first_purchase_discount: 0.9,
  birthday_discount: 0.85
};


  let ALL_PRODUCTS = [];
function productCard(p){
  const id = p.id ?? "";
  const cat = p.category || "其他";
  const series = p.series || "全系列";
  const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);
  const title = p.title || "（未命名）";
  const img = p.image || "assets/placeholder.png";

  // ✅ 這些是「提示標籤」，不會假裝單品就免運
  const badges = [];

  const firstRate = Number(SETTINGS.first_purchase_discount || 1);
  const bdayRate  = Number(SETTINGS.birthday_discount || 1);
  const freeOver  = Number(SETTINGS.free_shipping_threshold || 0);
  const shipOn    = !!SETTINGS.shipping_enabled;

  if(firstRate > 0 && firstRate < 1) badges.push(`首購 ${Math.round(firstRate*100)} 折`);
  if(bdayRate > 0 && bdayRate < 1) badges.push(`生日月 ${Math.round(bdayRate*100)} 折`);
  if(shipOn && freeOver > 0) badges.push(`滿 NT$${freeOver} 免運`);

  return `
    <a class="product-link" href="product.html?id=${encodeURIComponent(id)}" title="${title}">
      <div class="product" data-cat="${cat}" data-series="${series}">
        <div class="thumb">
          <img src="${img}" alt="${title}" loading="lazy">
          ${badges.length ? `<div class="badges">${badges.map(b=>`<span class="badge">${b}</span>`).join("")}</div>` : ``}
        </div>

        <div class="body">
          <div>
            <div class="name">${title}</div>
            <div class="meta">${series}｜${cat}</div>
          </div>
          <div class="price">NT$ ${price}</div>
        </div>
      </div>
    </a>
  `;
}

  function render(products){
    grid.innerHTML = products.map(productCard).join("");
  }
async function loadSettings(){
  try{
    const res = await fetch(`${API_BASE}/settings`, { cache: "no-store" });
    if(!res.ok) throw new Error("settings error " + res.status);

    const s = await res.json();
    if(s && typeof s === "object"){
      SETTINGS = {
        ...SETTINGS,
        ...s,
        shipping_fee: Number(s.shipping_fee ?? SETTINGS.shipping_fee),
        free_shipping_threshold: Number(s.free_shipping_threshold ?? SETTINGS.free_shipping_threshold),
        first_purchase_discount: Number(s.first_purchase_discount ?? SETTINGS.first_purchase_discount),
        birthday_discount: Number(s.birthday_discount ?? SETTINGS.birthday_discount),
        shipping_enabled: !!s.shipping_enabled
      };
    }
  }catch(e){
    console.warn("loadSettings failed, fallback defaults", e);
  }

  renderPromoBar();
}

function renderPromoBar(){
  if(!promoBar) return;

  const shipOn = !!SETTINGS.shipping_enabled;
  const fee = Number(SETTINGS.shipping_fee || 0);
  const freeOver = Number(SETTINGS.free_shipping_threshold || 0);

  const firstRate = Number(SETTINGS.first_purchase_discount || 1);
  const bdayRate  = Number(SETTINGS.birthday_discount || 1);

  const chips = [];

  if(shipOn){
    chips.push(`運費 NT$${fee}`);
    if(freeOver > 0) chips.push(`滿 NT$${freeOver} 免運`);
  }else{
    chips.push(`免運活動中`);
  }

  if(firstRate > 0 && firstRate < 1) chips.push(`首購 ${Math.round(firstRate*100)} 折`);
  if(bdayRate > 0 && bdayRate < 1) chips.push(`生日月 ${Math.round(bdayRate*100)} 折`);

  promoBar.innerHTML = chips.map(t => `<span class="promo-chip">${t}</span>`).join("");
  promoBar.style.display = chips.length ? "flex" : "none";
}

  function applyFilter(filter){
    const visible = ALL_PRODUCTS
      .filter(p => (p.status || "上架") === "上架")
      .filter(p => {
        const cat = p.category || "其他";
        return (filter === "全部" || cat === filter);
      });

    render(visible);
  }

  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      chips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");

      const f = chip.dataset.filter || "全部";
      applyFilter(f);
      grid.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });

  async function loadProducts(){
    grid.innerHTML = `<div style="opacity:.7; padding:18px;">載入中...</div>`;
    try{
      const res = await fetch(`${API_BASE}/products`, { cache: "no-store" });
      if(!res.ok) throw new Error("API error " + res.status);
      const data = await res.json();

      ALL_PRODUCTS = Array.isArray(data) ? data : [];
      applyFilter("全部");
    }catch(err){
      console.error(err);
      grid.innerHTML = `<div style="color:#8a3b3b; padding:18px;">商品載入失敗，請稍後再試。</div>`;
    }
  }
(async () => {
  await loadSettings();
  await loadProducts();
})();

  const btn = document.getElementById("backToTop");
  window.addEventListener("scroll", () => {
    btn.style.display = window.scrollY > 300 ? "block" : "none";
  });
  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>

</body>
</html>
