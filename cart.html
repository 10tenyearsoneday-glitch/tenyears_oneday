<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>購物車｜十年一日</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    /* 盡量不破壞你原本 style.css，只補購物車需要的 */
    .cart-wrap{max-width:980px;margin:auto;padding:18px;}
    .cart-title{font-size:1.15rem;letter-spacing:.08em;color:rgba(47,58,44,.85);margin:10px 0 14px;}
    .cart-grid{display:grid;grid-template-columns: 1fr 340px;gap:14px;align-items:start;}
    @media (max-width: 920px){ .cart-grid{grid-template-columns:1fr;} }

    .card{
      background:rgba(255,255,255,.72);
      border:1px solid rgba(0,0,0,.06);
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      border-radius:16px;
      overflow:hidden;
    }
    .card-hd{padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .card-hd .hint{font-size:.85rem;opacity:.75}
    .card-bd{padding:12px 14px;}

    .btn2{border:none;border-radius:999px;padding:10px 14px;background:#5d6b59;color:#fff;cursor:pointer}
    .btn2.secondary{background:rgba(0,0,0,.08);color:rgba(47,58,44,.9)}
    .btn2.danger{background:#8a3b3b}
    .btn-mini{border:none;border-radius:999px;padding:8px 12px;background:rgba(0,0,0,.08);cursor:pointer}
    .btn-mini.danger{background:rgba(138,59,59,.14);color:#8a3b3b}

    .rows{display:flex;flex-direction:column;gap:10px;}
    .row{
      display:grid;
      grid-template-columns: 76px 1fr auto;
      gap:12px;
      padding:10px;
      border-radius:14px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(0,0,0,.06);
    }
    .thumb{width:76px;height:76px;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.06)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}

    .name{font-weight:600;letter-spacing:.02em;margin-bottom:4px}
    .meta{font-size:.85rem;opacity:.75}
    .price{font-weight:700;color:#6c7f67;margin-top:6px}

    .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;justify-content:space-between}
    .qty{
      display:flex;align-items:center;gap:8px;
      background:rgba(0,0,0,.06);
      border-radius:999px;
      padding:6px 8px;
    }
    .qty button{width:30px;height:30px;border-radius:999px;border:none;background:rgba(255,255,255,.9);cursor:pointer}
    .qty input{
      width:46px;
      text-align:center;
      border:none;
      background:transparent;
      outline:none;
      font-weight:700;
      color:rgba(47,58,44,.9);
    }
    .line{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.95rem}
    .line .k{opacity:.8}
    .line .v{font-weight:700}
    .divider{height:1px;background:rgba(0,0,0,.06);margin:10px 0}
    .total{font-size:1.05rem}
    .total .v{font-size:1.25rem;color:#5d6b59}

    .empty{padding:18px;opacity:.75}
    .toast{margin-top:10px;font-size:.9rem}
    .promo{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .promo span{display:inline-flex;gap:6px;align-items:center;padding:8px 10px;border-radius:999px;background:rgba(0,0,0,.06);font-size:.85rem;opacity:.85}
    a.link{color:inherit;text-decoration:none;border-bottom:1px solid rgba(47,58,44,.35)}
  </style>
</head>

<body>
  <script src="include.js"></script>

  <main class="cart-wrap">
    <div class="cart-title">購物車</div>

    <div class="cart-grid">
      <!-- 左：清單 -->
      <section class="card">
        <div class="card-hd">
          <div>
            <div style="font-weight:600;letter-spacing:.03em;">商品清單</div>
            <div class="hint" id="cartHint">載入中…</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn2 secondary" id="btnContinue" type="button">繼續逛</button>
            <button class="btn2 danger" id="btnClear" type="button">清空</button>
          </div>
        </div>
        <div class="card-bd">
          <div class="rows" id="rows"></div>
          <div class="toast" id="toast"></div>
        </div>
      </section>

      <!-- 右：結帳摘要 -->
      <aside class="card">
        <div class="card-hd">
          <div style="font-weight:600;letter-spacing:.03em;">訂單摘要</div>
          <div class="hint">（付款/下單稍後做）</div>
        </div>
        <div class="card-bd">
          <div class="line"><div class="k">小計</div><div class="v" id="sumSubtotal">NT$ 0</div></div>
          <div class="line"><div class="k">運費</div><div class="v" id="sumShipping">NT$ 0</div></div>
          <div class="divider"></div>
          <div class="line total"><div class="k">總計</div><div class="v" id="sumTotal">NT$ 0</div></div>

          <div class="promo" id="promo"></div>

          <div style="margin-top:12px;">
            <button class="btn2" id="btnCheckout" type="button" disabled style="width:100%;">前往結帳（稍後開放）</button>
          </div>

          <div class="hint" style="margin-top:10px;line-height:1.6;">
            小提醒：目前是前端購物車（存在瀏覽器），之後我們可以接正式結帳流程。
          </div>
        </div>
      </aside>
    </div>
  </main>

<script>
  const API_BASE = "https://tenyears-oneday-api.onrender.com";
  const CART_KEY = "ten_cart";
  const PLACEHOLDER = "assets/placeholder.png";

  // settings 預設值（就算 settings 讀不到也不會壞）
  let SETTINGS = {
    shipping_enabled: true,
    shipping_fee: 60,
    free_shipping_threshold: 1000,
    first_purchase_discount: 0.9,
    birthday_discount: 0.85
  };

  const rowsEl = document.getElementById("rows");
  const hintEl = document.getElementById("cartHint");
  const toastEl = document.getElementById("toast");

  const sumSubtotal = document.getElementById("sumSubtotal");
  const sumShipping = document.getElementById("sumShipping");
  const sumTotal = document.getElementById("sumTotal");
  const promoEl = document.getElementById("promo");

  const btnClear = document.getElementById("btnClear");
  const btnContinue = document.getElementById("btnContinue");

  let PRODUCT_MAP = new Map(); // id -> product
  let CART = [];              // [{id, qty}]
  let VIEW = [];              // merged rows for rendering

  function toast(msg, ok=true){
    if(!toastEl) return;
    toastEl.textContent = msg;
    toastEl.style.color = ok ? "rgba(47,58,44,.85)" : "#8a3b3b";
    setTimeout(()=>{ toastEl.textContent = ""; }, 1800);
  }

  function readCart(){
    try{
      const raw = localStorage.getItem(CART_KEY);
      const arr = JSON.parse(raw || "[]");
      if(!Array.isArray(arr)) return [];
      return arr
        .map(x => ({ id: String(x.id||"").trim(), qty: Math.max(1, Number(x.qty||1)) }))
        .filter(x => x.id);
    }catch(e){
      return [];
    }
  }

  function writeCart(arr){
    localStorage.setItem(CART_KEY, JSON.stringify(arr));
    window.dispatchEvent(new Event("cart:changed"));
  }

  function setQty(id, qty){
    qty = Math.max(1, Number(qty || 1));
    const idx = CART.findIndex(x => String(x.id) === String(id));
    if(idx === -1) return;

    CART[idx].qty = qty;
    writeCart(CART);
    rebuildView();
    render();
  }

  function incQty(id, delta){
    const idx = CART.findIndex(x => String(x.id) === String(id));
    if(idx === -1) return;
    CART[idx].qty = Math.max(1, Number(CART[idx].qty||1) + delta);
    writeCart(CART);
    rebuildView();
    render();
  }

  function removeItem(id){
    const before = CART.length;
    CART = CART.filter(x => String(x.id) !== String(id));
    writeCart(CART);
    rebuildView();
    render();
    if(CART.length !== before) toast("已移除");
  }

  function clearCart(){
    CART = [];
    writeCart(CART);
    rebuildView();
    render();
    toast("已清空購物車");
  }

  async function loadSettings(){
    try{
      const res = await fetch(`${API_BASE}/settings`, { cache: "no-store" });
      if(!res.ok) throw new Error("settings error " + res.status);
      const s = await res.json();
      if(s && typeof s === "object"){
        SETTINGS = {
          ...SETTINGS,
          ...s,
          shipping_fee: Number(s.shipping_fee ?? SETTINGS.shipping_fee),
          free_shipping_threshold: Number(s.free_shipping_threshold ?? SETTINGS.free_shipping_threshold),
          first_purchase_discount: Number(s.first_purchase_discount ?? SETTINGS.first_purchase_discount),
          birthday_discount: Number(s.birthday_discount ?? SETTINGS.birthday_discount),
          shipping_enabled: !!s.shipping_enabled
        };
      }
    }catch(e){
      // fallback defaults
    }
  }

  async function loadProducts(){
    // 用 /products 取得全部（你的 API 會回上架商品；購物車若有下架就會找不到）
    const res = await fetch(`${API_BASE}/products`, { cache: "no-store" });
    if(!res.ok) throw new Error("API error " + res.status);
    const list = await res.json();
    const arr = Array.isArray(list) ? list : [];
    PRODUCT_MAP = new Map(arr.map(p => [String(p.id), p]));
  }

  function money(n){
    n = Number(n || 0);
    return `NT$ ${n}`;
  }

  function rebuildView(){
    VIEW = CART.map(ci => {
      const p = PRODUCT_MAP.get(String(ci.id)) || null;
      const price = p ? (typeof p.price === "number" ? p.price : Number(p.price||0)) : 0;
      return {
        id: ci.id,
        qty: Math.max(1, Number(ci.qty||1)),
        ok: !!p,
        title: p?.title || `（商品不存在：${ci.id}）`,
        meta: p ? `${p.series||"全系列"}｜${p.category||"其他"}` : "可能已下架 / id 錯誤",
        price,
        image: (p?.image || PLACEHOLDER),
        lineTotal: price * Math.max(1, Number(ci.qty||1))
      };
    });

    // 摘要
    const subtotal = VIEW.reduce((s, r) => s + (r.ok ? r.lineTotal : 0), 0);

    const shipOn = !!SETTINGS.shipping_enabled;
    const fee = Number(SETTINGS.shipping_fee || 0);
    const freeOver = Number(SETTINGS.free_shipping_threshold || 0);

    let shipping = 0;
    if(shipOn){
      shipping = (freeOver > 0 && subtotal >= freeOver) ? 0 : fee;
    }else{
      shipping = 0;
    }

    const total = subtotal + shipping;

    // render summary
    sumSubtotal.textContent = money(subtotal);
    sumShipping.textContent = money(shipping);
    sumTotal.textContent = money(total);

    // promo chips（提示用）
    const chips = [];
    if(shipOn){
      chips.push(`運費 ${money(fee)}`);
      if(freeOver > 0) chips.push(`滿 ${money(freeOver)} 免運`);
      if(freeOver > 0 && subtotal < freeOver){
        chips.push(`再買 ${money(freeOver - subtotal)} 免運`);
      }
    }else{
      chips.push("免運活動中");
    }

    const firstRate = Number(SETTINGS.first_purchase_discount || 1);
    const bdayRate  = Number(SETTINGS.birthday_discount || 1);
    if(firstRate > 0 && firstRate < 1) chips.push(`首購 ${Math.round(firstRate*100)} 折（提示）`);
    if(bdayRate > 0 && bdayRate < 1) chips.push(`生日月 ${Math.round(bdayRate*100)} 折（提示）`);

    promoEl.innerHTML = chips.map(t => `<span>${t}</span>`).join("");
  }

  function rowHtml(r){
    const disabled = r.ok ? "" : "style='opacity:.65'";
    return `
      <div class="row" ${disabled}>
        <div class="thumb">
          <img src="${r.image}" alt="${r.title}" loading="lazy">
        </div>

        <div>
          <div class="name">${r.ok ? `<a class="link" href="product.html?id=${encodeURIComponent(r.id)}">${r.title}</a>` : r.title}</div>
          <div class="meta">${r.meta}</div>
          <div class="price">${money(r.price)}　<span style="opacity:.65;font-weight:600;">× ${r.qty}</span></div>
        </div>

        <div class="right">
          <div class="qty">
            <button type="button" data-dec="${r.id}" aria-label="減少">−</button>
            <input type="number" min="1" step="1" value="${r.qty}" data-qty="${r.id}">
            <button type="button" data-inc="${r.id}" aria-label="增加">＋</button>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="font-weight:800;color:#5d6b59;">${money(r.lineTotal)}</div>
            <button type="button" class="btn-mini danger" data-rm="${r.id}">刪除</button>
          </div>
        </div>
      </div>
    `;
  }

  function bindEvents(){
    // +/-
    rowsEl.querySelectorAll("[data-inc]").forEach(btn=>{
      btn.addEventListener("click", ()=>incQty(btn.getAttribute("data-inc"), +1));
    });
    rowsEl.querySelectorAll("[data-dec]").forEach(btn=>{
      btn.addEventListener("click", ()=>incQty(btn.getAttribute("data-dec"), -1));
    });

    // qty input
    rowsEl.querySelectorAll("[data-qty]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const id = inp.getAttribute("data-qty");
        setQty(id, inp.value);
      });
      inp.addEventListener("blur", ()=>{
        const id = inp.getAttribute("data-qty");
        setQty(id, inp.value);
      });
    });

    // remove
    rowsEl.querySelectorAll("[data-rm]").forEach(btn=>{
      btn.addEventListener("click", ()=>removeItem(btn.getAttribute("data-rm")));
    });
  }

  function render(){
    const totalQty = CART.reduce((s,x)=>s+Math.max(1,Number(x.qty||1)),0);

    if(hintEl){
      hintEl.textContent = CART.length ? `共 ${totalQty} 件（${CART.length} 項）` : "購物車是空的";
    }

    if(!CART.length){
      rowsEl.innerHTML = `
        <div class="empty">
          你的購物車目前是空的。<br><br>
          <button class="btn2" type="button" onclick="location.href='all.html'">去逛全系列</button>
        </div>
      `;
      // summary 也刷新（0）
      rebuildView();
      return;
    }

    rowsEl.innerHTML = VIEW.map(rowHtml).join("");
    bindEvents();
  }

  async function init(){
    CART = readCart();

    // 按鈕
    btnClear?.addEventListener("click", ()=>{
      if(!CART.length) return;
      const ok = confirm("確定清空購物車嗎？");
      if(ok) clearCart();
    });
    btnContinue?.addEventListener("click", ()=>location.href="all.html");

    try{
      await loadSettings();
      await loadProducts();
      rebuildView();
      render();
    }catch(e){
      console.error(e);
      toast("載入失敗，請稍後再試", false);
      rebuildView();
      render();
    }
  }

  // 如果其他頁加購物車，這頁開著也會更新
  window.addEventListener("cart:changed", ()=>{
    CART = readCart();
    rebuildView();
    render();
  });

  init();
</script>
</body>
</html>
