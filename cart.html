<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>購物車｜十年一日</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .cart-wrap{max-width:980px;margin:auto;padding:18px;}
    .cart-title{font-size:1.15rem;letter-spacing:.08em;color:rgba(47,58,44,.85);margin:10px 0 14px;}

    .cart-grid{display:grid;grid-template-columns:1fr;gap:12px;}
    .cart-row{
      display:grid;
      grid-template-columns:86px 1fr auto;
      gap:12px;
      align-items:center;
      background:rgba(255,255,255,.70);
      border:1px solid rgba(0,0,0,.06);
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      border-radius:14px;
      padding:12px;
    }
    .cart-thumb{width:86px;height:70px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.06);}
    .cart-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .cart-name{font-weight:650;letter-spacing:.02em;margin-bottom:4px;}
    .cart-meta{font-size:.85rem;opacity:.72;}
    .cart-price{font-weight:750;color:#6c7f67;margin-top:6px;}
    .cart-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
    .qty{
      display:flex;align-items:center;gap:8px;
      background:rgba(0,0,0,.05);
      border:1px solid rgba(0,0,0,.06);
      border-radius:999px;
      padding:6px 10px;
    }
    .qty button{
      border:none;background:rgba(0,0,0,.08);
      width:28px;height:28px;border-radius:999px;cursor:pointer;
      font-size:16px;line-height:28px;
    }
    .qty .n{min-width:24px;text-align:center;font-weight:650;}
    .btn-mini{
      border:none;border-radius:999px;padding:8px 12px;
      background:rgba(0,0,0,.08);cursor:pointer;
    }
    .btn-mini.danger{background:rgba(138,59,59,.12);color:#8a3b3b;}

    .cart-summary{
      margin-top:14px;
      background:rgba(255,255,255,.70);
      border:1px solid rgba(0,0,0,.06);
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      border-radius:14px;
      padding:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .sum-left{font-size:.95rem;opacity:.8;}
    .sum-total{font-size:1.15rem;font-weight:850;color:#2f3a2c;letter-spacing:.02em;}
    .sum-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
    .btn2{
      border:none;border-radius:999px;padding:10px 14px;
      background:#5d6b59;color:#fff;cursor:pointer;
    }
    .btn2.secondary{background:rgba(0,0,0,.08);color:rgba(47,58,44,.9);}
    .empty{
      padding:18px;
      opacity:.75;
      background:rgba(255,255,255,.55);
      border-radius:14px;
      border:1px dashed rgba(0,0,0,.10);
    }
  </style>
</head>
<body>

  <script src="include.js"></script>

  <main class="cart-wrap">
    <div class="cart-title">購物車</div>

    <div id="cartList" class="cart-grid"></div>

    <div id="cartSummary" class="cart-summary" style="display:none;">
      <div>
        <div class="sum-left" id="sumInfo">共 0 件商品</div>
        <div class="sum-total" id="sumTotal">小計 NT$ 0</div>
      </div>
      <div class="sum-actions">
        <button class="btn2 secondary" id="btnClear" type="button">清空購物車</button>
        <button class="btn2" id="btnCheckout" type="button" disabled>前往結帳（下一步做）</button>
      </div>
    </div>
  </main>

<script>
  const API_BASE = "https://tenyears-oneday-api.onrender.com";
  const PLACEHOLDER = "assets/placeholder.png";

  // ✅ 你指定的購物車 key
  const CART_KEY = "ten_cart";

  const cartList = document.getElementById("cartList");
  const cartSummary = document.getElementById("cartSummary");
  const sumInfo = document.getElementById("sumInfo");
  const sumTotal = document.getElementById("sumTotal");
  const btnClear = document.getElementById("btnClear");

  function readCart(){
    try{
      const raw = localStorage.getItem(CART_KEY);
      const arr = JSON.parse(raw || "[]");
      return Array.isArray(arr) ? arr : [];
    }catch(e){
      return [];
    }
  }

  function writeCart(arr){
    localStorage.setItem(CART_KEY, JSON.stringify(arr));
    window.dispatchEvent(new Event("cart:changed")); // ✅ 讓右上角數字更新
  }

  function clampQty(n){
    n = Number(n || 1);
    if(!Number.isFinite(n)) n = 1;
    return Math.max(1, Math.floor(n));
  }

  function removeItem(id){
    const cart = readCart().filter(x => String(x.id) !== String(id));
    writeCart(cart);
    render();
  }

  function setQty(id, qty){
    const cart = readCart();
    const idx = cart.findIndex(x => String(x.id) === String(id));
    if(idx === -1) return;
    cart[idx].qty = clampQty(qty);
    writeCart(cart);
    render();
  }

  function incQty(id, delta){
    const cart = readCart();
    const idx = cart.findIndex(x => String(x.id) === String(id));
    if(idx === -1) return;
    const now = clampQty(cart[idx].qty);
    cart[idx].qty = clampQty(now + Number(delta || 0));
    writeCart(cart);
    render();
  }

  function clearCart(){
    writeCart([]);
    render();
  }

  async function fetchProducts(){
    // 一次抓全部（簡單穩定）
    const res = await fetch(`${API_BASE}/products`, { cache: "no-store" });
    if(!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  function money(n){
    n = Number(n || 0);
    return Math.round(n);
  }

  function rowHtml(p, qty){
    const img = p.image || PLACEHOLDER;
    const title = p.title || "（未命名）";
    const cat = p.category || "其他";
    const series = p.series || "全系列";
    const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);

    return `
      <div class="cart-row" data-id="${p.id}">
        <a class="cart-thumb" href="product.html?id=${encodeURIComponent(p.id)}" title="回商品頁">
          <img src="${img}" alt="${title}" loading="lazy">
        </a>

        <div>
          <div class="cart-name">${title}</div>
          <div class="cart-meta">${series}｜${cat}</div>
          <div class="cart-price">NT$ ${money(price)}</div>
        </div>

        <div class="cart-actions">
          <div class="qty">
            <button type="button" data-act="minus" aria-label="減少">−</button>
            <div class="n">${qty}</div>
            <button type="button" data-act="plus" aria-label="增加">+</button>
          </div>
          <button class="btn-mini danger" type="button" data-act="remove">刪除</button>
        </div>
      </div>
    `;
  }

  function notFoundRow(id, qty){
    return `
      <div class="cart-row" data-id="${id}">
        <div class="cart-thumb"><img src="${PLACEHOLDER}" alt="" loading="lazy"></div>
        <div>
          <div class="cart-name">商品已下架或不存在</div>
          <div class="cart-meta">ID：${id}</div>
          <div class="cart-price">（無法計價）</div>
        </div>
        <div class="cart-actions">
          <div class="qty">
            <button type="button" data-act="minus" aria-label="減少">−</button>
            <div class="n">${qty}</div>
            <button type="button" data-act="plus" aria-label="增加">+</button>
          </div>
          <button class="btn-mini danger" type="button" data-act="remove">刪除</button>
        </div>
      </div>
    `;
  }

  let PRODUCT_MAP = new Map();

  async function render(){
    const cart = readCart();

    if(!cart.length){
      cartList.innerHTML = `<div class="empty">目前購物車是空的～你可以先去 <a href="all.html">全系列</a> 逛逛。</div>`;
      cartSummary.style.display = "none";
      return;
    }

    // 把購物車 id 對到商品資料
    let totalQty = 0;
    let subtotal = 0;

    const rows = cart.map(item => {
      const id = String(item.id || "");
      const qty = clampQty(item.qty);
      totalQty += qty;

      const p = PRODUCT_MAP.get(id);
      if(!p) return notFoundRow(id, qty);

      const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);
      subtotal += money(price) * qty;

      return rowHtml(p, qty);
    });

    cartList.innerHTML = rows.join("");

    // 綁事件（加減/刪除）
    cartList.querySelectorAll(".cart-row").forEach(row => {
      const id = row.getAttribute("data-id");

      row.querySelectorAll("button[data-act]").forEach(btn => {
        const act = btn.getAttribute("data-act");
        btn.addEventListener("click", () => {
          if(act === "minus") incQty(id, -1);
          if(act === "plus") incQty(id, +1);
          if(act === "remove") removeItem(id);
        });
      });
    });

    sumInfo.textContent = `共 ${totalQty} 件商品`;
    sumTotal.textContent = `小計 NT$ ${money(subtotal)}`;
    cartSummary.style.display = "flex";
  }

  async function init(){
    // 先把商品抓好
    try{
      const products = await fetchProducts();
      PRODUCT_MAP = new Map(products.map(p => [String(p.id), p]));
    }catch(e){
      console.error(e);
      // 商品抓不到也要能顯示（至少可以刪除/調整數量）
      PRODUCT_MAP = new Map();
    }

    await render();
  }

  btnClear?.addEventListener("click", () => {
    const ok = confirm("確定要清空購物車嗎？");
    if(ok) clearCart();
  });

  // 如果你在別頁加入購物車，回到此頁也會更新
  window.addEventListener("cart:changed", () => {
    render();
  });

  init();
</script>

</body>
</html>
