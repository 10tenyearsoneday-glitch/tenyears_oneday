<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>購物車｜十年一日</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<script src="include.js"></script>

<main class="cart-wrap">
  <h2 style="margin:18px 0;">購物車</h2>

  <div class="cart-grid">

    <!-- 左：商品 -->
    <section class="card">
      <div class="hd">
        <span id="cartHint">載入中…</span>
        <div>
          <button id="btnClear" class="btn2 secondary">清空</button>
          <a href="all.html" class="btn2 secondary">繼續逛逛</a>
        </div>
      </div>
      <div class="bd">
        <div id="items"></div>
        <div id="toast" class="toast"></div>
      </div>
    </section>

    <!-- 右：摘要 -->
    <aside class="card">
      <div class="hd">
        <strong>訂單摘要</strong>
      </div>
      <div class="bd">

        <div class="coupon">
          <input id="couponCode" placeholder="輸入優惠碼">
          <button id="btnApplyCoupon" class="btn2 secondary">套用</button>
        </div>
        <div id="couponToast" class="toast"></div>

        <hr>

        <div class="sum-row"><span>小計</span><strong id="sumSubtotal">NT$ 0</strong></div>
        <div class="sum-row"><span>折扣</span><strong id="sumDiscount">- NT$ 0</strong></div>
        <div class="sum-row"><span>運費</span><strong id="sumShipping">NT$ 0</strong></div>

        <hr>

        <div class="sum-row sum-total">
          <span>合計</span><strong id="sumTotal">NT$ 0</strong>
        </div>

        <button class="btn2" style="width:100%;margin-top:12px;" disabled>
          結帳（下一步再做）
        </button>

      </div>
    </aside>

  </div>
</main>

<script>
/* ===== 基本設定 ===== */
const API_BASE = "https://tenyears-oneday-api.onrender.com";
const GAS_URL = "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";
const CART_KEY = "ten_cart";
const MEMBER_KEY = "ten_member_id";

let SETTINGS = {
  shipping_enabled: true,
  shipping_fee: 60,
  free_shipping_threshold: 1000
};

let PRODUCTS = {};
let APPLIED = { code:"", discount:0 };

/* ===== DOM ===== */
const itemsEl = document.getElementById("items");
const cartHint = document.getElementById("cartHint");
const btnClear = document.getElementById("btnClear");
const sumSubtotal = document.getElementById("sumSubtotal");
const sumDiscount = document.getElementById("sumDiscount");
const sumShipping = document.getElementById("sumShipping");
const sumTotal = document.getElementById("sumTotal");
const couponCode = document.getElementById("couponCode");
const btnApplyCoupon = document.getElementById("btnApplyCoupon");
const couponToast = document.getElementById("couponToast");

/* ===== helpers ===== */
function readCart(){
  try{ return JSON.parse(localStorage.getItem(CART_KEY)||"[]"); }
  catch(e){ return []; }
}
function writeCart(arr){
  localStorage.setItem(CART_KEY, JSON.stringify(arr));
  window.dispatchEvent(new Event("cart:changed"));
}
function money(n){ return `NT$ ${Math.round(n||0)}`; }
function memberId(){
  let id = localStorage.getItem(MEMBER_KEY);
  if(!id){
    id = "M-" + Math.random().toString(36).slice(2,8).toUpperCase();
    localStorage.setItem(MEMBER_KEY,id);
  }
  return id;
}

/* ===== render ===== */
function render(){
  const cart = readCart();
  const count = cart.reduce((s,x)=>s+(x.qty||1),0);
  cartHint.textContent = count ? `共 ${count} 件商品` : "購物車是空的";

  if(!count){
    itemsEl.innerHTML = "<div style='opacity:.7'>尚未加入商品</div>";
  }else{
    itemsEl.innerHTML = cart.map(it=>{
      const p = PRODUCTS[it.id]||{};
      return `
        <div class="item">
          <img src="${p.image||'assets/placeholder.png'}" width="60">
          <div style="flex:1">
            <div>${p.title||it.id}</div>
            <small>${money(p.price)} × ${it.qty||1}</small>
          </div>
          <strong>${money((p.price||0)*(it.qty||1))}</strong>
        </div>
      `;
    }).join("");
  }

  const subtotal = cart.reduce((s,it)=>{
    const p = PRODUCTS[it.id]||{};
    return s + (p.price||0)*(it.qty||1);
  },0);

  const discount = APPLIED.discount || 0;
  const shipping = SETTINGS.shipping_enabled &&
    subtotal-discount < SETTINGS.free_shipping_threshold
    ? SETTINGS.shipping_fee : 0;

  sumSubtotal.textContent = money(subtotal);
  sumDiscount.textContent = "- " + money(discount);
  sumShipping.textContent = money(shipping);
  sumTotal.textContent = money(subtotal-discount+shipping);
}

/* ===== load ===== */
async function loadSettings(){
  try{
    const r = await fetch(`${API_BASE}/settings`);
    Object.assign(SETTINGS, await r.json());
  }catch(e){
    console.warn("settings fallback", e);
  }
}

async function loadProducts(){
  const r = await fetch(`${API_BASE}/products`);
  const arr = await r.json();
  arr.forEach(p=> PRODUCTS[p.id]=p );
}

/* ===== coupon ===== */
async function applyCoupon(){
  const subtotal = readCart().reduce((s,it)=>{
    const p = PRODUCTS[it.id]||{};
    return s + (p.price||0)*(it.qty||1);
  },0);

  const code = couponCode.value.trim().toUpperCase();
  if(!code) return;

  const url = `${GAS_URL}?path=coupon_validate&code=${code}&memberId=${memberId()}&subtotal=${subtotal}`;
  const res = await fetch(url);
  const out = await res.json();

  if(!out.ok){
    couponToast.textContent = "優惠碼無效";
    APPLIED = {code:"",discount:0};
  }else{
    APPLIED = out;
    couponToast.textContent = `已套用 ${code}`;
  }
  render();
}

/* ===== events ===== */
btnClear.onclick = ()=>{ writeCart([]); APPLIED={}; render(); };
btnApplyCoupon.onclick = applyCoupon;
window.addEventListener("cart:changed", render);

/* ===== init ===== */
(async()=>{
  await loadSettings();
  await loadProducts();
  render();
})();
</script>

</body>
</html>
