<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>購物車｜十年一日 TEN YEARS ONE DAY</title>

  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#F8F9F7] to-[#D4E7D1]">
  <!-- header.html will be injected by include-shop.js -->

  <main class="max-w-3xl mx-auto px-4 pt-28 pb-16">
    <div class="card p-5">

      <!-- header -->
      <div class="flex items-center justify-between gap-3">
        <h1 class="text-xl font-black tracking-widest">購物車</h1>
        <button id="btnClear"
          class="text-sm px-3 py-2 rounded-xl border border-black/10 bg-white hover:bg-black/5">
          清空
        </button>
      </div>

      <!-- list -->
      <div id="cartList" class="mt-4"></div>

      <!-- coupon -->
      <div class="mt-4 flex gap-2 items-center">
        <input id="couponInput" placeholder="輸入優惠碼"
          class="flex-1 h-10 px-3 rounded-xl border border-black/10 bg-white">
        <button id="btnApplyCoupon"
          class="h-10 px-4 rounded-xl bg-[#8ea08e] text-white font-bold">
          套用
        </button>
      </div>
      <div id="couponMsg" class="mt-1 text-sm opacity-80"></div>

      <!-- summary -->
      <div class="mt-4 pt-4 border-t border-black/10 text-sm space-y-2">
        <div class="flex justify-between">
          <span>小計</span><strong id="sumSubtotal">NT$ 0</strong>
        </div>
        <div class="flex justify-between">
          <span>折扣</span><strong id="sumDiscount">NT$ 0</strong>
        </div>
        <div class="flex justify-between">
          <span>運費</span><strong id="sumShipping">NT$ 0</strong>
        </div>
        <div class="flex justify-between text-base font-black">
          <span>合計</span><strong id="sumTotal">NT$ 0</strong>
        </div>
      </div>

      <!-- actions -->
      <div class="mt-5 flex flex-col sm:flex-row gap-3">
        <a href="./all.html"
          class="w-full sm:w-auto text-center px-4 py-3 rounded-2xl border border-black/10 bg-white hover:bg-black/5">
          繼續逛
        </a>
        <button id="btnCheckout"
          class="w-full sm:flex-1 px-4 py-3 rounded-2xl bg-[#2f3a2c] text-white font-black tracking-widest">
          前往結帳
        </button>
      </div>

      <div id="toast" class="mt-3 text-sm"></div>
    </div>
  </main>

  <!-- shared include -->
  <script src="./include-shop.js"></script>

  <!-- cart logic -->
  <script type="module">
    import { calcTotal, money } from "./pricing.js";
    import { buildDiscountLabels } from "./discount-label.js";

    /* ========= constants ========= */
    const CART_KEY = "ten_cart";
    const COUPON_KEY = "ten_applied_coupon_v1";

    /* ========= cart ========= */
    const readCart = () => {
      try {
        const arr = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(arr) ? arr : [];
      } catch { return []; }
    };

    const writeCart = (items) => {
      localStorage.setItem(CART_KEY, JSON.stringify(items));
      window.dispatchEvent(new Event("cart:changed"));
    };

    /* ========= member state ========= */
    const isFirstPurchase = () => !localStorage.getItem("ten_has_purchase_v1");

    const isBirthday = () => {
      const m = localStorage.getItem("ten_birth_m");
      const d = localStorage.getItem("ten_birth_d");
      if (!m || !d) return false;
      const now = new Date();
      return now.getMonth() + 1 === Number(m) && now.getDate() === Number(d);
    };

    /* ========= settings ========= */
    let SETTINGS = null;
    async function getSettings() {
      if (SETTINGS) return SETTINGS;
      const res = await fetch(
        "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec?path=settings",
        { cache: "no-store" }
      );
      const out = await res.json();
      SETTINGS = out.ok && out.data ? out.data : out;
      return SETTINGS;
    }

    /* ========= coupon ========= */
    async function validateCoupon(code, subtotal) {
      const res = await fetch(
        `https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec?path=coupon_validate&code=${encodeURIComponent(code)}&subtotal=${subtotal}`,
        { cache: "no-store" }
      );
      const out = await res.json();
      return out.ok ? out.data : null;
    }

    /* ========= render ========= */
    async function render() {
      const cart = readCart();
      const list = document.getElementById("cartList");

      if (!cart.length) {
        list.innerHTML = `<div class="text-center py-10 opacity-70">購物車是空的</div>`;
        sumSubtotal.textContent = money(0);
        sumDiscount.textContent = money(0);
        sumShipping.textContent = money(0);
        sumTotal.textContent = money(0);
        couponMsg.textContent = "";
        return;
      }

      list.innerHTML = cart.map((it, idx) => `
        <div class="flex gap-3 py-3 border-b border-black/10">
          <img src="${it.image || 'assets/placeholder.png'}"
            class="w-14 h-14 rounded-xl border">
          <div class="flex-1">
            <div class="font-bold">${it.title}</div>
            <div class="text-sm opacity-70">${money(it.price)}</div>
          </div>
          <div class="flex items-center gap-2">
            <button data-dec="${idx}">-</button>
            <input data-qty="${idx}" type="number" min="1" value="${it.qty}">
            <button data-inc="${idx}">+</button>
          </div>
          <button data-del="${idx}" class="text-sm border px-2 rounded">刪</button>
        </div>
      `).join("");

      const settings = await getSettings();
      const subtotal = cart.reduce((s, it) => s + Number(it.price) * Number(it.qty), 0);

      const couponCode = localStorage.getItem(COUPON_KEY);
      const coupon = couponCode
        ? await validateCoupon(couponCode, subtotal)
        : null;

      const ctx = {
        firstPurchase: isFirstPurchase(),
        birthday: isBirthday(),
        coupon: coupon ? { ...coupon, code: couponCode } : null
      };

      const pricing = calcTotal(cart, settings, ctx);
      const labels = buildDiscountLabels(settings, ctx);

      sumSubtotal.textContent = money(pricing.subtotal);
      sumDiscount.textContent = pricing.discount > 0 ? `- ${money(pricing.discount)}` : money(0);
      sumShipping.textContent = pricing.shipping === 0 ? "免運" : money(pricing.shipping);
      sumTotal.textContent = money(pricing.total);
      couponMsg.textContent = labels.join(" ＋ ");
    }

    /* ========= events ========= */
    document.addEventListener("click", (e) => {
      const inc = e.target.closest("[data-inc]");
      const dec = e.target.closest("[data-dec]");
      const del = e.target.closest("[data-del]");
      const cart = readCart();

      if (inc) cart[inc.dataset.inc].qty++;
      if (dec) cart[dec.dataset.dec].qty = Math.max(1, cart[dec.dataset.dec].qty - 1);
      if (del) cart.splice(del.dataset.del, 1);

      if (inc || dec || del) {
        writeCart(cart);
        render();
      }
    });

    document.addEventListener("change", (e) => {
      const inp = e.target.closest("[data-qty]");
      if (!inp) return;
      const cart = readCart();
      cart[inp.dataset.qty].qty = Math.max(1, Math.floor(inp.value));
      writeCart(cart);
      render();
    });

    btnClear.onclick = () => {
      if (!confirm("確定清空購物車？")) return;
      writeCart([]);
      render();
    };

    btnApplyCoupon.onclick = async () => {
      const code = couponInput.value.trim();
      if (!code) return;
      localStorage.setItem(COUPON_KEY, code);
      await render();
    };

    btnCheckout.onclick = () => {
      toast.textContent = "下一步可直接接綠界金流";
    };

    window.addEventListener("cart:changed", render);
    render();
  </script>
</body>
</html>
