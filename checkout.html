<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>結帳｜十年一日 TEN YEARS ONE DAY</title>

  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#F8F9F7] to-[#D4E7D1]">
  <!-- header 由 include-shop.js 注入 -->
<script src="./pricing.js"></script>
<script src="./discount-label.js"></script>
<script src="./include-shop.js"></script>

  <main class="max-w-3xl mx-auto px-4 pt-28 pb-16">
    <div class="card p-5 space-y-5">

      <h1 class="text-xl font-black tracking-widest">結帳資訊</h1>

      <!-- 收件資訊 -->
      <div class="space-y-3">
        <input id="name" placeholder="姓名" class="w-full h-10 px-3 rounded-xl border">
        <input id="phone" placeholder="電話" class="w-full h-10 px-3 rounded-xl border">
        <input id="email" placeholder="Email" class="w-full h-10 px-3 rounded-xl border">
        <textarea id="address" placeholder="地址 / 超商門市"
          class="w-full h-20 px-3 py-2 rounded-xl border"></textarea>
      </div>

      <!-- 金額摘要 -->
      <div class="pt-4 border-t border-black/10 text-sm space-y-2">
        <div class="flex justify-between">
          <span>小計</span><strong id="sumSubtotal">NT$ 0</strong>
        </div>
        <div class="flex justify-between">
          <span>折扣</span><strong id="sumDiscount">NT$ 0</strong>
        </div>
        <div class="flex justify-between">
          <span>運費</span><strong id="sumShipping">NT$ 0</strong>
        </div>
        <div class="flex justify-between text-base font-black">
          <span>合計</span><strong id="sumTotal">NT$ 0</strong>
        </div>
        <div id="discountSummary" class="text-sm opacity-80"></div>
      </div>

      <!-- 操作 -->
      <button id="btnSubmit"
        class="w-full h-11 rounded-2xl bg-[#2f3a2c] text-white font-black tracking-widest">
        確認下單
      </button>

      <div id="toast" class="text-sm"></div>
    </div>
  </main>

  <!-- 一定要先載 -->
  <script src="./pricing.js"></script>
  <script src="./discount-label.js"></script>
  <script src="./include-shop.js"></script>

  <script>
    /* =========================
       Bridge
    ========================= */
    const { calcTotal, money } = window.TEN_PRICING;
    const { buildDiscountLabels } = window.TEN_DISCOUNT_LABEL;

    /* =========================
       Constants
    ========================= */
    const CART_KEY = "ten_cart";
    const COUPON_KEY = "ten_applied_coupon_v1";
    const GAS_URL =
      "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";

    /* =========================
       Utils
    ========================= */
    const readCart = () => {
      try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
      catch { return []; }
    };

    const isFirstPurchase = () =>
      !localStorage.getItem("ten_has_purchase_v1");

    const isBirthday = () => {
      const m = localStorage.getItem("ten_birth_m");
      const d = localStorage.getItem("ten_birth_d");
      if (!m || !d) return false;
      const now = new Date();
      return now.getMonth()+1===Number(m) && now.getDate()===Number(d);
    };

    let SETTINGS = null;
    async function getSettings(){
      if (SETTINGS) return SETTINGS;
      const r = await fetch(`${GAS_URL}?path=settings`, { cache:"no-store" });
      const o = await r.json();
      SETTINGS = o.ok && o.data ? o.data : o;
      return SETTINGS;
    }

    async function validateCoupon(code, subtotal){
      const r = await fetch(
        `${GAS_URL}?path=coupon_validate&code=${encodeURIComponent(code)}&subtotal=${subtotal}`,
        { cache:"no-store" }
      );
      const o = await r.json();
      return o.ok ? o.data : null;
    }

    /* =========================
       Render
    ========================= */
    async function render(){
      const cart = readCart();
      if (!cart.length) return;

      const settings = await getSettings();
      const subtotal = cart.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0);

      const couponCode = localStorage.getItem(COUPON_KEY);
      const coupon = couponCode
        ? await validateCoupon(couponCode, subtotal)
        : null;

      const ctx = {
        firstPurchase: isFirstPurchase(),
        birthday: isBirthday(),
        coupon: coupon ? { ...coupon, code: couponCode } : null
      };

      const pricing = calcTotal(cart, settings, ctx);
      const labels = buildDiscountLabels(settings, ctx);

      sumSubtotal.textContent = money(pricing.subtotal);
      sumDiscount.textContent =
        pricing.discount>0 ? `- ${money(pricing.discount)}` : money(0);
      sumShipping.textContent =
        pricing.shipping===0 ? "免運" : money(pricing.shipping);
      sumTotal.textContent = money(pricing.total);
      discountSummary.textContent = labels.join(" ＋ ");
    }

    /* =========================
       Submit order
    ========================= */
    btnSubmit.onclick = async () => {
      const cart = readCart();
      if (!cart.length) {
        toast.textContent = "購物車是空的";
        return;
      }

      const settings = await getSettings();
      const subtotal = cart.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0);

      const couponCode = localStorage.getItem(COUPON_KEY);
      const coupon = couponCode
        ? await validateCoupon(couponCode, subtotal)
        : null;

      const ctx = {
        firstPurchase: isFirstPurchase(),
        birthday: isBirthday(),
        coupon: coupon ? { ...coupon, code: couponCode } : null
      };

      const pricing = calcTotal(cart, settings, ctx);
      const labels = buildDiscountLabels(settings, ctx);

      const payload = {
        order_id: "OD" + Date.now(),
         token: localStorage.getItem("ten_token") || "",   // ⭐⭐⭐加這行⭐⭐⭐
        name: name.value,
        phone: phone.value,
        email: email.value,
        address_or_store: address.value,
        items: cart,
        subtotal: pricing.subtotal,
        discount: pricing.discount,
        shipping_fee: pricing.shipping,
        total: pricing.total,
        coupon_code: couponCode || "",
        discount_note: labels.join(" ＋ ")
      };

     const form = document.createElement("form");
form.method = "POST";
form.action = `${GAS_URL}?path=orders`;

const input = document.createElement("input");
input.type = "hidden";
input.name = "data";
input.value = JSON.stringify(payload);

form.appendChild(input);
document.body.appendChild(form);
form.submit();

    };

    render();
  </script>
</body>
</html>
