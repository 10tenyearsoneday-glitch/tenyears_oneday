
<!doctype html>
<html>
<head>
<meta charset=utf-8>
<title>Checkout FINAL</title>
<link rel=stylesheet href=assets/style.css>
<style>
body{font-family:sans-serif;background:#f5f6f4}
.wrap{max-width:1000px;margin:40px auto;display:grid;grid-template-columns:1.4fr .9fr;gap:30px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.field{margin-bottom:14px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc}
#checkoutBtn{width:100%;padding:14px;border:none;border-radius:14px;background:#2f3a2c;color:#fff}
</style>
</head>
<body>
 <script src="./include-shop.js"></script>
<div class=wrap>
<div class=card>
<h2>配送與付款</h2>
<div class=field><input id=name placeholder=姓名></div>
<div class=field><input id=phone placeholder=手機></div>
<div class=field><input id=email placeholder=Email></div>

<input type=hidden id=storeId>
<input type=hidden id=storeAddr>

<button id=pick711>選 7-11</button>
<div id=storeCard></div>

<textarea id=note placeholder=備註></textarea>
<button id=checkoutBtn>確認下單</button>
</div>

<div class=card>
<h3>訂單摘要</h3>
<div id=sum></div>
</div>
</div>

<script src="https://emap.pcsc.com.tw/EMapSDK/js/emap.js"></script>
<script>
pick711.onclick=()=>{EMap.show({onSelected:(s)=>{
 storeId.value=s.StoreID;
 storeAddr.value=s.StoreAddress;
 storeCard.innerHTML=s.StoreName+"<br>"+s.StoreAddress;
}})};

checkoutBtn.onclick=async()=>{
 checkoutBtn.innerText="送出中...";
 const payload={
  order_id:"TEN"+Date.now(),
  name:name.value,
  phone:phone.value,
  email:email.value,
  shipping_method:"711",
  address_or_store:storeAddr.value,
  store_id:storeId.value,
  note:note.value,
  items:[],
  subtotal:0,
  shipping_fee:0,
  payment_method:"credit"
 };
 const res=await fetch("https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec?path=orders",{method:"POST",body:JSON.stringify(payload)});
 const html=await res.text();
 document.write(html);
};
</script>
</body>
</html>
