<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>結帳｜十年一日 TEN YEARS ONE DAY</title>

  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://emap.pcsc.com.tw/EMapSDK/js/emap.js"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#F8F9F7] to-[#D4E7D1]">
  <!-- header 由 include-shop.js 注入 -->
<script src="./pricing.js"></script>
<script src="./discount-label.js"></script>
<script src="./include-shop.js"></script>
  <script src="./include-member.js"></script>
  <script>
(function requireLogin(){

  const token = localStorage.getItem("ten_token");

  if(!token){
    alert("請先登入會員再進行結帳");
    location.href = "member.html?redirect=checkout.html";
  }

})();
</script>


 <main class="max-w-3xl mx-auto px-4 pt-28 pb-16">
  <div class="card p-6 space-y-6">

    <h1 class="text-xl font-black tracking-widest">結帳資訊</h1>

    <!-- 收件人 -->
    <section class="space-y-3">
      <h2 class="font-black">收件資訊</h2>

      <input id="name" placeholder="姓名" class="input">
      <input id="phone" placeholder="電話" class="input">
      <input id="email" placeholder="Email" class="input">

      <textarea id="address" placeholder="地址" class="input h-20"></textarea>
    </section>

    <!-- 配送方式 -->
    <section class="space-y-3">
<h2 class="font-black">配送方式</h2>

<label class="flex items-center gap-2">
<input type="radio" name="ship" value="home" checked>
宅配到府
</label>

<label class="flex items-center gap-2">
<input type="radio" name="ship" value="store">
超商取貨
</label>

<div id="storeWrap" hidden class="space-y-2">
<button id="pick711" class="border px-3 py-2 rounded-xl">選擇 7-11 門市</button>

<input id="store" placeholder="門市名稱"
class="input">
</div>
</section>

    <!-- 付款 -->
   <section class="space-y-3">
<h2 class="font-black">付款方式</h2>

<label class="flex items-center gap-2">
<input type="radio" name="pay" value="credit" checked>
線上刷卡
</label>

<label class="flex items-center gap-2">
<input type="radio" name="pay" value="cod">
貨到付款
</label>

<div id="codHint" hidden class="text-sm opacity-70">
⚠️ 貨到付款會加收 NT$30
</div>
</section>


    <!-- 金額 -->
    <section class="pt-4 border-t text-sm space-y-2">
      <div class="flex justify-between">
        <span>小計</span><strong id="sumSubtotal"></strong>
      </div>
      <div class="flex justify-between">
        <span>折扣</span><strong id="sumDiscount"></strong>
      </div>
      <div class="flex justify-between">
        <span>運費</span><strong id="sumShipping"></strong>
      </div>
      <div class="flex justify-between text-base font-black">
        <span>合計</span><strong id="sumTotal"></strong>
      </div>
      <div id="discountSummary" class="text-sm opacity-80"></div>
    </section>

    <button id="btnSubmit"
      class="w-full h-11 rounded-2xl bg-[#2f3a2c] text-white font-black">
      確認下單
    </button>

    <div id="toast" class="text-sm"></div>

  </div>
</main>

 <script>
   const storeWrap = document.getElementById("storeWrap");
const address = document.getElementById("address");
const pick711 = document.getElementById("pick711");
const { calcTotal, money } = window.TEN_PRICING;
const { buildDiscountLabels } = window.TEN_DISCOUNT_LABEL;

const CART_KEY = "ten_cart";
const COUPON_KEY = "ten_applied_coupon_v1";
const GAS_URL =
"https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";

const readCart=()=>JSON.parse(localStorage.getItem(CART_KEY)||"[]");

const isFirstPurchase=()=>!localStorage.getItem("ten_has_purchase_v1");

const isBirthday=()=>{
const m=localStorage.getItem("ten_birth_m");
const d=localStorage.getItem("ten_birth_d");
if(!m||!d) return false;
const n=new Date();
return n.getMonth()+1==m && n.getDate()==d;
};

let SETTINGS=null;
async function getSettings(){
if(SETTINGS) return SETTINGS;
const r=await fetch(`${GAS_URL}?path=settings`);
const o=await r.json();
SETTINGS=o.data||o;
return SETTINGS;
}

async function validateCoupon(code,subtotal){
const r=await fetch(`${GAS_URL}?path=coupon_validate&code=${code}&subtotal=${subtotal}`);
const o=await r.json();
return o.ok?o.data:null;
}

/* ================= render ================= */

async function render(){

const cart=readCart();
if(!cart.length) return;

const ship=document.querySelector('input[name="ship"]:checked').value;
const pay=document.querySelector('input[name="pay"]:checked').value;

const settings=await getSettings();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

const couponCode=localStorage.getItem(COUPON_KEY);
const coupon=couponCode?await validateCoupon(couponCode,subtotal):null;

const ctx={
firstPurchase:isFirstPurchase(),
birthday:isBirthday(),
coupon: coupon?{...coupon,code:couponCode}:null
};

const pricing=calcTotal(cart,settings,ctx);

let total=pricing.total;

sumSubtotal.textContent=money(pricing.subtotal);
sumDiscount.textContent=pricing.discount?`- ${money(pricing.discount)}`:money(0);
sumShipping.textContent=pricing.shipping===0?"免運":money(pricing.shipping);
sumTotal.textContent=money(total);

discountSummary.textContent=buildDiscountLabels(pricing).join(" ＋ ");
}

/* ================= toggles ================= */

document.querySelectorAll('input[name="ship"]').forEach(r=>{
r.onchange=()=>{
storeWrap.hidden=r.value!=="store";
if(r.value==="store") address.value="";
render();
};
});

document.querySelectorAll('input[name="pay"]').forEach(r=>{
r.onchange=()=>{
codHint.hidden=r.value!=="cod";
render();
};
});

/* ================= 7-11 ================= */

pick711.onclick=()=>{
emap.open({
callback(d){
store.value=d.storeName;
}
});
};

/* ================= submit ================= */
const btnSubmit = document.getElementById("btnSubmit");
btnSubmit.onclick=async()=>{

const ship=document.querySelector('input[name="ship"]:checked').value;
const pay=document.querySelector('input[name="pay"]:checked').value;

if(!name.value||!phone.value){
toast.textContent="請填姓名與電話";
return;
}

if(ship==="store"&&!store.value){
toast.textContent="請選擇門市";
return;
}

const cart=readCart();
const settings=await getSettings();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

const couponCode=localStorage.getItem(COUPON_KEY);
const coupon=couponCode?await validateCoupon(couponCode,subtotal):null;

const ctx={
firstPurchase:isFirstPurchase(),
birthday:isBirthday(),
coupon: coupon?{...coupon,code:couponCode}:null
};

const pricing=calcTotal(cart,settings,ctx);

let total=pricing.total;

const payload={
order_id:"OD"+Date.now(),
token:localStorage.getItem("ten_token")||"",
name:name.value,
phone:phone.value,
email:email.value,
address_or_store:ship==="home"?address.value:store.value,
shipping_method:ship,
payment_method:pay,
items:cart,
subtotal:pricing.subtotal,
discount:pricing.discount,
shipping_fee:pricing.shipping,
total:total,
coupon_code:couponCode||"",
discount_note:buildDiscountLabels(pricing).join("＋")
};

if(pay==="cod"){
postOrder(payload);
location.href=`thanks.html?order_id=${payload.order_id}`;

}else{
ecpay(payload);
}
};

/* ================= helpers ================= */

function postOrder(payload){
const f=document.createElement("form");
f.method="POST";
f.action=`${GAS_URL}?path=orders`;
const i=document.createElement("input");
i.type="hidden";
i.name="data";
i.value=JSON.stringify(payload);
f.appendChild(i);
document.body.appendChild(f);
f.submit();
}

function ecpay(payload){
fetch(`${GAS_URL}?path=ecpay`,{
method:"POST",
body:JSON.stringify(payload)
}).then(r=>r.text()).then(html=>{
document.write(html);
});
}

/* ================= member autofill ================= */

(async()=>{
try{
const r=await fetch(`${GAS_URL}?path=members_me&token=${localStorage.getItem("ten_token")}`);
const o=await r.json();
if(o.ok){
name.value=o.data.name||"";
phone.value=o.data.phone||"";
email.value=o.data.email||"";
address.value=o.data.address||"";
}
}catch(e){}
})();

render();
</script>

</body>
</html>
