 <script>

   const storeAddr = document.getElementById("storeAddr");
const toast = document.getElementById("toast");
   const btnSubmitOrder = document.getElementById("btnSubmitOrder");


const buildDiscountLabels =
  (window.TEN_DISCOUNT_LABEL && window.TEN_DISCOUNT_LABEL.buildDiscountLabels)
  ? window.TEN_DISCOUNT_LABEL.buildDiscountLabels
  : function(){ return []; };


const CART_KEY = "ten_cart";
const COUPON_KEY = "ten_applied_coupon_v1";
const readCart=()=>JSON.parse(localStorage.getItem(CART_KEY)||"[]");
const isFirstPurchase = () => false; // ✅ 永遠不是首購

const isBirthday=()=>{
const m=localStorage.getItem("ten_birth_m");
const d=localStorage.getItem("ten_birth_d");
if(!m||!d) return false;
const n=new Date();
return n.getMonth()+1==m && n.getDate()==d;
};


let SETTINGS=null;
async function getSettings(){
if(SETTINGS) return SETTINGS;
const r=await fetch(`${window.GAS_PRODUCTS_URL}?path=settings`);
const o=await r.json();
SETTINGS=o.data||o;
return SETTINGS;
}

async function validateCoupon(code, subtotal){
  const r = await fetch(`${window.GAS_PRODUCTS_URL}?path=coupon_validate&code=${encodeURIComponent(code)}&subtotal=${subtotal}`);
  const o = await r.json();

  console.log("COUPON API >>>", o);

  if(!o.ok){
    toast.textContent = o.message || "優惠碼無效或未達使用門檻";
    return null;
  }

  return o.data;
}


/* ================= render ================= */
const sumSubtotal = document.getElementById("sumSubtotal");
const sumDiscount = document.getElementById("sumDiscount");
const sumShipping = document.getElementById("sumShipping");
const sumTotal = document.getElementById("sumTotal");
const discountSummary = document.getElementById("discountSummary");

async function render(){

const cart=readCart();
if(!cart.length) return;

const ship=document.querySelector('input[name="ship"]:checked').value;
const pay=document.querySelector('input[name="pay"]:checked').value;

const settings=await getSettings();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

const couponCode =
  document.getElementById("couponInput")?.value?.trim().toUpperCase() || "";

const coupon=couponCode?await validateCoupon(couponCode,subtotal):null;

const ctx={
  firstPurchase:false,   // ✅ 固定關
  birthday:false,
  coupon: coupon ? {...coupon, code: couponCode} : null
};



const pricing = calcTotal(cart, settings, ctx);
console.log("SETTINGS >>>", settings);
console.log("CTX >>>", ctx);
console.log("PRICING >>>", pricing);



let total=pricing.total;

sumSubtotal.textContent=money(pricing.subtotal);
sumDiscount.textContent=pricing.discount?`- ${money(pricing.discount)}`:money(0);
sumShipping.textContent=pricing.shipping===0?"免運":money(pricing.shipping);
sumTotal.textContent=money(total);

discountSummary.textContent=buildDiscountLabels(pricing).join(" ＋ ");
  // ===== 免運提示 =====
const tip = document.getElementById("ckShipTip");

if(settings.free_shipping_threshold && pricing.shipping > 0){
  const remain = settings.free_shipping_threshold - pricing.subtotal;

  if(remain > 0){
    tip.textContent = `再 ${money(remain)} 即可免運`;
  }else{
    tip.textContent = "";
  }
}else{
  tip.textContent = pricing.shipping === 0 ? "🎉 已達免運門檻" : "";
}

}
   // ⭐ 初始載入時計算一次金額
(async ()=>{
  try{
    await render();

})();

document.getElementById("applyCoupon").onclick = async () => {

  const input = document.getElementById("couponInput");

<script>
/* ================= submit (FINAL, NO SYNTAX ERROR) ================= */

window.render = render; // 讓其他區塊可呼叫重算

function postOrder(payload){

  f.method="POST";
  f.action=`${window.GAS_PRODUCTS_URL}?path=orders`;

  i.value=JSON.stringify(payload);

btnSubmitOrder.onclick = async () => {
  try{
    const ship = document.querySelector('input[name="ship"]:checked')?.value || "home";
    const pay  = document.querySelector('input[name="pay"]:checked')?.value || "credit"; // ✅ 這行就是關鍵

    if(!name.value || !phone.value){
      toast.textContent="請填姓名與電話";
      document.getElementById("ckLoading")?.classList.add("hidden");
      return;
    }

    if((ship==="711" || ship==="family") && !store.value){
      toast.textContent="請選擇門市";
      document.getElementById("ckLoading")?.classList.add("hidden");
      return;
    }

    const cart = readCart();
    const settings = await getSettings();
    const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);

    const couponCode =
      document.getElementById("couponInput")?.value?.trim().toUpperCase() || "";

    const coupon = couponCode ? await validateCoupon(couponCode,subtotal) : null;

    const ctx = {
  firstPurchase: false,  // ✅ 固定關
  birthday: false,
  coupon: coupon ? {...coupon, code: couponCode} : null
};


    const pricing = calcTotal(cart, settings, ctx);

    const payload = {
  order_id:"OD"+Date.now(),
  token: localStorage.getItem("ten_token") || "",
  name: name.value,
  phone: phone.value,
  email: email.value,
  shipping_method: ship,
  payment_method: pay,
  address_or_store: ship==="home" ? address.value : `${store.value} ${storeAddr.value||""}`,
  store_id: localStorage.getItem("ten_cvs_store_id") || "",
  items: cart,
  subtotal: pricing.subtotal,
  discount: pricing.discount,
  shipping_fee: pricing.shipping,
  total: pricing.total,
  coupon_code: couponCode || "",
  discount_note: buildDiscountLabels(pricing).join("＋")
};
    // COD：寫單 → 導到 thanks
    if(pay === "cod"){

      const f=document.createElement("form");
      f.method="POST";
      f.action=`${window.GAS_PRODUCTS_URL}?path=orders`;
      const i=document.createElement("input");
      i.type="hidden";
      i.name="data";
      i.value=JSON.stringify(payload);
      f.appendChild(i);
      document.body.appendChild(f);
      f.submit();

      setTimeout(()=>location.href=`thanks.html?order_id=${payload.order_id}`, 800);
      return;
    }

    // Credit：先打 GAS 拿綠界參數 → 再 POST 綠界
    if(window.__PAYING__) return;
    window.__PAYING__ = true;

    btnSubmitOrder.disabled = true;
    document.getElementById("ckLoading")?.classList.remove("hidden");


    const r = await fetch(`${window.GAS_PRODUCTS_URL}?path=orders`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "data=" + encodeURIComponent(JSON.stringify(payload))
    });

    const res = await r.json();

    if(res && res.gateway === "ECPAY" && res.action && res.params){
      const f = document.createElement("form");
      f.method = "POST";
      f.action = res.action;

      Object.entries(res.params).forEach(([k,v])=>{
        const i=document.createElement("input");
        i.type="hidden";
        i.name=k;
        i.value=String(v);
        f.appendChild(i);
      });

      document.body.appendChild(f);
      f.submit();
      return;
    }

    toast.textContent = (res && res.message) ? res.message : "付款初始化失敗";
    window.__PAYING__ = false;
    btnSubmitOrder.disabled = false;
    document.getElementById("ckLoading")?.classList.add("hidden");

  }catch(err){
    console.error(err);
    toast.textContent="系統錯誤，請稍後再試";
    window.__PAYING__ = false;
    btnSubmitOrder.disabled = false;
    document.getElementById("ckLoading")?.classList.add("hidden");
  }
};
</script>

<script>
(function(){
  const btn = document.getElementById("ckToggleItems");
  const box = document.getElementById("ckItems");
  if(!btn || !box) return;

  const CART_KEY = "ten_cart";

  function readCart(){
    try{ return JSON.parse(localStorage.getItem(CART_KEY)||"[]"); }
    catch{ return []; }
  }

  function saveCart(cart){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function removeItem(i){
    const cart = readCart();
    cart.splice(i,1);
    saveCart(cart);
    renderItems();
    window.render && window.render(); // 重算金額
  }

  function changeQty(i, delta){
    const cart = readCart();
    if(!cart[i]) return;

    cart[i].qty = Number(cart[i].qty||1) + delta;

    // ⭐ qty <= 0 自動移除
    if(cart[i].qty <= 0){
      cart.splice(i,1);
    }

    saveCart(cart);
    renderItems();
    window.render && window.render(); // 重算金額
  }

  function renderItems(){
    const cart = readCart();

    if(!cart.length){
      box.innerHTML = "<div style='opacity:.6'>（購物車已清空）</div>";
      return;
    }

    box.innerHTML = cart.map((it,i)=>`
      <div style="display:flex;align-items:center;gap:8px;font-size:.9rem;margin:6px 0">

        <span style="flex:1">・${it.title}</span>

        <div style="display:flex;align-items:center;gap:6px">

          <button data-i="${i}" data-d="-1"
            style="width:26px;height:26px;border:1px solid #ccc;border-radius:6px">−</button>

          <strong>${it.qty}</strong>

          <button data-i="${i}" data-d="1"
            style="width:26px;height:26px;border:1px solid #ccc;border-radius:6px">＋</button>

        </div>

        <span style="width:70px;text-align:right">
          NT$ ${it.price * it.qty}
        </span>

        <!-- 🗑 刪除 -->
        <button data-del="${i}"
          title="刪除"
          style="border:none;background:none;font-size:16px;opacity:.6">
          🗑
        </button>

      </div>
    `).join("");

    // bind + -
    box.querySelectorAll("button[data-d]").forEach(b=>{
      b.onclick = ()=>{
        changeQty(Number(b.dataset.i), Number(b.dataset.d));
      };
    });

    // bind delete
    box.querySelectorAll("button[data-del]").forEach(b=>{
      b.onclick = ()=>{
        removeItem(Number(b.dataset.del));
      };
    });
  }

  btn.addEventListener("click",()=>{
    const open = box.style.display==="none";
    box.style.display = open?"block":"none";
    btn.textContent = open?"▼ 收合商品明細":"▶ 查看商品明細";
    if(open) renderItems();
  });

})();
</script>

<script>
window.addEventListener("load", () => {
  const q = new URLSearchParams(location.search);

  const ship = q.get("ship");                 // ✅ 我們從 GAS 帶回來的
  const storeName = q.get("CVSStoreName");
  const storeAddrQ = q.get("CVSAddress");

  if (ship === "711" || ship === "family") {
    const r = document.querySelector(`input[name="ship"][value="${ship}"]`);
    if (r) r.checked = true;

    // ✅ 觸發你原本的顯示/隱藏邏輯（syncShip 在另一段 IIFE 裡）
    try { document.querySelector(`input[name="ship"][value="${ship}"]`)?.dispatchEvent(new Event("change")); } catch {}
  }

  if (!storeName) return;

  // ✅ 直接顯示門市區
  storeWrap.hidden = false;

  const store = document.getElementById("store");
  const storeAddr = document.getElementById("storeAddr");

  if (store) store.value = storeName;       // URLSearchParams 已經解碼過，不要再 decodeURIComponent
  if (storeAddr) storeAddr.value = storeAddrQ || "";

  console.log("✅ 門市已帶入", storeName);

  window.render && window.render();
});

</script>

<script>

(function(){

  const TOKEN_KEYS = ["ten_token", "TEN_TOKEN", "member_token", "ten_token"]; // 兼容

  function getMemberToken(){
    for(const k of TOKEN_KEYS){

    }
    return "";
  }

  function setMemberToken(token){
    if(!token) return;
    // ✅ 一定要寫回你下單用的 ten_token
    localStorage.setItem("ten_token", token);
    localStorage.setItem("TEN_TOKEN", token);
    localStorage.setItem("member_token", token);
    sessionStorage.setItem("ten_token", token);
    sessionStorage.setItem("TEN_TOKEN", token);
  }

  function getCart(){
    const raw = localStorage.getItem(CART_KEY) || "[]";
    try { return JSON.parse(raw); } catch { return []; }
  }

  function saveDraft(){
    const draft = {
      t: Date.now(),
      token: getMemberToken(),
      cart: getCart(),
      form: {
        name: $("name")?.value || "",
        phone: $("phone")?.value || "",
        email: $("email")?.value || "",
        address: $("address")?.value || "",           // ✅ 修正 id
        ship: document.querySelector('input[name="ship"]:checked')?.value || "",
        pay: document.querySelector('input[name="pay"]:checked')?.value || "",
        store: $("store")?.value || "",
        storeAddr: $("storeAddr")?.value || "",
        coupon: $("couponInput")?.value || ""         // ✅ 修正 id
      }
    };
    localStorage.setItem(KEY, JSON.stringify(draft));
  }

  function restoreDraft(){
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    let d; try { d = JSON.parse(raw); } catch { return; }

    // 避免太久以前
    if(Date.now() - (d.t||0) > 6*60*60*1000) return;

    if(d.token) setMemberToken(d.token);

    if(d.form){
      $("name") && ( $("name").value = d.form.name || "" );
      $("phone") && ( $("phone").value = d.form.phone || "" );
      $("email") && ( $("email").value = d.form.email || "" );
      $("address") && ( $("address").value = d.form.address || "" );
      $("couponInput") && ( $("couponInput").value = d.form.coupon || "" );

      if(d.form.ship){
        const r = document.querySelector(`input[name="ship"][value="${d.form.ship}"]`);
        if(r){ r.checked = true; try{ r.dispatchEvent(new Event("change")); }catch{} }
      }
      if(d.form.pay){
        const r = document.querySelector(`input[name="pay"][value="${d.form.pay}"]`);
        if(r){ r.checked = true; try{ r.dispatchEvent(new Event("change")); }catch{} }
      }

      // 門市
      if(d.form.store){
        const sw = $("storeWrap");
        if(sw) sw.hidden = false;
        $("store") && ( $("store").value = d.form.store );
        $("storeAddr") && ( $("storeAddr").value = d.form.storeAddr || "" );
      }
    }
  }

  // ✅ 任何輸入都存（你沒有 form，所以不要限制 form）
  document.addEventListener("input", (e)=>{
    if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) saveDraft();
  });

  // ✅ 選項變更也存
  document.addEventListener("change", (e)=>{
    if(e.target && e.target.matches && e.target.matches('input[name="ship"],input[name="pay"]')) saveDraft();
  });

  // ✅ 離開前再保險存一次
  window.addEventListener("beforeunload", saveDraft);

  // ✅ 回來就還原
  window.addEventListener("load", ()=>{
    restoreDraft();
    setTimeout(saveDraft, 200);
  });

  // 提供給 openC2CStore 主動存
  window.__saveCheckoutDraft = saveDraft;
})();
</script>
<script>
window.addEventListener("message", function (event) {
  if (event.origin !== "https://script.google.com") return;

  const data = event.data || {};
  if (data.type !== "EC_PAY_CVS_SELECTED") return;

  const ship = data.ship || "";
  const storeName = data.storeName || "";
  const storeAddr = data.storeAddr || "";
  const storeId = data.storeId || "";

  if (ship === "711" || ship === "family") {
    const r = document.querySelector(`input[name="ship"][value="${ship}"]`);
    if (r) {
      r.checked = true;
      try { r.dispatchEvent(new Event("change")); } catch {}
    }
  }

  if (storeWrap) storeWrap.hidden = false;
  if (document.getElementById("store")) {
    document.getElementById("store").value = storeName;
  }
  if (document.getElementById("storeAddr")) {
    document.getElementById("storeAddr").value = storeAddr;
  }

  localStorage.setItem("ten_cvs_store_id", storeId);

  if (window.__saveCheckoutDraft) window.__saveCheckoutDraft();

  try {
    if (window.__storePopup && !window.__storePopup.closed) {
      window.__storePopup.close();
    }
  } catch (e) {
    console.warn("popup close failed", e);
  }

  console.log("✅ 門市已由 postMessage 帶回", { ship, storeName, storeAddr, storeId });

  if (window.render) window.render();
});
</script>
