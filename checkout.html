 <script>
const storeWrap = document.getElementById("storeWrap");
const address = document.getElementById("address");

const name = document.getElementById("name");
const phone = document.getElementById("phone");
const email = document.getElementById("email");
const store = document.getElementById("store");
   const storeAddr = document.getElementById("storeAddr");
const toast = document.getElementById("toast");
   const btnSubmitOrder = document.getElementById("btnSubmitOrder");


const buildDiscountLabels =
  (window.TEN_DISCOUNT_LABEL && window.TEN_DISCOUNT_LABEL.buildDiscountLabels)
  ? window.TEN_DISCOUNT_LABEL.buildDiscountLabels
  : function(){ return []; };


const CART_KEY = "ten_cart";
const COUPON_KEY = "ten_applied_coupon_v1";
const readCart=()=>JSON.parse(localStorage.getItem(CART_KEY)||"[]");

const isFirstPurchase=()=>!localStorage.getItem("ten_has_purchase_v1");

const isBirthday=()=>{
const m=localStorage.getItem("ten_birth_m");
const d=localStorage.getItem("ten_birth_d");
if(!m||!d) return false;
const n=new Date();
return n.getMonth()+1==m && n.getDate()==d;
};


let SETTINGS=null;
async function getSettings(){
if(SETTINGS) return SETTINGS;
const r=await fetch(`${window.GAS_PRODUCTS_URL}?path=settings`);
const o=await r.json();
SETTINGS=o.data||o;
return SETTINGS;
}

async function validateCoupon(code, subtotal){
  const r = await fetch(`${window.GAS_PRODUCTS_URL}?path=coupon_validate&code=${encodeURIComponent(code)}&subtotal=${subtotal}`);
  const o = await r.json();

  console.log("COUPON API >>>", o);

  if(!o.ok){
    toast.textContent = o.message || "優惠碼無效或未達使用門檻";
    return null;
  }

  return o.data;
}


/* ================= render ================= */
const sumSubtotal = document.getElementById("sumSubtotal");
const sumDiscount = document.getElementById("sumDiscount");
const sumShipping = document.getElementById("sumShipping");
const sumTotal = document.getElementById("sumTotal");
const discountSummary = document.getElementById("discountSummary");

async function render(){

const cart=readCart();
if(!cart.length) return;

const ship=document.querySelector('input[name="ship"]:checked').value;
const pay=document.querySelector('input[name="pay"]:checked').value;

const settings=await getSettings();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

const couponCode =
  document.getElementById("couponInput")?.value?.trim().toUpperCase() || "";

const coupon=couponCode?await validateCoupon(couponCode,subtotal):null;

const ctx={
  firstPurchase:isFirstPurchase(),
  birthday:false,   // ⭐ 前端生日一定關掉
  coupon: coupon ? {...coupon, code: couponCode} : null
};


const pricing = calcTotal(cart, settings, ctx);
console.log("SETTINGS >>>", settings);
console.log("CTX >>>", ctx);
console.log("PRICING >>>", pricing);



let total=pricing.total;

sumSubtotal.textContent=money(pricing.subtotal);
sumDiscount.textContent=pricing.discount?`- ${money(pricing.discount)}`:money(0);
sumShipping.textContent=pricing.shipping===0?"免運":money(pricing.shipping);
sumTotal.textContent=money(total);

discountSummary.textContent=buildDiscountLabels(pricing).join(" ＋ ");
  // ===== 免運提示 =====
const tip = document.getElementById("ckShipTip");

if(settings.free_shipping_threshold && pricing.shipping > 0){
  const remain = settings.free_shipping_threshold - pricing.subtotal;

  if(remain > 0){
    tip.textContent = `再 ${money(remain)} 即可免運`;
  }else{
    tip.textContent = "";
  }
}else{
  tip.textContent = pricing.shipping === 0 ? "🎉 已達免運門檻" : "";
}

}
   // ⭐ 初始載入時計算一次金額
(async ()=>{
  try{
    await render();
  }catch(e){
    console.error("initial render failed", e);
  }
})();

document.getElementById("applyCoupon").onclick = async () => {

  const input = document.getElementById("couponInput");
  const toast = document.getElementById("couponToast");

  const c = input.value.trim().toUpperCase();

  if(!c){
    toast.textContent = "請輸入優惠碼";
    return;
  }
  await render();

  toast.textContent = "已嘗試套用優惠碼";
};
/* ================= submit ================= */
btnSubmitOrder.onclick = async () => {
const ship=document.querySelector('input[name="ship"]:checked').value;
const pay=document.querySelector('input[name="pay"]:checked').value;

if(!name.value||!phone.value){
toast.textContent="請填姓名與電話";
  document.getElementById("ckLoading")?.classList.add("hidden");
return;
}

if((ship==="711" || ship==="family") && !store.value){
  toast.textContent="請選擇門市";
  document.getElementById("ckLoading")?.classList.add("hidden");
  return;
}


const cart=readCart();
const settings=await getSettings();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

const couponCode =
  document.getElementById("couponInput")?.value?.trim().toUpperCase() || "";

const coupon=couponCode?await validateCoupon(couponCode,subtotal):null;

const ctx={
  firstPurchase:isFirstPurchase(),
  birthday:false,   // ⭐ 這裡也一定要 false
  coupon: coupon ? {...coupon,code:couponCode} : null
};


const pricing=calcTotal(cart,settings,ctx);

let total=pricing.total;

const payload={
order_id:"OD"+Date.now(),
token:localStorage.getItem("ten_token")||"",
name:name.value,
phone:phone.value,
email:email.value,
address_or_store:
  ship==="home" ? address.value : `${store.value} ${storeAddr.value||""}`,
shipping_method:ship,
payment_method:pay,
items:cart,
subtotal:pricing.subtotal,
discount:pricing.discount,
shipping_fee:pricing.shipping,
total:total,
coupon_code:couponCode||"",
discount_note:buildDiscountLabels(pricing).join("＋")
};

if(pay==="cod"){
  localStorage.setItem("ten_has_purchase_v1","1");
  postOrder(payload);

  setTimeout(()=>{
    document.getElementById("ckLoading")?.classList.add("hidden");
    location.href=`thanks.html?order_id=${payload.order_id}`;
  },800);
}else{
  document.getElementById("ckLoading").classList.remove("hidden");
  localStorage.setItem("ten_has_purchase_v1","1");

  // ✅ 用 fetch 送到 GAS 取得「綠界 action+params」（GAS 內含 HashKey 才能算 CheckMacValue）
  const r = await fetch(`${window.GAS_PRODUCTS_URL}?path=orders`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
    body: new URLSearchParams({ data: JSON.stringify(payload) }).toString()
  });

  const res = await r.json();

  if(!res.ok || res.gateway!=="ECPAY"){
    document.getElementById("ckLoading")?.classList.add("hidden");
    toast.textContent = res.message || "付款建立失敗";
    return;
  }

  // ✅ 在「最上層頁面」建立 form，直接 POST 到綠界（不會被 iframe 擋）
  const form = document.createElement("form");
  form.method = "POST";
  form.action = res.action;

  const params = res.params || {};
  Object.keys(params).forEach(k=>{
    const inp = document.createElement("input");
    inp.type = "hidden";
    inp.name = k;
    inp.value = String(params[k]);
    form.appendChild(inp);
  });

  document.body.appendChild(form);
  form.submit();
}

/* ================= helpers ================= */

function postOrder(payload){
const f=document.createElement("form");
f.method="POST";
f.action=`${window.GAS_PRODUCTS_URL}?path=orders`;
const i=document.createElement("input");
i.type="hidden";
i.name="data";
i.value=JSON.stringify(payload);
f.appendChild(i);
document.body.appendChild(f);
f.submit();
}

function submitOrder(orderData){
  localStorage.setItem("ten_has_purchase_v1","1");
  postOrder(orderData);
}

</script>
<script>
(function(){
  const btn = document.getElementById("ckToggleItems");
  const box = document.getElementById("ckItems");
  if(!btn || !box) return;

  const CART_KEY = "ten_cart";

  function readCart(){
    try{ return JSON.parse(localStorage.getItem(CART_KEY)||"[]"); }
    catch{ return []; }
  }

  function saveCart(cart){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function removeItem(i){
    const cart = readCart();
    cart.splice(i,1);
    saveCart(cart);
    renderItems();
    window.render && window.render(); // 重算金額
  }

  function changeQty(i, delta){
    const cart = readCart();
    if(!cart[i]) return;

    cart[i].qty = Number(cart[i].qty||1) + delta;

    // ⭐ qty <= 0 自動移除
    if(cart[i].qty <= 0){
      cart.splice(i,1);
    }

    saveCart(cart);
    renderItems();
    window.render && window.render(); // 重算金額
  }

  function renderItems(){
    const cart = readCart();

    if(!cart.length){
      box.innerHTML = "<div style='opacity:.6'>（購物車已清空）</div>";
      return;
    }

    box.innerHTML = cart.map((it,i)=>`
      <div style="display:flex;align-items:center;gap:8px;font-size:.9rem;margin:6px 0">

        <span style="flex:1">・${it.title}</span>

        <div style="display:flex;align-items:center;gap:6px">

          <button data-i="${i}" data-d="-1"
            style="width:26px;height:26px;border:1px solid #ccc;border-radius:6px">−</button>

          <strong>${it.qty}</strong>

          <button data-i="${i}" data-d="1"
            style="width:26px;height:26px;border:1px solid #ccc;border-radius:6px">＋</button>

        </div>

        <span style="width:70px;text-align:right">
          NT$ ${it.price * it.qty}
        </span>

        <!-- 🗑 刪除 -->
        <button data-del="${i}"
          title="刪除"
          style="border:none;background:none;font-size:16px;opacity:.6">
          🗑
        </button>

      </div>
    `).join("");

    // bind + -
    box.querySelectorAll("button[data-d]").forEach(b=>{
      b.onclick = ()=>{
        changeQty(Number(b.dataset.i), Number(b.dataset.d));
      };
    });

    // bind delete
    box.querySelectorAll("button[data-del]").forEach(b=>{
      b.onclick = ()=>{
        removeItem(Number(b.dataset.del));
      };
    });
  }

  btn.addEventListener("click",()=>{
    const open = box.style.display==="none";
    box.style.display = open?"block":"none";
    btn.textContent = open?"▼ 收合商品明細":"▶ 查看商品明細";
    if(open) renderItems();
  });

})();
</script>
<script>
(function(){
const radios=document.querySelectorAll('input[name="ship"]');

function syncShip(){
  const v = document.querySelector('input[name="ship"]:checked')?.value;
  if(!v) return;

  storeWrap.hidden = v==="home";

  if(v!=="home"){
    address.value="";
  }else{
    store.value="";
    storeAddr.value="";
  }
}

// 綁事件
radios.forEach(r=>{
  r.addEventListener("change",syncShip);
});

// ⭐第一次載入也跑一次
syncShip();

})();


</script>
