<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>結帳｜十年一日 TEN YEARS ONE DAY</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 你的購物車邏輯 -->
  <script src="./include-shop.js"></script>

  <style>
    body {
      font-family: "Noto Serif TC", serif;
      background: #f8f9f7;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Header 由 include-shop.js 注入 -->

  <main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-semibold mb-6">結帳確認</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- 左：訂單摘要 -->
      <section class="md:col-span-2 bg-white rounded-xl shadow p-6">
        <h2 class="text-lg font-medium mb-4">訂單內容</h2>

        <div id="checkoutItems" class="space-y-4 text-sm"></div>

        <hr class="my-4"/>

        <div class="space-y-2 text-sm">
          <div class="flex justify-between">
            <span>小計</span>
            <span id="coSubtotal">NT$ 0</span>
          </div>
          <div class="flex justify-between">
            <span>折扣</span>
            <span id="coDiscount">- NT$ 0</span>
          </div>
          <div class="flex justify-between font-semibold text-base">
            <span>合計</span>
            <span id="coTotal">NT$ 0</span>
          </div>
        </div>
      </section>

      <!-- 右：填資料（UI only） -->
      <aside class="bg-white rounded-xl shadow p-6 text-sm space-y-4">
        <h2 class="text-lg font-medium">收件資訊</h2>

        <input class="w-full border rounded px-3 py-2" placeholder="收件人姓名">
        <input class="w-full border rounded px-3 py-2" placeholder="手機號碼">
        <input class="w-full border rounded px-3 py-2" placeholder="Email">
        <input class="w-full border rounded px-3 py-2" placeholder="收件地址">

        <hr>

        <h3 class="font-medium">付款方式</h3>
        <label class="flex items-center gap-2">
          <input type="radio" checked disabled>
          信用卡（即將開放）
        </label>
        <label class="flex items-center gap-2 text-gray-400">
          <input type="radio" disabled>
          ATM 轉帳
        </label>

        <button
          id="goPay"
          class="w-full mt-4 bg-gray-300 text-gray-600 py-3 rounded-lg cursor-not-allowed"
        >
          前往付款（尚未開放）
        </button>

        <a href="./cart.html" class="block text-center text-xs text-gray-500 mt-2">
          ← 返回購物車
        </a>
      </aside>

    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const money = (n) => `NT$ ${Math.round(Number(n || 0))}`;

    function renderCheckout() {
      if (!window.TEN) return;

      const cart = window.TEN.readCart();
      const applied = window.TEN_APPLIED || { discount: 0 };

      if (!cart.length) {
        $("checkoutItems").innerHTML =
          `<div class="text-gray-500">購物車是空的</div>`;
        return;
      }

      $("checkoutItems").innerHTML = cart.map(it => `
        <div class="flex justify-between items-center">
          <div>
            <div class="font-medium">${it.title}</div>
            <div class="text-xs text-gray-500">數量 × ${it.qty}</div>
          </div>
          <div>${money(it.price * it.qty)}</div>
        </div>
      `).join("");

      const subtotal = cart.reduce((s, it) => s + it.price * it.qty, 0);
      const discount = Math.min(subtotal, Number(applied.discount || 0));
      const total = subtotal - discount;

      $("coSubtotal").textContent = money(subtotal);
      $("coDiscount").textContent = `- ${money(discount)}`;
      $("coTotal").textContent = money(total);
    }

    window.addEventListener("DOMContentLoaded", renderCheckout);
    window.addEventListener("cart:changed", renderCheckout);
  </script>

</body>
</html>
