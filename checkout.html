<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>結帳｜十年一日 TEN YEARS ONE DAY</title>

  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://emap.pcsc.com.tw/EMapSDK/js/emap.js"></script>
  <style>
/* ===== Checkout UI polish ===== */
.ck-wrap{max-width:860px;margin:0 auto;padding:14px}
.ck-card{background:#fff;border-radius:18px;padding:14px 14px 16px;margin-bottom:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.05)}
.ck-card h3{margin:2px 0 10px;font-size:1rem}
.ck-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck-grid.full{grid-template-columns:1fr}
.ck-row{display:flex;flex-direction:column;gap:6px}
.ck-row label{font-size:.82rem;opacity:.7}
.ck-row input,.ck-row select,.ck-row textarea{
  border-radius:12px;border:1px solid rgba(0,0,0,.15);padding:10px 12px;font-size:.95rem}
.ck-summary{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:.95rem}
.ck-total{font-weight:800;font-size:1.1rem}
.ck-cta{position:sticky;bottom:0;background:#fff;padding:10px 0}
.ck-btn{width:100%;border-radius:14px;padding:12px 14px;font-weight:700}
@media(max-width:640px){
  .ck-grid{grid-template-columns:1fr}
}
    .ck-loading{
  position:fixed;inset:0;background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;z-index:9999;
  font-weight:700;font-size:1.1rem
}
.ck-loading.hidden{display:none}
    .ship-box{transition:.25s ease;overflow:hidden}
.ship-box.hide{max-height:0;opacity:0}
.ship-box.show{max-height:300px;opacity:1}
</style>

</head>

<body class="min-h-screen bg-gradient-to-br from-[#F8F9F7] to-[#D4E7D1]">
  <!-- header 由 include-shop.js 注入 -->
<script src="./pricing.js"></script>
<script src="./discount-label.js"></script>
<script src="./include-shop.js"></script>
  <script src="./include-member.js"></script>

  <script>
(function requireLogin(){

  const token = localStorage.getItem("ten_token");

  if(!token){
    alert("請先登入會員再進行結帳");
    location.href = "member.html?redirect=checkout.html";
  }

})();
</script>


 <main class="max-w-3xl mx-auto px-4 pt-28 pb-16">
  <div class="card p-6 space-y-6">

    <h1 class="text-xl font-black tracking-widest">結帳資訊</h1>

    <!-- 收件人 -->
    <div class="ck-wrap">
  <div class="ck-card">
    <h3>收件資料</h3>
    <div class="ck-grid">
    <section class="space-y-3">
      <h2 class="font-black">收件資訊</h2>

      <input id="name" placeholder="姓名" class="input">
      <input id="phone" inputmode="numeric" type="tel" placeholder="電話" class="input">
<input id="email" type="email" placeholder="Email" class="input">
      <textarea id="address" placeholder="地址" class="input h-20"></textarea>
    </section>
 </div>
  </div>
</div>
    <!-- 配送方式 -->
     <div class="ck-card">
    <h3>配送方式</h3>
    <section class="space-y-3">
<h2 class="font-black">配送方式</h2>
<div id="shipHome" class="ship-box show">
<label class="flex items-center gap-2">
<input type="radio" name="ship" value="home" checked>
宅配到府
</label>
</div>
      
<div id="shipStore" class="ship-box hide">
<label class="flex items-center gap-2">
<input type="radio" name="ship" value="store">
超商取貨
</label>

<div id="storeWrap" hidden class="space-y-2">
<button id="pick711" class="border px-3 py-2 rounded-xl">選擇 7-11 門市</button>

<input id="store" placeholder="門市名稱"
class="input">
</div>
</section>
</div>
      </div>
    <!-- 付款 -->
   <section class="space-y-3">
<h2 class="font-black">付款方式</h2>

<label class="flex items-center gap-2">
<input type="radio" name="pay" value="credit" checked>
線上刷卡
</label>

<label class="flex items-center gap-2">
<input type="radio" name="pay" value="cod">
貨到付款
</label>

</section>


    <!-- 金額 -->
    <div style="margin-top:8px">
  <button type="button" id="ckToggleItems" class="secondary" style="width:100%">
    ▶ 查看商品明細
  </button>

  <div id="ckItems" style="display:none;margin-top:8px"></div>
</div>

  <div class="ck-card">
    <h3>訂單摘要</h3>
    <div class="ck-summary">
    <section class="pt-4 border-t text-sm space-y-2">
      <div class="flex justify-between">
        <span>小計</span><strong id="sumSubtotal"></strong>
      </div>
      <div class="flex justify-between">
        <span>折扣</span><strong id="sumDiscount"></strong>
      </div>
      <div class="flex justify-between">
        <span>運費</span><strong id="sumShipping"></strong>
      </div>
      <div class="flex justify-between text-base font-black">
        <span>合計</span><strong id="sumTotal"></strong>
        <div id="ckShipTip" style="margin-top:6px;font-size:.85rem;opacity:.7"></div>

      </div>
      <div id="discountSummary" class="text-sm opacity-80"></div>
    </section>
  </div>
    <div class="ck-total" id="ckTotal"></div>
  </div>
  <div class="ck-cta">
    <button class="ck-btn primary" id="btnSubmitOrder">確認付款</button>

    <div id="toast" class="text-sm"></div>
      <div id="ckConfirm" class="ck-loading hidden">
  <div style="background:#2f3a2c;padding:20px;border-radius:16px;width:90%;max-width:360px">
    <h3>確認付款</h3>
    <div id="ckConfirmText" style="margin:10px 0;font-size:.9rem"></div>
    <button id="ckYes" class="primary" style="width:100%">確認送出</button>
    <button id="ckNo" class="secondary" style="width:100%;margin-top:6px">取消</button>
  </div>
</div>
  </div>
   <div id="ckLoading" class="ck-loading hidden">
  正在送出訂單…
</div>

</main>

 <script>
const storeWrap = document.getElementById("storeWrap");
const address = document.getElementById("address");
const pick711 = document.getElementById("pick711");

const name = document.getElementById("name");
const phone = document.getElementById("phone");
const email = document.getElementById("email");
const store = document.getElementById("store");
const toast = document.getElementById("toast");
   const btnSubmitOrder = document.getElementById("btnSubmitOrder");
function waitPricing(){
  if(!window.TEN_PRICING){
    return setTimeout(waitPricing,50);
  }

  window.calcTotal = TEN_PRICING.calcTotal;
  window.money = TEN_PRICING.money;
}
waitPricing();

const { buildDiscountLabels } = window.TEN_DISCOUNT_LABEL;

const CART_KEY = "ten_cart";
const COUPON_KEY = "ten_applied_coupon_v1";
const GAS_URL =
"https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";

const readCart=()=>JSON.parse(localStorage.getItem(CART_KEY)||"[]");

const isFirstPurchase=()=>!localStorage.getItem("ten_has_purchase_v1");

const isBirthday=()=>{
const m=localStorage.getItem("ten_birth_m");
const d=localStorage.getItem("ten_birth_d");
if(!m||!d) return false;
const n=new Date();
return n.getMonth()+1==m && n.getDate()==d;
};

let SETTINGS=null;
async function getSettings(){
if(SETTINGS) return SETTINGS;
const r=await fetch(`${GAS_URL}?path=settings`);
const o=await r.json();
SETTINGS=o.data||o;
return SETTINGS;
}

async function validateCoupon(code,subtotal){
const r=await fetch(`${GAS_URL}?path=coupon_validate&code=${code}&subtotal=${subtotal}`);
const o=await r.json();
return o.ok?o.data:null;
}

/* ================= render ================= */

async function render(){

const cart=readCart();
if(!cart.length) return;

const ship=document.querySelector('input[name="ship"]:checked').value;
const pay=document.querySelector('input[name="pay"]:checked').value;

const settings=await getSettings();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

const couponCode=localStorage.getItem(COUPON_KEY);
const coupon=couponCode?await validateCoupon(couponCode,subtotal):null;

const ctx={
firstPurchase:isFirstPurchase(),
birthday:isBirthday(),
coupon: coupon?{...coupon,code:couponCode}:null
};

const pricing=calcTotal(cart,settings,ctx);

let total=pricing.total;

sumSubtotal.textContent=money(pricing.subtotal);
sumDiscount.textContent=pricing.discount?`- ${money(pricing.discount)}`:money(0);
sumShipping.textContent=pricing.shipping===0?"免運":money(pricing.shipping);
sumTotal.textContent=money(total);

discountSummary.textContent=buildDiscountLabels(pricing).join(" ＋ ");
}

/* ================= toggles ================= */

document.querySelectorAll('input[name="pay"]').forEach(r=>{
  r.onchange=render;
});
document.querySelectorAll('input[name="ship"]').forEach(r=>{
  r.onchange = render;
});


/* ================= 7-11 ================= */

pick711.onclick = ()=>{
  window.emap.open({
    callback(d){
      store.value = d.storeName || "";
    }
  });
};


/* ================= submit ================= */
btnSubmitOrder.onclick = async () => {
const ship=document.querySelector('input[name="ship"]:checked').value;
const pay=document.querySelector('input[name="pay"]:checked').value;

if(!name.value||!phone.value){
toast.textContent="請填姓名與電話";
  document.getElementById("ckLoading")?.classList.add("hidden");
return;
}

if(ship==="store"&&!store.value){
toast.textContent="請選擇門市";
  document.getElementById("ckLoading")?.classList.add("hidden");
return;
}

const cart=readCart();
const settings=await getSettings();
const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

const couponCode=localStorage.getItem(COUPON_KEY);
const coupon=couponCode?await validateCoupon(couponCode,subtotal):null;

const ctx={
firstPurchase:isFirstPurchase(),
birthday:isBirthday(),
coupon: coupon?{...coupon,code:couponCode}:null
};

const pricing=calcTotal(cart,settings,ctx);

let total=pricing.total;

const payload={
order_id:"OD"+Date.now(),
token:localStorage.getItem("ten_token")||"",
name:name.value,
phone:phone.value,
email:email.value,
address_or_store:ship==="home"?address.value:store.value,
shipping_method:ship,
payment_method:pay,
items:cart,
subtotal:pricing.subtotal,
discount:pricing.discount,
shipping_fee:pricing.shipping,
total:total,
coupon_code:couponCode||"",
discount_note:buildDiscountLabels(pricing).join("＋")
};

if(pay==="cod"){
postOrder(payload);
   document.getElementById("ckLoading")?.classList.add("hidden");
location.href=`thanks.html?order_id=${payload.order_id}`;

}else{
ecpay(payload);
}
};

/* ================= helpers ================= */

function postOrder(payload){
const f=document.createElement("form");
f.method="POST";
f.action=`${GAS_URL}?path=orders`;
const i=document.createElement("input");
i.type="hidden";
i.name="data";
i.value=JSON.stringify(payload);
f.appendChild(i);
document.body.appendChild(f);
f.submit();
}

function ecpay(payload){
fetch(`${GAS_URL}?path=ecpay`,{
method:"POST",
body:JSON.stringify(payload)
}).then(r=>r.text()).then(html=>{
document.write(html);
});
}

/* ================= member autofill ================= */

setTimeout(()=>{
  if(window.TEN_MEMBER){
    name.value = TEN_MEMBER.name || "";
    phone.value = TEN_MEMBER.phone || "";
    email.value = TEN_MEMBER.email || "";
    address.value = TEN_MEMBER.address || "";
  }
},500);

render();
</script>
<script>
(function(){
  const btn = document.getElementById("ckToggleItems");
  const box = document.getElementById("ckItems");
  if(!btn || !box) return;

  // 從購物車抓商品（沿用你現有 cart）
  function readCart(){
    try{ return JSON.parse(localStorage.getItem("ten_cart")||"[]"); }
    catch{ return []; }
  }

  function render(){
    const cart = readCart();
    if(!cart.length){
      box.innerHTML = "<div style='opacity:.6'>（無商品）</div>";
      return;
    }
    box.innerHTML = cart.map(it=>`
      <div style="display:flex;justify-content:space-between;font-size:.9rem;margin:4px 0">
        <span>・${it.title} × ${it.qty}</span>
        <span>NT$ ${it.price * it.qty}</span>
      </div>
    `).join("");
  }

  btn.addEventListener("click",()=>{
    const open = box.style.display==="none";
    box.style.display = open?"block":"none";
    btn.textContent = open?"▼ 收合商品明細":"▶ 查看商品明細";
    if(open) render();
  });
})();
</script>
<script>
(async function(){
  try{
   const GAS_URL =
"https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";
    const res = await fetch(`${GAS_URL}?path=settings`,{cache:"no-store"});
    const s = await res.json();
    const fee = Number(s.shipping_fee||0);
    const free = Number(s.free_shipping_threshold||0);

    function cartSubtotal(){
      try{
        return (JSON.parse(localStorage.getItem("ten_cart")||"[]"))
          .reduce((t,i)=>t+i.price*i.qty,0);
      }catch{ return 0;}
    }

    const tip = document.getElementById("ckShipTip");
    if(!tip || !free) return;

    const sub = cartSubtotal();
    if(sub < free){
      tip.textContent = `再 NT$ ${Math.max(0,free-sub)} 即可免運`;
    }else{
      tip.textContent = "🎉 已達免運門檻";
    }
  }catch(e){}
})();
</script>
<script>
(function(){
  const btn = document.getElementById("btnSubmitOrder");
  const mask = document.getElementById("ckLoading");
  if(!btn || !mask) return;

  let locked=false;

  btn.addEventListener("click",(e)=>{
    if(locked){
      e.preventDefault();
      return;
    }
    locked=true;
    mask.classList.remove("hidden");
  });
})();
</script>
<script>
(function(){
  const radios = document.querySelectorAll('input[name="ship"]');
  const home = document.getElementById("shipHome");
  const store = document.getElementById("shipStore");

 radios.forEach(r=>{
  r.addEventListener("change",()=>{
    storeWrap.hidden = r.value !== "store";

      if(r.value==="home"){
        home.classList.add("show"); home.classList.remove("hide");
        store.classList.add("hide"); store.classList.remove("show");
      }else{
        store.classList.add("show"); store.classList.remove("hide");
        home.classList.add("hide"); home.classList.remove("show");
      }
    });
  });
})();
</script>
<script>
(function(){
  const btn = document.getElementById("btnSubmitOrder");
  const pop = document.getElementById("ckConfirm");
  const yes = document.getElementById("ckYes");
  const no = document.getElementById("ckNo");
  const txt = document.getElementById("ckConfirmText");

  if(!btn||!pop) return;

  let confirmed = false;

  btn.addEventListener("click",(e)=>{
    if(confirmed) return;     // 已確認就真的送
    e.preventDefault();
    txt.textContent = "請確認資料無誤後再付款";
    pop.classList.remove("hidden");
  });

  yes.addEventListener("click",()=>{
    confirmed = true;
    pop.classList.add("hidden");
    btn.click(); // 第二次才會進送單流程
  });

  no.addEventListener("click",()=>{
    pop.classList.add("hidden");
  });
})();

</script>

</body>
