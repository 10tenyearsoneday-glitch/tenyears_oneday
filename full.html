
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>全系列｜十年一日</title>
<script src="include.js"></script></head>
<body>
<h2>全系列（所有上架）</h2>
<div id="list"></div>
<script>
fetch(TEN_CONFIG.PRODUCTS_GAS+"?path=products").then(r=>r.json()).then(d=>{
  const items=d.filter(p=>p.status==='上架');
  document.getElementById("list").innerHTML=items.map(p=>"<div>"+p.title+"</div>").join("");
});
</script>
</body></html>
