<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員資料｜十年一日 TEN YEARS ONE DAY</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .page-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 14px;background:linear-gradient(135deg,#F8F9F7 0%,#D4E7D1 55%,#B8C9A8 100%);}
    .card{width:min(640px,100%);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.06);border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.08);padding:22px 18px;}
    .brand{text-align:center;margin-bottom:14px}
    .brand h1{margin:0;font-size:20px;letter-spacing:.12em}
    .brand .sub{margin-top:6px;opacity:.75;font-size:12px;letter-spacing:.12em}
    .panel{background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.06);border-radius:22px;padding:18px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field label{display:block;font-size:12px;opacity:.75;margin:0 0 6px 4px;letter-spacing:.12em}
    .field input{width:100%;padding:12px 14px;border-radius:16px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.92);outline:none}
    .row{display:flex;gap:10px;margin-top:14px}
    .btn{flex:1;border:none;border-radius:18px;padding:14px 12px;font-size:15px;font-weight:900;letter-spacing:.16em;cursor:pointer;background:#8ea08e;color:#fff}
    .btn.outline{background:transparent;color:#2f3a2c;border:1px solid rgba(0,0,0,.18)}
    .toast{margin-top:10px;text-align:center;font-size:13px;min-height:18px}
    @media (max-width:520px){.grid2{grid-template-columns:1fr}.row{flex-direction:column}}
  </style>
</head>
<body>
   <script src="./include-shop.js"></script>
 <script src="./include-member.js"></script>
  <div class="page-wrap">
    <div class="card" id="profileWrap">
      <div class="brand">
        <h1>會員資料</h1>
        <div class="sub">十年一日 TEN YEARS ONE DAY</div>
      </div>

      <section class="panel">
        <div class="grid2">
          <div class="field">
            <label>姓名 *</label>
            <input id="pfName" placeholder="姓名">
          </div>
          <div class="field">
            <label>手機（帳號）</label>
            <input id="pfPhone" disabled>
          </div>
          <div class="field">
            <label>Email（選填）</label>
            <input id="pfEmail" inputmode="email" autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="field">
            <label>生日（選填）</label>
            <input id="pfBirth" type="date">
          </div>
        </div>

        <div class="field" style="margin-top:10px">
          <label>地址（選填）</label>
          <input id="pfAddress" autocomplete="street-address" placeholder="縣市區路段號樓">
        </div>

        <div class="row">
          <button id="btnSaveProfile" class="btn" type="button">儲存</button>
          <button id="btnLogout" class="btn outline" type="button">登出</button>
        </div>

        <div id="profileToast" class="toast"></div>
      </section>
      <hr style="margin:22px 0;opacity:.35">

<section class="panel">
  <h3 style="text-align:center;letter-spacing:.18em;margin-bottom:14px">
    我的訂單
  </h3>

  <div id="orderList" style="font-size:14px;text-align:left">
    載入中…
  </div>
  </div>
  </div>
</section>
    

 <script>
(async function(){

  const box = document.getElementById("orderList");
  if(!box) return;

  const token = localStorage.getItem("ten_token") || "";
  if(!token){
    box.innerHTML = "請先登入後查看訂單";
    return;
  }

  const API = window.GAS_PRODUCTS_URL ||
    "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";

  const r = await fetch(API + "?path=my_orders&token=" + encodeURIComponent(token));
  const o = await r.json();

  if(!o.ok || !o.orders || !o.orders.length){
    box.innerHTML = "尚無訂單";
    return;
  }

  // 新 → 舊
  const orders = o.orders.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  let html = "";

  orders.forEach(d=>{

    html += `
      <div style="border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:12px;margin:10px 0;background:#fff">

        <div><b>訂單編號：</b>${d.order_id}</div>
        <div><b>狀態：</b>${d.pay_status||""}</div>
        <div><b>金額：</b>NT$ ${d.total}</div>

        <button class="toggleItems secondary"
          data-id="${d.order_id}"
          style="margin-top:6px">
          ▶ 查看商品明細
        </button>

        <div class="orderItems"
          style="display:none;margin-top:6px;font-size:.9rem;opacity:.85"></div>

      </div>
    `;
  });

  box.innerHTML = html;

})();
</script>

<script>
document.addEventListener("click", async function(e){

  const btn = e.target.closest(".toggleItems");
  if(!btn) return;

  const box = btn.nextElementSibling;
  const open = box.style.display === "none";

  btn.textContent = open ? "▼ 收合商品明細" : "▶ 查看商品明細";
  box.style.display = open ? "block" : "none";

  if(!open) return;

  const API = window.GAS_PRODUCTS_URL;
  const id = btn.dataset.id;

  const r = await fetch(API + "?path=order_get&id=" + id);
  const o = await r.json();
  if(!o.ok) return;

  const items = JSON.parse(o.data.items_json||"[]");

  let html = "";
  items.forEach(it=>{
    html += "<div>・"+it.title+" × "+it.qty+"</div>";
  });

  box.innerHTML = html;

});
</script>

<script>
document.addEventListener("click", async e=>{

  const btn = e.target.closest(".toggleItems");
  if(!btn) return;

  const box = btn.nextElementSibling;
  const open = box.style.display === "none";

  // 切文字
  btn.textContent = open ? "▼ 收合商品明細" : "▶ 查看商品明細";
  box.style.display = open ? "block" : "none";

  if(!open) return;

  const id = btn.dataset.id;

  // 撈訂單資料
  const r = await fetch(`${window.GAS_PRODUCTS_URL}?path=order_get&id=${id}`);
  const o = await r.json();
  if(!o.ok) return;

  const items = JSON.parse(o.data.items_json||"[]");

  box.innerHTML = items.map(it=>`
    <div>・${it.title} × ${it.qty}</div>
  `).join("");
});
</script>

</body>
</html>
