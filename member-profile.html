<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>會員中心｜十年一日</title>
</head>
<body>

<h2>會員中心</h2>

<div>姓名：<span id="pName"></span></div>
<div>手機：<span id="pPhone"></span></div>
<div>生日：<span id="pBirth"></span></div>

<button onclick="logout()">登出</button>

<script src="./include-member.js"></script>
<script>
(async () => {
  const me = await TEN_MEMBER.me();

  if (!me.ok) {
    location.href = "member.html";
    return;
  }

  document.getElementById("pName").textContent = me.profile.name;
  document.getElementById("pPhone").textContent = me.profile.phone;
  document.getElementById("pBirth").textContent = me.profile.birth || "-";
})();

async function logout() {
  await TEN_MEMBER.logout();
  location.href = "member.html";
}
</script>

</body>
</html>
