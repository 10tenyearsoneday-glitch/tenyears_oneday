<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會員資料｜十年一日</title>
<style>
body{font-family:"Noto Serif TC",serif;background:#f6f8f4;margin:0}
.box{max-width:720px;margin:40px auto;background:#fff;border-radius:16px;padding:24px}
button{padding:8px 14px;border:none;border-radius:8px;background:#8fa38f;color:#fff}
</style>
</head>
<body>

<div class="box">
<h2 id="title"></h2>
<p id="info"></p>

<h3>我的訂單</h3>
<ul id="orders"></ul>

<button onclick="logout()">登出</button>
</div>

<iframe id="gasBridge" style="display:none"></iframe>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";
const token=localStorage.getItem("memberToken");
if(!token) location.href="member.html";

/* bridge */
let ready=false,waiters={};
const f=document.getElementById("gasBridge");
f.src=GAS_URL+"?path=bridge";
window.addEventListener("message",e=>{
 const m=e.data||{};
 if(m.type==="GAS_BRIDGE_READY"){ready=true;load();return;}
 if(m.type==="GAS_BRIDGE_RES"&&waiters[m.id]){
   waiters[m.id](m);delete waiters[m.id];
 }
});
function call(path,method,body){
 return new Promise((res,rej)=>{
  const id=Math.random().toString(36).slice(2);
  waiters[id]=r=>r.error?rej(r.error):res(r.data);
  f.contentWindow.postMessage({type:"GAS_BRIDGE_REQ",id,path,method,body},"*");
 });
}

async function load(){
 const me=await call("member_me","GET",{token});
 const m=me.member;
 const isBirthday=(new Date().getMonth()+1)==m.birth_m;
 title.textContent=m.name+(isBirthday?" 🎂":"");
 info.textContent=`手機：${m.phone}｜地址：${m.address}`;

 const o=await call("member_orders","GET",{token});
 orders.innerHTML=o.orders.map(x=>
  `<li>${x.order_id}｜${x.total}</li>`
 ).join("");
}

function logout(){
 localStorage.removeItem("memberToken");
 location.href="member.html";
}
</script>
</body>
</html>
