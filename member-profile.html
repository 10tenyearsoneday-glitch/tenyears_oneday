<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>會員資料｜十年一日 TEN YEARS ONE DAY</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body{background:linear-gradient(135deg,#F8F9F7 0%,#D4E7D1 55%,#A8BCA5 100%);}
    .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 60px;}
    .card{background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.08);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.08);overflow:hidden}
    .head{padding:18px 18px 10px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
    .ttl{font-size:1.35rem;font-weight:900;letter-spacing:.08em}
    .sub{margin-top:6px;opacity:.75;line-height:1.6}
    .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(142,160,142,.16);border:1px solid rgba(142,160,142,.35);font-size:.9rem}
    .body{padding:14px 18px 18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .inp{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.92);outline:none}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{border:none;border-radius:16px;padding:12px 14px;font-size:.98rem;font-weight:900;letter-spacing:.10em;cursor:pointer;background:#8ea08e;color:#fff}
    .btn.out{background:rgba(255,255,255,.88);color:#2f3a2c;border:1px solid rgba(0,0,0,.12)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .toast{margin-top:10px;font-size:.92rem;opacity:.92}
    .muted{opacity:.7;font-size:.9rem;line-height:1.6}
    table{width:100%;border-collapse:separate;border-spacing:0 10px}
    th{font-size:.85rem;opacity:.75;text-align:left;padding:0 8px}
    td{background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);padding:12px 10px;border-radius:14px;vertical-align:top}
    .items{white-space:pre-wrap;font-size:.9rem;line-height:1.5}
    @media (max-width:840px){.grid{grid-template-columns:1fr} th{display:none} td{display:block}}
  </style>
</head>
<body>
  <script src="./include.js" defer></script>

  <div class="wrap">
    <div class="card">
      <div class="head">
        <div>
          <div class="ttl">會員資料 <span id="bdayIcon" style="display:none">🎂</span></div>
          <div class="sub" id="subline">讀取中…</div>
          <div class="pillrow" id="discountRow"></div>
        </div>
        <div class="btnrow">
          <button class="btn out" id="btnReload" type="button">重新整理</button>
          <button class="btn out" id="btnLogout" type="button">登出</button>
        </div>
      </div>

      <div class="body">
        <div class="grid">
          <div>
            <label class="muted">會員編號</label>
            <input class="inp" id="m_id" disabled />
          </div>
          <div>
            <label class="muted">手機</label>
            <input class="inp" id="m_phone" disabled />
          </div>
        </div>

        <div class="grid" style="margin-top:10px">
          <div>
            <label class="muted">姓名（可編輯）</label>
            <input class="inp" id="m_name" />
          </div>
          <div>
            <label class="muted">配送地址（可編輯）</label>
            <input class="inp" id="m_addr" />
          </div>
        </div>

        <div class="grid" style="margin-top:10px">
          <div>
            <label class="muted">生日（鎖定）</label>
            <input class="inp" id="m_birth" disabled />
          </div>
          <div>
            <label class="muted">最後登入</label>
            <input class="inp" id="m_last" disabled />
          </div>
        </div>

        <div class="btnrow">
          <button class="btn" id="btnSave" type="button">保存資料</button>
        </div>
        <div class="toast" id="saveToast"></div>

        <div style="height:1px;background:rgba(0,0,0,.06);margin:16px 0;"></div>

        <div class="ttl" style="font-size:1.12rem">我的訂單</div>
        <div class="muted" style="margin-top:6px">顯示本帳號的訂單清單（order_id / 商品 / 金額 / 地址 / 電話）。</div>

        <div class="toast" id="ordersToast"></div>

        <div style="margin-top:10px;overflow:auto">
          <table id="ordersTable" hidden>
            <thead>
              <tr>
                <th style="width:140px">時間</th>
                <th style="width:140px">訂單編號</th>
                <th>商品</th>
                <th style="width:120px">金額</th>
                <th style="width:240px">寄送資訊</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ✅ 改成你目前部署的 GAS Web App /exec（很重要）
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxV6GCa_MUn-s-bNMH7Y7HJzF1DL1oJ2mb9taU8tGprY8fqb-DxknfFfOBzRWHi3RZzMw/exec";

  const TOKEN_KEY = "ten_member_token";
  const MID_KEY   = "ten_member_id";
  const SETTINGS_CACHE_KEY = "tyod_settings_cache_v1";

  const $ = (id) => document.getElementById(id);
  const toast = (id, msg, ok=true) => {
    const el=$(id); if(!el) return;
    el.textContent=msg||"";
    el.style.color= ok ? "rgba(47,58,44,.9)" : "#8a3b3b";
  };

  function jsonp(path, params){
    return new Promise((resolve, reject) => {
      const cb = "__ten_cb_" + Math.random().toString(36).slice(2);
      const qs = new URLSearchParams(Object.assign({ path, callback: cb, _: Date.now() }, params || {}));
      const url = GAS_URL + "?" + qs.toString();

      const s = document.createElement("script");
      let done = false;

      window[cb] = (data) => {
        done = true;
        try { delete window[cb]; } catch {}
        s.remove();
        resolve(data);
      };

      s.onerror = () => {
        if (done) return;
        try { delete window[cb]; } catch {}
        s.remove();
        reject(new Error("JSONP_LOAD_FAILED"));
      };

      document.head.appendChild(s);

      setTimeout(() => {
        if (done) return;
        try { delete window[cb]; } catch {}
        s.remove();
        reject(new Error("JSONP_TIMEOUT"));
      }, 12000);
    });
  }

  function needLogin(){ location.href = "./member.html"; }

  function parseItems(items_json){
    try{
      const arr = JSON.parse(items_json || "[]");
      if (!Array.isArray(arr)) return "";
      return arr.map(it => `• ${it.title || it.id} × ${it.qty}（NT$ ${it.price}）`).join("\n");
    }catch{
      return String(items_json||"");
    }
  }

  function money(n){
    n = Math.round(Number(n||0));
    return "NT$ " + n;
  }

  function rateToZhe(rate){
    rate = Number(rate||1);
    if (rate >= 1 || rate <= 0) return null;
    const z = Math.round(rate * 100) / 10;
    return String(z).replace(/\.0$/, "");
  }

  function renderDiscountChips(member){
    const row = $("discountRow");
    row.innerHTML = "";

    let s = null;
    try{ s = JSON.parse(localStorage.getItem(SETTINGS_CACHE_KEY)||"null"); }catch{}
    s = s && typeof s === "object" ? s : {};

    const firstZ = rateToZhe(s.first_purchase_discount);
    const bdayZ  = rateToZhe(s.birthday_discount);

    if (firstZ) {
      const el = document.createElement("span");
      el.className = "pill";
      el.textContent = `首購 ${firstZ} 折`;
      row.appendChild(el);
    }
    if (bdayZ) {
      const el = document.createElement("span");
      el.className = "pill";
      el.textContent = `生日月 ${bdayZ} 折`;
      row.appendChild(el);
    }

    const now = new Date();
    const isBdayMonth = Number(member?.birth_m||0) === (now.getMonth()+1);
    $("bdayIcon").style.display = isBdayMonth ? "inline" : "none";
    if (isBdayMonth) {
      const el = document.createElement("span");
      el.className = "pill";
      el.textContent = "當月壽星 🎂";
      row.appendChild(el);
    }
  }

  async function loadProfile(){
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) return needLogin();

    $("ordersTable").hidden = true;
    $("ordersBody").innerHTML = "";
    toast("ordersToast","");

    $("subline").textContent = "讀取會員資料中…";
    const me = await jsonp("member_me_jsonp", { token }).catch(e => ({ ok:false, error:e.message }));
    if (!me || me.ok !== true){
      $("subline").textContent = "登入失效，請重新登入";
      localStorage.removeItem(TOKEN_KEY);
      return setTimeout(needLogin, 400);
    }

    const m = me.member || {};
    $("subline").textContent = "已登入。你可以編輯姓名/地址，生日已鎖定。";
    $("m_id").value = m.member_id || "";
    $("m_phone").value = m.phone || "";
    $("m_name").value = m.name || "";
    $("m_addr").value = m.address || "";
    $("m_birth").value = `${m.birth_y||""}-${String(m.birth_m||"").padStart(2,"0")}-${String(m.birth_d||"").padStart(2,"0")}`;
    $("m_last").value = m.last_login_at || "";

    if (m.member_id) localStorage.setItem(MID_KEY, String(m.member_id));

    renderDiscountChips(m);

    toast("ordersToast","讀取訂單中…");
    const ord = await jsonp("member_orders_jsonp", { token }).catch(e => ({ ok:false, error:e.message }));
    if (!ord || ord.ok !== true){
      toast("ordersToast","讀取訂單失敗：" + (ord && ord.error ? ord.error : "UNKNOWN"), false);
      return;
    }

    const orders = Array.isArray(ord.orders) ? ord.orders : [];
    if (!orders.length){
      toast("ordersToast","目前沒有訂單。");
      return;
    }

    const body = $("ordersBody");
    body.innerHTML = orders.map(o => {
      const items = parseItems(o.items_json);
      const ship = `${o.name||""}\n${o.phone||""}\n${o.shipping_method||""}\n${o.address_or_store||""}`.trim();
      return `
        <tr>
          <td>${o.created_at || ""}</td>
          <td><strong>${o.order_id || ""}</strong></td>
          <td><div class="items">${items}</div></td>
          <td><div><strong>${money(o.total)}</strong></div><div class="muted">小計 ${money(o.subtotal)} / 折扣 ${money(o.discount)} / 運費 ${money(o.shipping_fee)}</div></td>
          <td><div class="items">${ship}</div></td>
        </tr>
      `;
    }).join("");

    $("ordersTable").hidden = false;
    toast("ordersToast","");
  }

  $("btnReload").addEventListener("click", () => loadProfile());

  $("btnSave").addEventListener("click", async () => {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) return needLogin();

    const name = String($("m_name").value||"").trim();
    const address = String($("m_addr").value||"").trim();
    if (!name) return toast("saveToast","請輸入姓名", false);
    if (!address) return toast("saveToast","請輸入地址", false);

    toast("saveToast","保存中…");
    $("btnSave").disabled = true;

    try{
      const out = await jsonp("member_update_jsonp", { token, name, address });
      if (!out || out.ok !== true){
        toast("saveToast","保存失敗：" + (out && out.error ? out.error : "UNKNOWN"), false);
        $("btnSave").disabled = false;
        return;
      }
      toast("saveToast","✅ 已保存");
      $("btnSave").disabled = false;
      setTimeout(() => toast("saveToast",""), 1200);
    }catch(e){
      toast("saveToast","系統忙碌（" + e.message + "）", false);
      $("btnSave").disabled = false;
    }
  });

  $("btnLogout").addEventListener("click", async () => {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token){
      localStorage.removeItem(MID_KEY);
      return needLogin();
    }
    $("btnLogout").disabled = true;
    try{
      await jsonp("member_logout_jsonp", { token }).catch(()=>null);
    }finally{
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(MID_KEY);
      location.href = "./member.html";
    }
  });

  loadProfile();
})();
</script>
</body>
</html>
