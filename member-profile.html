<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>會員中心｜十年一日</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui; background:#f4f6f4; }
    .box { max-width:520px; margin:60px auto; background:#fff; padding:24px; border-radius:16px; }
    input,button { width:100%; padding:12px; margin-top:10px; }
  </style>
</head>
<body>

<div class="box">
  <h2>會員中心</h2>
  <input id="m_phone" disabled>
  <input id="m_name">
  <input id="m_addr">
  <button id="btnSave">儲存</button>
  <div id="saveToast"></div>

  <button id="btnLogout" style="margin-top:20px">登出</button>
</div>

<script src="./include-member.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const $ = id => document.getElementById(id);

  const r = await TEN_MEMBER.me();
  if (!r || !r.ok) {
    location.href = "member.html";
    return;
  }

  const m = r.profile;
  $("m_phone").value = m.phone;
  $("m_name").value = m.name;
  $("m_addr").value = m.address;

  $("btnSave").addEventListener("click", async () => {
    const u = await TEN_MEMBER.update({
      name: $("m_name").value,
      address: $("m_addr").value
    });
    $("saveToast").textContent = u.ok ? "已儲存" : "儲存失敗";
  });

  $("btnLogout").addEventListener("click", async () => {
    await TEN_MEMBER.logout();
    location.href = "member.html";
  });
});
</script>

</body>
</html>
