<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>會員中心｜十年一日</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui; background:#f4f6f4; }
    .box { max-width:520px; margin:60px auto; background:#fff; padding:24px; border-radius:16px; }
    input,button { width:100%; padding:12px; margin-top:10px; }
  </style>
</head>
<body>

<h2>會員資料</h2>
<div>手機：<span id="m_phone"></span></div>
<input id="m_name">
<input id="m_addr">
<button id="btnSave">儲存</button>
<button id="btnLogout">登出</button>

<script src="./include-member.js"></script>
<script>
(async()=>{
  const $=id=>document.getElementById(id);
  const r=await TEN_MEMBER.me();
  if(!r.ok){ location.href="member.html"; return; }

  $("m_phone").textContent=r.profile.phone;
  $("m_name").value=r.profile.name;
  $("m_addr").value=r.profile.address;

  $("btnSave").onclick=async()=>{
    await TEN_MEMBER.update({
      name:$("m_name").value,
      address:$("m_addr").value
    });
    alert("已更新");
  };
  $("btnLogout").onclick=()=>{
    TEN_MEMBER.logout();
    location.href="member.html";
  };
})();
</script>
</body>
</html>
