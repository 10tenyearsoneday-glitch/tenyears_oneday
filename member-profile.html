<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>會員資料</title>
</head>
<body>

<h2 id="hello"></h2>
<p id="birthday"></p>

<input id="name">
<input id="addr">
<button onclick="save()">儲存</button>
<button onclick="logout()">登出</button>

<script>
const API="https://script.google.com/macros/s/AKfycbxV6GCa_MUn-s-bNMH7Y7HJzF1DL1oJ2mb9taU8tGprY8fqb-DxknfFfOBzRWHi3RZzMw/exec】";
const token=localStorage.token;

async function api(path,data){
  const r=await fetch(API+"?path="+path,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(data)
  });
  return r.json();
}

async function load(){
  const r=await api("member_me",{token});
  if(!r.ok){location.href="member.html";return;}
  hello.textContent=r.member.name+
    (r.member.birth_m===(new Date().getMonth()+1)?" 🎂":"");
  birthday.textContent=`生日：${r.member.birth_y}-${r.member.birth_m}-${r.member.birth_d}`;
  name.value=r.member.name;
  addr.value=r.member.address;
}
load();

async function save(){
  await api("member_update",{token,name:name.value,address:addr.value});
  alert("已儲存");
}
async function logout(){
  await api("member_logout",{token});
  localStorage.removeItem("token");
  location.href="member.html";
}
</script>

</body>
</html>
