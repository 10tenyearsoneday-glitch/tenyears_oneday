<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>會員中心｜十年一日</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<script src="./include-shop.js"></script>
<script src="./include-member.js"></script>

<main style="max-width:640px;margin:40px auto;">
  <h2>會員中心</h2>

  <div id="profileBox"></div>

  <h3>修改資料</h3>
  <input id="u_name" placeholder="姓名"><br>
  <input id="u_email" placeholder="Email"><br>
  <input id="u_address" placeholder="地址"><br>
  <button onclick="save()">儲存</button>

  <br><br>
  <button onclick="TEN_MEMBER.logout()">登出</button>
</main>

<script>
(async () => {
  const profile = await TEN_MEMBER.me();
  if (!profile) {
    location.href = "member.html";
    return;
  }

  profileBox.innerHTML = `
    <p>姓名：${profile.name}</p>
    <p>手機：${profile.phone}</p>
    <p>生日：${profile.birth}</p>
  `;

  u_name.value = profile.name || "";
  u_email.value = profile.email || "";
  u_address.value = profile.address || "";
})();

async function save() {
  const res = await TEN_MEMBER.update({
    name: u_name.value,
    email: u_email.value,
    address: u_address.value
  });
  alert(res.ok ? "已更新" : "更新失敗");
}
</script>

</body>
</html>
