<!doctype html>
<html lang="zh-TW">
<head><meta charset="utf-8"><title>會員中心</title></head>
<body>
<h2>會員中心</h2>
<div id="info">載入中…</div>
<button onclick="logout()">登出</button>

<script src="./include-member.js"></script>
<script>
fetchMe()
  .then(p=>{
    info.innerHTML = `
      <div>姓名：${p.name}</div>
      <div>手機：${p.phone}</div>
      <div>生日：${p.birth}</div>
      <div>Email：${p.email||""}</div>
    `;
  })
  .catch(()=>location.href="member.html");

function logout(){
  localStorage.removeItem("ten_token");
  location.href="member.html";
}
</script>
</body>
</html>
