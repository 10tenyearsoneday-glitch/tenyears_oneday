<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>會員資料</title>

<iframe id="gas" src="https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec?path=bridge" style="display:none"></iframe>

<h2 id="name"></h2>
<div id="phone"></div>
<input id="addr">
<button onclick="save()">更新</button>
<button onclick="logout()">登出</button>

<h3>訂單</h3>
<div id="orders"></div>

<script>
let ready=false,id=0,cb={};
window.onmessage=e=>{
  if(e.data.type==="READY")ready=true;
  if(e.data.type==="RES"&&cb[e.data.id]){cb[e.data.id](e.data.data);delete cb[e.data.id];}
};
function call(p,m,b){
  return new Promise((res,rej)=>{
    if(!ready)return rej("BRIDGE");
    const i=++id;cb[i]=res;
    gas.contentWindow.postMessage({type:"REQ",id:i,path:p,method:m,body:b},"*");
  });
}
const token=localStorage.getItem("token");
if(!token)location="member.html";

(async()=>{
  const me=await call("member_me","GET",{token});
  name.textContent=me.member.name;
  phone.textContent=me.member.phone;
  addr.value=me.member.address;

  const o=await call("member_orders","GET",{token});
  orders.innerHTML=o.orders.map(x=>`<div>${x.order_id} $${x.total}</div>`).join("");
})();

async function save(){
  await call("member_update","POST",{token,address:addr.value});
  alert("已更新");
}
async function logout(){
  await call("member_logout","POST",{token});
  localStorage.clear();
  location="member.html";
}
</script>
</html>
