<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>我的會員資料｜十年一日</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="./include.js"></script>
<style>
body{font-family:"Noto Serif TC",serif;padding:20px}
.order{border:1px solid #ccc;margin:8px 0;padding:8px}
</style>
</head>
<body>

<h2 id="name"></h2>
<div id="info"></div>
<button onclick="logout()">登出</button>

<h3>我的訂單</h3>
<div id="orders"></div>

<script>
const GAS="https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";
const token=localStorage.getItem("ten_token");
if(!token) location.href="member.html";

async function get(path){
  const r=await fetch(`${GAS}?path=${path}&token=${token}`);
  return r.json();
}

(async()=>{
  const me=await get("member_me");
  if(!me.ok){location.href="member.html";return;}
  name.innerText=me.member.name;
  info.innerText=`電話：${me.member.phone}｜地址：${me.member.address}`;

  const o=await get("member_orders");
  orders.innerHTML=o.orders.map(x=>`
    <div class="order">
      <div>訂單編號：${x.order_id}</div>
      <div>金額：NT$${x.total}</div>
      <div>地址：${x.address_or_store}</div>
      <div>電話：${x.phone}</div>
    </div>
  `).join("");
})();

function logout(){
  localStorage.removeItem("ten_token");
  location.href="member.html";
}
</script>

</body>
</html>
