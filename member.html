<h2>會員中心</h2>

<h3>註冊</h3>
<input id="r_phone" placeholder="手機 09xxxxxxxx">
<input id="r_pw" type="password" placeholder="密碼(至少6碼)">
<input id="r_name" placeholder="姓名">
<select id="r_y"></select>
<select id="r_m"></select>
<select id="r_d"></select>
<input id="r_addr" placeholder="地址">
<button onclick="doRegister()">註冊並進入資料頁</button>

<hr>

<h3>登入</h3>
<input id="l_phone" placeholder="手機">
<input id="l_pw" type="password" placeholder="密碼">
<button onclick="doLogin()">登入</button>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/execc";

/* 年月日 */
for(let y=1950;y<=new Date().getFullYear();y++) r_y.innerHTML+=`<option>${y}</option>`;
for(let m=1;m<=12;m++) r_m.innerHTML+=`<option>${m}</option>`;
for(let d=1;d<=31;d++) r_d.innerHTML+=`<option>${d}</option>`;

/* 一次性 iframe 呼叫 */
function gasCall(path, body){
  return new Promise((resolve,reject)=>{
    const rid="RID"+Date.now();
    const iframe=document.createElement("iframe");
    iframe.style.display="none";
    iframe.src=GAS_URL+"?path="+path+"&postMessage=1&rid="+rid;
    document.body.appendChild(iframe);

    window.addEventListener("message",function h(e){
      if(e.data?.rid!==rid) return;
      window.removeEventListener("message",h);
      iframe.remove();
      resolve(e.data);
    });

    iframe.onload=()=>{
      iframe.contentWindow.postMessage({body},"*");
    };

    setTimeout(()=>reject("timeout"),8000);
  });
}

async function doRegister(){
  const res=await gasCall("member_register",{
    phone:r_phone.value,
    password:r_pw.value,
    name:r_name.value,
    birth_y:r_y.value,
    birth_m:r_m.value,
    birth_d:r_d.value,
    address:r_addr.value
  });
  if(!res.ok) return alert(res.error);
  localStorage.setItem("memberToken",res.token);
  location.href="member-profile.html";
}

async function doLogin(){
  const res=await gasCall("member_login",{
    phone:l_phone.value,
    password:l_pw.value
  });
  if(!res.ok) return alert("登入失敗");
  localStorage.setItem("memberToken",res.token);
  location.href="member-profile.html";
}
</script>
