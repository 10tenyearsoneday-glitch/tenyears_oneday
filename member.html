<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>會員登入｜十年一日</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui; background:#f4f6f4; }
    .box { max-width:420px; margin:60px auto; background:#fff; padding:24px; border-radius:16px; }
    input,button { width:100%; padding:12px; margin-top:10px; }
  </style>
</head>
<body>

<h2>登入</h2>
<input id="l_phone" placeholder="手機">
<input id="l_pw" type="password" placeholder="密碼">
<button id="btnLogin">登入</button>

<hr>

<h2>註冊</h2>
<input id="r_phone" placeholder="手機">
<input id="r_pw" type="password" placeholder="密碼">
<input id="r_name" placeholder="姓名">
<input id="r_addr" placeholder="地址">

<select id="r_by"></select>
<select id="r_bm"></select>
<select id="r_bd"></select>

<button id="btnRegister">註冊</button>

<script src="./include-member.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);

  const y = $("r_by"), m = $("r_bm"), d = $("r_bd");
  const now = new Date().getFullYear();
  y.innerHTML = "<option value=''>年</option>";
  for(let i=now;i>=1900;i--) y.innerHTML+=`<option>${i}</option>`;
  m.innerHTML="<option value=''>月</option>";
  for(let i=1;i<=12;i++) m.innerHTML+=`<option>${i}</option>`;
  function upd(){
    d.innerHTML="<option value=''>日</option>";
    if(!y.value||!m.value) return;
    const days=new Date(y.value,m.value,0).getDate();
    for(let i=1;i<=days;i++) d.innerHTML+=`<option>${i}</option>`;
  }
  y.onchange=m.onchange=upd;

  $("btnRegister").onclick=async()=>{
    const r=await TEN_MEMBER.register({
      phone:$("r_phone").value,
      password:$("r_pw").value,
      name:$("r_name").value,
      birth_y:y.value,
      birth_m:m.value,
      birth_d:d.value,
      address:$("r_addr").value
    });
    if(r.ok){
      localStorage.setItem("ten_member_token",r.token);
      location.href="member-profile.html";
    } else alert("註冊失敗");
  };

  $("btnLogin").onclick=async()=>{
    const r=await TEN_MEMBER.login($("l_phone").value,$("l_pw").value);
    if(r.ok){
      localStorage.setItem("ten_member_token",r.token);
      location.href="member-profile.html";
    } else alert("登入失敗");
  };
})();
</script>
</body>
</html>
