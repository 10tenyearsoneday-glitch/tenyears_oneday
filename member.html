<style>
body{font-family:"Noto Serif TC",serif;background:#f6f8f4;margin:0}
.box{max-width:520px;margin:40px auto;background:#fff;border-radius:16px;padding:24px}

input,select,button{width:100%;padding:10px;margin:6px 0}

.small{font-size:13px;color:#666}
</style>

  <link rel="stylesheet" href="assets/style.css">
<body>
<div class="box">
<h1>會員中心</h1>

<h3>註冊</h3>
<input id="r_phone" placeholder="手機 09xxxxxxxx">
<input id="r_pw" type="password" placeholder="密碼（至少6碼）">
<input id="r_name" placeholder="姓名">
<div style="display:flex;gap:6px">
  <select id="r_y"></select>
  <select id="r_m"></select>
  <select id="r_d"></select>
</div>
<input id="r_addr" placeholder="配送地址">
<button onclick="doRegister()">註冊並進入資料頁</button>

<hr>

<h3>登入</h3>
<input id="l_phone" placeholder="手機">
<input id="l_pw" type="password" placeholder="密碼">
<button onclick="doLogin()">登入</button>

<p class="small" id="msg"></p>
</div>

<!-- 一次性 iframe bridge -->
<iframe id="gasBridge" style="display:none"></iframe>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec"; // ← 只改這行

/* ===== iframe bridge ===== */
let bridgeReady=false, waiters={};

const iframe=document.getElementById("gasBridge");
iframe.src=GAS_URL+"?path=bridge";

window.addEventListener("message",e=>{
  const m=e.data||{};
  if(m.type==="GAS_BRIDGE_READY"){bridgeReady=true;return;}
  if(m.type==="GAS_BRIDGE_RES" && waiters[m.id]){
    waiters[m.id](m); delete waiters[m.id];
  }
});

function gasCall(path,method,body){
  return new Promise((res,rej)=>{
    if(!bridgeReady) return rej("BRIDGE_NOT_READY");
    const id=Math.random().toString(36).slice(2);
    waiters[id]=r=>r.error?rej(r.error):res(r.data);
    iframe.contentWindow.postMessage({type:"GAS_BRIDGE_REQ",id,path,method,body},"*");
  });
}

/* ===== birthday selects ===== */
const y=document.getElementById("r_y"),m=document.getElementById("r_m"),d=document.getElementById("r_d");
for(let i=1930;i<=new Date().getFullYear();i++) y.innerHTML+=`<option>${i}</option>`;
for(let i=1;i<=12;i++) m.innerHTML+=`<option>${i}</option>`;
for(let i=1;i<=31;i++) d.innerHTML+=`<option>${i}</option>`;

/* ===== actions ===== */
async function doRegister(){
  try{
    const out=await gasCall("member_register","POST",{
      phone:r_phone.value,password:r_pw.value,name:r_name.value,
      birth_y:y.value,birth_m:m.value,birth_d:d.value,
      address:r_addr.value
    });
    localStorage.setItem("memberToken",out.token);
    location.href="member-profile.html";
  }catch(e){msg.textContent="註冊失敗："+e;}
}

async function doLogin(){
  try{
    const out=await gasCall("member_login","POST",{
      phone:l_phone.value,password:l_pw.value
    });
    localStorage.setItem("memberToken",out.token);
    location.href="member-profile.html";
  }catch(e){msg.textContent="登入失敗";}
}
</script>
