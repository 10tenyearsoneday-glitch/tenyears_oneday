<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>會員</title>

<iframe id="gas" src="https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec?path=bridge" style="display:none"></iframe>

<h2>會員中心</h2>

<input id="r_phone" placeholder="手機">
<input id="r_pw" type="password" placeholder="密碼">
<input id="r_name" placeholder="姓名">
<input id="r_address" placeholder="地址">
<input id="r_by" placeholder="年">
<input id="r_bm" placeholder="月">
<input id="r_bd" placeholder="日">
<button onclick="reg()">註冊</button>

<hr>

<input id="l_phone" placeholder="手機">
<input id="l_pw" type="password" placeholder="密碼">
<button onclick="login()">登入</button>

<script>
let ready=false, id=0, cb={};
window.onmessage=e=>{
  if(e.data.type==="READY") ready=true;
  if(e.data.type==="RES"&&cb[e.data.id]){cb[e.data.id](e.data.data);delete cb[e.data.id];}
};
function call(p,m,b){
  return new Promise((res,rej)=>{
    if(!ready)return rej("BRIDGE");
    const i=++id; cb[i]=res;
    gas.contentWindow.postMessage({type:"REQ",id:i,path:p,method:m,body:b},"*");
  });
}
function save(t){localStorage.setItem("token",t);}
async function reg(){
  const r=await call("member_register","POST",{
    phone:r_phone.value,password:r_pw.value,
    name:r_name.value,address:r_address.value,
    birth_y:r_by.value,birth_m:r_bm.value,birth_d:r_bd.value
  });
  if(r.ok){save(r.token);location="member-profile.html";}
  else alert(r.error);
}
async function login(){
  const r=await call("member_login","POST",{phone:l_phone.value,password:l_pw.value});
  if(r.ok){save(r.token);location="member-profile.html";}
  else alert(r.error);
}
</script>
</html>
