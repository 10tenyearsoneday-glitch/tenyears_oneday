<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>會員註冊 / 登入</title>
</head>
<body>

<h2>會員註冊</h2>
<input id="r_phone" placeholder="手機">
<input id="r_pw" placeholder="密碼" type="password">
<input id="r_name" placeholder="姓名">
<input id="r_y" placeholder="年">
<input id="r_m" placeholder="月">
<input id="r_d" placeholder="日">
<input id="r_addr" placeholder="地址">
<button onclick="register()">註冊</button>

<hr>

<h2>會員登入</h2>
<input id="l_phone" placeholder="手機">
<input id="l_pw" placeholder="密碼" type="password">
<button onclick="login()">登入</button>

<script>
const API = "【貼你的會員 GAS WebApp URL】";

async function api(path,data){
  const r = await fetch(API+"?path="+path,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(data)
  });
  return r.json();
}

async function register(){
  const res = await api("member_register",{
    phone:r_phone.value,
    password:r_pw.value,
    name:r_name.value,
    birth_y:r_y.value,
    birth_m:r_m.value,
    birth_d:r_d.value,
    address:r_addr.value
  });
  if(res.ok){
    localStorage.token=res.token;
    location.href="member-profile.html";
  }else alert("註冊失敗");
}

async function login(){
  const res = await api("member_login",{
    phone:l_phone.value,
    password:l_pw.value
  });
  if(res.ok){
    localStorage.token=res.token;
    location.href="member-profile.html";
  }else alert("登入失敗");
}
</script>

</body>
</html>
