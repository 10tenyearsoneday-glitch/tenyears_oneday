<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>會員登入｜十年一日</title>
</head>
<body>
<h2>會員登入 / 註冊</h2>

<input id="phone" placeholder="手機">
<input id="password" type="password" placeholder="密碼">
<input id="name" placeholder="姓名（註冊用）">
<input id="birth" placeholder="生日 YYYY-MM-DD">

<button onclick="login()">登入</button>
<button onclick="register()">註冊</button>

<div id="msg"></div>

<script src="./include-member.js"></script>
<script>
async function login() {
  const phone = phoneInput.value;
  const password = passwordInput.value;
  const res = await TEN_MEMBER.login(phone, password);
  if (res.ok) location.href = "member-profile.html";
  else msg.textContent = "登入失敗：" + res.error;
}

async function register() {
  const res = await TEN_MEMBER.register({
    phone: phoneInput.value,
    password: passwordInput.value,
    name: nameInput.value,
    birth: birthInput.value
  });
  if (res.ok) location.href = "member-profile.html";
  else msg.textContent = "註冊失敗：" + res.error;
}

const phoneInput = document.getElementById("phone");
const passwordInput = document.getElementById("password");
const nameInput = document.getElementById("name");
const birthInput = document.getElementById("birth");
const msg = document.getElementById("msg");
</script>
</body>
</html>
