<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>會員登入｜十年一日</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui; background:#f4f6f4; }
    .box { max-width:420px; margin:60px auto; background:#fff; padding:24px; border-radius:16px; }
    input,button { width:100%; padding:12px; margin-top:10px; }
  </style>
</head>
<body>

<div class="box">
  <h2>會員登入</h2>
  <input id="l_phone" placeholder="手機">
  <input id="l_pw" type="password" placeholder="密碼">
  <button id="btnLogin">登入</button>
  <div id="loginToast"></div>

  <hr>

  <h2>註冊</h2>
  <input id="r_phone" placeholder="手機">
  <input id="r_pw" type="password" placeholder="密碼">
  <input id="r_name" placeholder="姓名">
  <input id="r_addr" placeholder="地址">
<div style="display:flex; gap:20px;">
  <select id="r_by">
    <option value="">年</option>
  </select>

  <select id="r_bm">
    <option value="">月</option>
  </select>

  <select id="r_bd">
    <option value="">日</option>
  </select>
</div>

  <button id="btnRegister">註冊</button>
  <div id="regToast"></div>
</div>

<script src="./include-member.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = id => document.getElementById(id);
  // ===== 生日下拉 =====
(function initBirthSelect() {
  const by = document.getElementById("r_by");
  const bm = document.getElementById("r_bm");
  const bd = document.getElementById("r_bd");

  const nowYear = new Date().getFullYear();

  // 年：1900 ~ 今年
  for (let y = nowYear; y >= 1900; y--) {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = y;
    by.appendChild(opt);
  }

  // 月：1 ~ 12
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement("option");
    opt.value = String(m).padStart(2, "0");
    opt.textContent = m;
    bm.appendChild(opt);
  }

  function updateDays() {
    bd.innerHTML = '<option value="">日</option>';
    if (!by.value || !bm.value) return;

    const days = new Date(by.value, bm.value, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const opt = document.createElement("option");
      opt.value = String(d).padStart(2, "0");
      opt.textContent = d;
      bd.appendChild(opt);
    }
  }

  by.addEventListener("change", updateDays);
  bm.addEventListener("change", updateDays);
})();


$("btnRegister").addEventListener("click", async () => {
  const r = await TEN_MEMBER.register({
    phone: $("r_phone").value.trim(),
    password: $("r_pw").value.trim(),
    name: $("r_name").value.trim(),
    birth_y: $("r_by").value,   // ✅ 一定有 or 空字串
    birth_m: $("r_bm").value,
    birth_d: $("r_bd").value,
    address: $("r_addr").value.trim()
  });

  console.log("REGISTER RESULT:", r);

  if (r && r.ok) {
    localStorage.setItem("ten_member_token", r.token);
    location.href = "member-profile.html";
  } else {
    $("regToast").textContent =
      r && r.msg === "PHONE_EXISTS"
        ? "此手機已註冊"
        : "註冊失敗";
  }
});

  $("btnLogin").addEventListener("click", async () => {
    const r = await TEN_MEMBER.login(
      $("l_phone").value.trim(),
      $("l_pw").value.trim()
    );

    console.log("LOGIN RESULT:", r);

    if (r && r.ok) {
      localStorage.setItem("ten_member_token", r.token);
      location.href = "member-profile.html";
    } else {
      $("loginToast").textContent = "登入失敗";
    }
  });
});
</script>


</body>
</html>
