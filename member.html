<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>會員登入｜十年一日</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<script src="./include-shop.js"></script>
<script src="./include-member.js"></script>

<main style="max-width:420px;margin:40px auto;">
  <h2>會員登入 / 註冊</h2>

  <input id="phone" placeholder="手機"><br>
  <input id="password" type="password" placeholder="密碼"><br>
  <input id="name" placeholder="姓名（註冊）"><br>
  <input id="birth" placeholder="生日 YYYY-MM-DD"><br>

  <button onclick="login()">登入</button>
  <button onclick="register()">註冊</button>

  <div id="msg"></div>
</main>

<script>
(async () => {
  const profile = await TEN_MEMBER.me();
  if (profile) location.href = "member-profile.html";
})();

async function login() {
  try {
    await TEN_MEMBER.login(phone.value, password.value);
  } catch {
    msg.textContent = "登入失敗";
  }
}

async function register() {
  try {
    await TEN_MEMBER.register({
      phone: phone.value,
      password: password.value,
      name: name.value,
      birth: birth.value
    });
  } catch {
    msg.textContent = "註冊失敗";
  }
}
</script>

</body>
</html>
