<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>會員登入</title>
</head>
<body>

<h2>會員登入</h2>
<input id="phone" placeholder="手機">
<input id="pw" type="password" placeholder="密碼">
<button onclick="login()">登入</button>

<h3>註冊</h3>
<input id="r_phone" placeholder="手機">
<input id="r_pw" type="password" placeholder="密碼">
<input id="r_name" placeholder="姓名">
<input id="r_birth" placeholder="1997/03/21">
<button onclick="register()">註冊</button>

<!-- ✅ 一定要先載這支 -->
<script src="./include-member.js"></script>

<script>
<script src="./include-member.js"></script>
<script>
async function login() {
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value.trim();

  const out = await TEN_MEMBER.login({ phone, password });

  if (!out.ok) {
    alert("登入失敗：" + (out.error || ""));
    return;
  }

  // ✅ 登入成功 → 去會員中心
  location.href = "member-profile.html";
}

async function register() {
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value.trim();
  const name = document.getElementById("name").value.trim();
  const birth = document.getElementById("birth").value.trim();

  const out = await TEN_MEMBER.register({
    phone, password, name, birth
  });

  if (!out.ok) {
    alert("註冊失敗：" + (out.error || ""));
    return;
  }

  // ✅ 註冊成功 → 直接進會員中心
  location.href = "member-profile.html";
}
</script>


</body>
</html>
