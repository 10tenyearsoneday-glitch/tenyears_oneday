<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>會員｜十年一日 TEN YEARS ONE DAY</title>
  <link rel="stylesheet" href="assets/style.css" />
<script src="./include-member.js"></script>
<style>
    body{background:linear-gradient(135deg,#F8F9F7 0%,#D4E7D1 55%,#A8BCA5 100%);}
    .wrap{max-width:980px;margin:0 auto;padding:22px 16px 46px;}
    .card{background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.08);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.08);overflow:hidden}
    .head{padding:18px 18px 6px}
    .ttl{font-size:1.35rem;font-weight:900;letter-spacing:.08em}
    .sub{margin-top:6px;opacity:.75;line-height:1.6}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 18px 0}
    .tabbtn{border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.9);border-radius:16px;padding:12px 10px;font-weight:900;letter-spacing:.12em;cursor:pointer}
    .tabbtn.active{background:#8ea08e;color:#fff;border-color:#8ea08e}
    .body{padding:14px 18px 18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .inp,select{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.92);outline:none}
    .btn{width:100%;border:none;border-radius:16px;padding:14px 12px;font-size:1rem;font-weight:900;letter-spacing:.12em;cursor:pointer;background:#8ea08e;color:#fff}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .toast{margin-top:10px;font-size:.92rem;opacity:.92}
    .muted{opacity:.7;font-size:.9rem;line-height:1.6}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .mini{font-size:.85rem;opacity:.75}
    .bdayRow{display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:10px}
    @media (max-width:720px){.grid{grid-template-columns:1fr}.bdayRow{grid-template-columns:1fr 1fr 1fr}}
  </style>

<style>
body{font-family:"Noto Serif TC";padding:40px}
input,button{display:block;margin:8px 0;padding:10px;width:100%}
</style>
</head>
<body>

<h2>會員註冊</h2>
<input id="r_phone" placeholder="手機 09xxxxxxxx">
<input id="r_pw" placeholder="密碼（6 碼以上）" type="password">
<input id="r_name" placeholder="姓名">
<input id="r_addr" placeholder="地址">
<input id="r_y" placeholder="出生年">
<input id="r_m" placeholder="月">
<input id="r_d" placeholder="日">
<button onclick="register()">註冊</button>

<hr>

<h2>會員登入</h2>
<input id="l_phone" placeholder="手機">
<input id="l_pw" placeholder="密碼" type="password">
<button onclick="login()">登入</button>

<script>
const API = "https://script.google.com/macros/s/AKfycbxV6GCa_MUn-s-bNMH7Y7HJzF1DL1oJ2mb9taU8tGprY8fqb-DxknfFfOBzRWHi3RZzMw/exec";

async function api(path,data){
  const r = await fetch(API,{
    method:"POST",
    body:JSON.stringify(Object.assign({path},data))
  });
  return r.json();
}

async function register(){
  const res = await api("member_register",{
    phone:r_phone.value,
    password:r_pw.value,
    name:r_name.value,
    address:r_addr.value,
    birth_y:r_y.value,
    birth_m:r_m.value,
    birth_d:r_d.value
  });
  if(res.ok){
    localStorage.setItem("TEN_TOKEN",res.token);
    location.href="member-profile.html";
  } else alert(res.error);
}

async function login(){
  const res = await api("member_login",{
    phone:l_phone.value,
    password:l_pw.value
  });
  if(res.ok){
    localStorage.setItem("TEN_TOKEN",res.token);
    location.href="member-profile.html";
  } else alert(res.error);
}
</script>
</body>
</html>
