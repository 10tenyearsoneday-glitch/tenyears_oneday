<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>會員登入 / 註冊｜十年一日</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="./include.js"></script>
  <style>
    body{font-family:"Noto Serif TC",serif;padding:20px}
    .card{max-width:420px;margin:auto}
    input,button{width:100%;padding:12px;margin:6px 0}
    button{background:#8ea08e;color:#fff;border:0}
  </style>
</head>
<body>

<div class="card">
  <h2>會員註冊</h2>
  <input id="r_name" placeholder="姓名">
  <input id="r_phone" placeholder="手機 09xxxxxxxx">
  <input id="r_pw" type="password" placeholder="密碼（至少6碼）">
  <input id="r_addr" placeholder="地址">
  <input id="r_y" placeholder="生日 年">
  <input id="r_m" placeholder="月">
  <input id="r_d" placeholder="日">
  <button onclick="doRegister()">註冊</button>

  <hr>

  <h2>會員登入</h2>
  <input id="l_phone" placeholder="手機">
  <input id="l_pw" type="password" placeholder="密碼">
  <button onclick="doLogin()">登入</button>

  <div id="msg"></div>
</div>

<script>
const GAS = "https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";

async function post(path, body){
  const r = await fetch(`${GAS}?path=${path}`,{
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=UTF-8" },
    body: JSON.stringify(body)
  });
  return r.json();
}

async function doRegister(){
  const out = await post("member_register",{
    name:r_name.value,
    phone:r_phone.value,
    password:r_pw.value,
    address:r_addr.value,
    birth_y:r_y.value,
    birth_m:r_m.value,
    birth_d:r_d.value
  });
  if(out.ok){
    localStorage.setItem("ten_token",out.token);
    location.href="member-profile.html";
  }else msg.innerText=out.error;
}

async function doLogin(){
  const out = await post("member_login",{
    phone:l_phone.value,
    password:l_pw.value
  });
  if(out.ok){
    localStorage.setItem("ten_token",out.token);
    location.href="member-profile.html";
  }else msg.innerText=out.error;
}
</script>

</body>
</html>
