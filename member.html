<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>會員註冊 / 登入</title>
</head>
<body>

<h2>註冊</h2>
<input id="r_phone" placeholder="手機">
<input id="r_pw" type="password" placeholder="密碼">
<input id="r_name" placeholder="姓名">
<input id="r_addr" placeholder="地址">

<div>
  <select id="r_by"></select>
  <select id="r_bm"></select>
  <select id="r_bd"></select>
</div>

<button id="btnRegister">註冊</button>

<hr>

<h2>登入</h2>
<input id="l_phone" placeholder="手機">
<input id="l_pw" type="password" placeholder="密碼">
<button id="btnLogin">登入</button>

<script src="./include-member.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = id => document.getElementById(id);

  /* ===== 生日下拉 ===== */
  const by = $("r_by");
  const bm = $("r_bm");
  const bd = $("r_bd");

  by.innerHTML = "<option value=''>年</option>";
  bm.innerHTML = "<option value=''>月</option>";
  bd.innerHTML = "<option value=''>日</option>";

  const now = new Date().getFullYear();
  for (let y = now; y >= 1900; y--) {
    by.innerHTML += `<option value="${y}">${y}</option>`;
  }
  for (let m = 1; m <= 12; m++) {
    bm.innerHTML += `<option value="${m}">${m}</option>`;
  }

  function updateDays() {
    bd.innerHTML = "<option value=''>日</option>";
    if (!by.value || !bm.value) return;
    const days = new Date(by.value, bm.value, 0).getDate();
    for (let d = 1; d <= days; d++) {
      bd.innerHTML += `<option value="${d}">${d}</option>`;
    }
  }
  by.onchange = bm.onchange = updateDays;

  /* ===== 註冊 ===== */
  $("btnRegister").onclick = async () => {
    console.log(
      "PW=", $("r_pw").value,
      "BY=", by.value,
      "BM=", bm.value,
      "BD=", bd.value
    );

    const r = await TEN_MEMBER.register({
      phone: $("r_phone").value.trim(),
      password: $("r_pw").value.trim(),
      name: $("r_name").value.trim(),
      birth_y: by.value,
      birth_m: bm.value,
      birth_d: bd.value,
      address: $("r_addr").value.trim()
    });

    if (r.ok) {
      localStorage.setItem("ten_member_token", r.token);
      location.href = "member-profile.html";
    } else {
      alert("註冊失敗");
    }
  };

  /* ===== 登入 ===== */
  $("btnLogin").onclick = async () => {
    const r = await TEN_MEMBER.login(
      $("l_phone").value.trim(),
      $("l_pw").value.trim()
    );
    if (r.ok) {
      localStorage.setItem("ten_member_token", r.token);
      location.href = "member-profile.html";
    } else {
      alert("登入失敗");
    }
  };
});
</script>
</body>
</html>
