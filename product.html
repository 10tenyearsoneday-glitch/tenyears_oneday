<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品詳情｜十年一日</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <main>
    <div class="detail">
      <a class="back" href="javascript:history.back()">← 返回</a>

      <div class="detail-grid">
        <div class="detail-media">
          <img id="pImg" alt="商品圖" loading="lazy">
          <div id="thumbs" class="thumbs"></div>
        </div>

        <div class="detail-info">
          <h2 id="pName">商品名稱</h2>
          <div class="detail-meta" id="pMeta">分類</div>
          <div class="detail-price" id="pPrice">NT$ 0</div>

          <div class="detail-desc" id="pDesc">這裡是商品介紹。</div>

          <div class="detail-actions">
            <button class="btn" id="btnAddCart" type="button" disabled>載入中...</button>
            <div id="cartToast" style="margin-top:10px;font-size:.9rem;opacity:.85;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="include.js"></script>

  <script>
    const id = new URLSearchParams(location.search).get("id");

    const pImg   = document.getElementById("pImg");
    const pName  = document.getElementById("pName");
    const pMeta  = document.getElementById("pMeta");
    const pPrice = document.getElementById("pPrice");
    const pDesc  = document.getElementById("pDesc");
    const thumbs = document.getElementById("thumbs");

    const btnAddCart = document.getElementById("btnAddCart");
    const cartToast  = document.getElementById("cartToast");

    // ✅ 跟 include.js 同一把 key
    const CART_KEY = "ten_cart";

    let CURRENT_PRODUCT = null;

    function toast(msg, ok=true){
      if(!cartToast) return;
      cartToast.textContent = msg;
      cartToast.style.color = ok ? "rgba(47,58,44,.85)" : "#8a3b3b";
      setTimeout(()=>{ cartToast.textContent = ""; }, 1800);
    }

    // ====== Cart (ten_cart) ======
    function readCart(){
      try{
        const raw = localStorage.getItem(CART_KEY);
        const arr = JSON.parse(raw || "[]");
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }

    function writeCart(arr){
      localStorage.setItem(CART_KEY, JSON.stringify(arr));
      // ✅ 通知 header 更新數量
      window.dispatchEvent(new Event("cart:changed"));
    }

    function addToCart(product, qty=1){
      const pid = String(product?.id || "").trim();
      if(!pid) return { ok:false, error:"NO_ID" };

      const cart = readCart();
      const i = cart.findIndex(x => String(x.id) === pid);

      if(i === -1){
        cart.push({ id: pid, qty: Math.max(1, Number(qty || 1)) });
      }else{
        cart[i].qty = Math.max(1, Number(cart[i].qty || 1) + Number(qty || 1));
      }

      writeCart(cart);
      return { ok:true };
    }

    // ====== Thumbs ======
    function buildThumbs(mainImage, imagesField){
      let list = [];

      if (Array.isArray(imagesField)) {
        list = imagesField;
      } else {
        list = String(imagesField || "")
          .split("\n")
          .map(s => s.trim())
          .filter(Boolean);
      }

      // 主圖放第一張（去重）
      const all = [mainImage, ...list].filter(Boolean);
      const uniq = [];
      const seen = new Set();
      for (const u of all){
        if(!seen.has(u)){
          seen.add(u);
          uniq.push(u);
        }
      }

      if(!thumbs) return;

      if(uniq.length <= 1){
        thumbs.innerHTML = "";
        thumbs.style.display = "none";
        return;
      }

      thumbs.style.display = "flex";
      thumbs.innerHTML = uniq.map((u, i) => `
        <button class="thumb-btn ${i===0 ? "active":""}" type="button" data-src="${u}">
          <img src="${u}" alt="縮圖 ${i+1}" loading="lazy">
        </button>
      `).join("");

      thumbs.querySelectorAll(".thumb-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const src = btn.getAttribute("data-src") || "";
          if(!src) return;

          pImg.src = src;
          thumbs.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
    }

    async function loadOne(){
      if(!id){
        pName.textContent = "找不到商品";
        if(btnAddCart){
          btnAddCart.disabled = true;
          btnAddCart.textContent = "無法加入購物車";
        }
        return;
      }

      try{
        // ✅ 用單一商品 API
        const res = await fetch(`${window.API_BASE}/products/${encodeURIComponent(id)}`, { cache: "no-store" });
        if(!res.ok) throw new Error("API error " + res.status);
        const p = await res.json();
        CURRENT_PRODUCT = p;

        document.title = `${p.title || "商品"}｜十年一日`;

        const cat = p.category || "其他";
        const series = p.series || "全系列";
        const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);

        pName.textContent = p.title || "（未命名）";
        pMeta.textContent = `${series}｜${cat}`;
        pPrice.textContent = `NT$ ${price}`;
        pDesc.textContent = p.desc || "（商品介紹待補）";

        const main = p.image || "assets/placeholder.png";
        pImg.src = main;

        buildThumbs(main, p.images);

        if(btnAddCart){
          btnAddCart.disabled = false;
          btnAddCart.textContent = "加入購物車";
        }
      }catch(err){
        console.error(err);
        pName.textContent = "載入失敗，請稍後再試";
        if(btnAddCart){
          btnAddCart.disabled = true;
          btnAddCart.textContent = "無法加入購物車";
        }
      }
    }

    // ✅ 不跳轉：只加入購物車 + toast + header 更新數量
    btnAddCart?.addEventListener("click", () => {
      if(!CURRENT_PRODUCT){
        toast("商品尚未載入完成", false);
        return;
      }
      const r = addToCart(CURRENT_PRODUCT, 1);
      if(!r.ok){
        toast("加入失敗", false);
        return;
      }
      toast("已加入購物車 ✅");
    });

    loadOne();
  </script>

</body>
</html>
