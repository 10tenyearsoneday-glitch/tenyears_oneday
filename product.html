<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品詳情｜十年一日</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <main>
    <div class="detail">
      <a class="back" href="javascript:history.back()">← 返回</a>

      <div class="detail-grid">
        <div class="detail-media">
          <img id="pImg" alt="商品圖" loading="lazy">
          <div id="thumbs" class="thumbs" style="display:none;"></div>
        </div>

        <div class="detail-info">
          <h2 id="pName">載入中…</h2>
          <div class="detail-meta" id="pMeta"></div>
          <div class="detail-price" id="pPrice"></div>

          <div class="detail-desc" id="pDesc"></div>

          <div class="detail-actions">
            <button class="btn" id="btnAddCart" type="button" disabled>載入中...</button>
            <div id="cartToast" style="margin-top:10px;font-size:.9rem;opacity:.85;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ✅ 先載入 include.js，讓 header / drawer 在這頁也能用 -->
  <script src="./include.js"></script>

  <script>
  (() => {
    const API_BASE = window.API_BASE || "https://tenyears-oneday-api.onrender.com";
    const CART_KEY = "ten_cart";

    const id = new URLSearchParams(location.search).get("id");

    const pImg   = document.getElementById("pImg");
    const pName  = document.getElementById("pName");
    const pMeta  = document.getElementById("pMeta");
    const pPrice = document.getElementById("pPrice");
    const pDesc  = document.getElementById("pDesc");
    const thumbs = document.getElementById("thumbs");

    const btnAddCart = document.getElementById("btnAddCart");
    const cartToast  = document.getElementById("cartToast");

    let CURRENT_PRODUCT = null;

    function toast(msg, ok=true){
      if(!cartToast) return;
      cartToast.textContent = msg;
      cartToast.style.color = ok ? "rgba(47,58,44,.85)" : "#8a3b3b";
      if(msg) setTimeout(()=>{ cartToast.textContent = ""; }, 1800);
    }

    // ===== Cart (ten_cart) =====
    function readCart(){
      try{
        const raw = localStorage.getItem(CART_KEY);
        const arr = JSON.parse(raw || "[]");
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }

    function writeCart(arr){
      localStorage.setItem(CART_KEY, JSON.stringify(arr));
      window.dispatchEvent(new Event("cart:changed"));
    }

    // ✅ 寫入完整欄位（跟 drawer 顯示一致）
    function addToCart(product, qty=1){
      const pid = String(product?.id || product?._id || "").trim();
      if(!pid) return { ok:false, error:"NO_ID" };

      qty = Math.max(1, Math.floor(Number(qty || 1)));

      const item = {
        id: pid,
        title: product.title || "",
        price: Number(product.price || 0),
        image: product.image || "assets/placeholder.png",
        qty
      };

      const cart = readCart();
      const i = cart.findIndex(x => String(x.id) === pid);

      if(i === -1){
        cart.push(item);
      }else{
        cart[i].qty = Math.max(1, Number(cart[i].qty || 1) + qty);
        // 補齊資料（避免舊資料只有 id/qty）
        cart[i].title = cart[i].title || item.title;
        cart[i].price = Number(cart[i].price || item.price || 0);
        cart[i].image = cart[i].image || item.image;
      }

      writeCart(cart);
      return { ok:true };
    }

    // ===== Images / Thumbs =====
    function parseImagesField(imagesField){
      // 支援：array 或多行字串
      if (Array.isArray(imagesField)) {
        return imagesField.map(s => String(s||"").trim()).filter(Boolean);
      }
      return String(imagesField || "")
        .split("\n")
        .map(s => s.trim())
        .filter(Boolean);
    }

    function buildThumbs(mainImage, imagesField){
      const list = parseImagesField(imagesField);

      const all = [mainImage, ...list].filter(Boolean);
      const uniq = [];
      const seen = new Set();
      for (const u of all){
        if(!seen.has(u)){
          seen.add(u);
          uniq.push(u);
        }
      }

      if(!thumbs) return;

      if(uniq.length <= 1){
        thumbs.innerHTML = "";
        thumbs.style.display = "none";
        return;
      }

      thumbs.style.display = "flex";
      thumbs.innerHTML = uniq.map((u, i) => `
        <button class="thumb-btn ${i===0 ? "active":""}" type="button" data-src="${u}">
          <img src="${u}" alt="縮圖 ${i+1}" loading="lazy">
        </button>
      `).join("");

      thumbs.querySelectorAll(".thumb-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const src = btn.getAttribute("data-src") || "";
          if(!src) return;

          pImg.src = src;
          thumbs.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
    }

    function setLoadingState(msg="載入中…"){
      pName.textContent = msg;
      pMeta.textContent = "";
      pPrice.textContent = "";
      pDesc.textContent = "";
      pImg.src = "assets/placeholder.png";
      thumbs.style.display = "none";
      thumbs.innerHTML = "";

      if(btnAddCart){
        btnAddCart.disabled = true;
        btnAddCart.textContent = "載入中...";
      }
    }

    function setErrorState(msg="載入失敗，請稍後再試"){
      pName.textContent = msg;
      pMeta.textContent = "";
      pPrice.textContent = "";
      pDesc.textContent = "";
      pImg.src = "assets/placeholder.png";
      thumbs.style.display = "none";
      thumbs.innerHTML = "";

      if(btnAddCart){
        btnAddCart.disabled = true;
        btnAddCart.textContent = "無法加入購物車";
      }
    }

    async function loadOne(){
      if(!id){
        setErrorState("找不到商品（缺少 id）");
        return;
      }

      setLoadingState();

      try{
        const res = await fetch(`${API_BASE}/products/${encodeURIComponent(id)}`, { cache: "no-store" });
        if(!res.ok) throw new Error("API error " + res.status);

        const p = await res.json();
        CURRENT_PRODUCT = p;

        const pid = String(p?.id ?? p?._id ?? id);
        const title = p.title || "（未命名）";
        const cat = p.category || "其他";
        const series = p.series || "全系列";
        const price = (typeof p.price === "number") ? p.price : Number(p.price || 0);

        // desc 兼容：desc / description
        const desc = p.desc ?? p.description ?? "";

        document.title = `${title}｜十年一日`;

        pName.textContent = title;
        pMeta.textContent = `${series}｜${cat}｜ID：${pid}`;
        pPrice.textContent = `NT$ ${Math.round(price)}`;
        pDesc.textContent = desc ? String(desc) : "（商品介紹待補）";

        const main = (p.image || "").trim() || "assets/placeholder.png";
        pImg.src = main;

        buildThumbs(main, p.images);

        if(btnAddCart){
          btnAddCart.disabled = false;
          btnAddCart.textContent = "加入購物車";
        }
      }catch(err){
        console.error(err);
        setErrorState("載入失敗，請稍後再試");
      }
    }

    btnAddCart?.addEventListener("click", () => {
      if(!CURRENT_PRODUCT){
        toast("商品尚未載入完成", false);
        return;
      }
      const r = addToCart(CURRENT_PRODUCT, 1);
      if(!r.ok){
        toast("加入失敗", false);
        return;
      }
      toast("已加入購物車 ✅");
    });

    loadOne();
  })();
  </script>

</body>
</html>
