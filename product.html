<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品詳情｜十年一日</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <main>
    <div class="detail">
      <a class="back" href="javascript:history.back()">← 返回</a>

      <div class="detail-grid">
<div class="detail-media">
  <img id="pImg" alt="商品圖" loading="lazy">
  <div id="thumbs" class="thumbs"></div>
</div>



        <div class="detail-info">
          <h2 id="pName">商品名稱</h2>
          <div class="detail-meta" id="pMeta">分類</div>
          <div class="detail-price" id="pPrice">NT$ 0</div>

          <div class="detail-desc" id="pDesc">
            這裡是商品介紹。
          </div>

          <div class="detail-actions">
            <button class="btn" type="button" disabled>加入購物車（稍後開放）</button>
          </div>
        </div>
      </div>
    </div>
  </main>
<script src="include.js"></script>

<script>
  const API_BASE = "https://tenyears-oneday-api.onrender.com";
  const id = new URLSearchParams(location.search).get("id");

  const pImg = document.getElementById("pImg");
  const pName = document.getElementById("pName");
  const pMeta = document.getElementById("pMeta");
  const pPrice = document.getElementById("pPrice");
  const pDesc = document.getElementById("pDesc");

  async function loadOne(){
    if(!id){
      pName.textContent = "找不到商品";
      return;
    }

    try{
      const res = await fetch(`${API_BASE}/products`, { cache: "no-store" });
      if(!res.ok) throw new Error("API error " + res.status);
      const list = await res.json();

      const p = Array.isArray(list) ? list.find(x => String(x.id) === String(id)) : null;
      if(!p){
        pName.textContent = "商品不存在或已下架";
        return;
      }

      document.title = `${p.title || "商品"}｜十年一日`;

      const cat = p.category || "其他";
      const series = p.series || "全系列";
      const price = (typeof p.price === "number") ? p.price : 0;

      pName.textContent = p.title || "（未命名）";
      pMeta.textContent = `${series}｜${cat}`;
      pPrice.textContent = `NT$ ${price}`;
      pDesc.textContent = p.desc || "（商品介紹待補）";

const img = p.image || "";
pImg.src = img || "assets/placeholder.png";

    }catch(err){
      console.error(err);
      pName.textContent = "載入失敗，請稍後再試";
    }
    const thumbs = document.getElementById("thumbs");

function buildThumbs(mainImage, imagesField){
  // imagesField 可能是：多行字串 / 單一字串 / 陣列
  let list = [];

  if(Array.isArray(imagesField)){
    list = imagesField;
  }else{
    list = String(imagesField || "")
      .split("\n")
      .map(s => s.trim())
      .filter(Boolean);
  }

  // 把主圖放到第一張（避免重複）
  const all = [mainImage, ...list].filter(Boolean);
  const uniq = [];
  const seen = new Set();
  for(const u of all){
    if(!seen.has(u)){
      seen.add(u);
      uniq.push(u);
    }
  }

  if(!thumbs) return;

  // 只有一張就不顯示縮圖列
  if(uniq.length <= 1){
    thumbs.innerHTML = "";
    thumbs.style.display = "none";
    return;
  }

  thumbs.style.display = "flex";
  thumbs.innerHTML = uniq.map((u, i) => `
    <button class="thumb-btn ${i===0 ? "active":""}" type="button" data-src="${u}">
      <img src="${u}" alt="縮圖 ${i+1}" loading="lazy">
    </button>
  `).join("");

  thumbs.querySelectorAll(".thumb-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const src = btn.getAttribute("data-src") || "";
      if(!src) return;
      pImg.src = src;
const main = p.image || "assets/placeholder.png";
pImg.src = main;
buildThumbs(main, p.images);

      thumbs.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
}

  }

  loadOne();
</script>

</body>
</html>
