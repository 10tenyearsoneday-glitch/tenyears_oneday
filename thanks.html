<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>訂單完成｜十年一日 TEN YEARS ONE DAY</title>

<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="./include-shop.js"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#F8F9F7] to-[#D4E7D1]">
<script>
window.GAS_MEMBERS_URL =
"https://script.google.com/macros/s/AKfycbwf5bVyoiFTtN6SIPmdyTtlFk9Ja9zejWc_yZTVP8PNkpmyx1XVpTSiVwa4tUUBIqI-tg/exec";
</script>
<script src="./include-shop.js"></script>
<script src="./include-member.js"></script>

<main class="max-w-xl mx-auto px-4 pt-28 pb-20">

<div class="card p-6 space-y-5 text-center">

<h1 class="text-xl font-black tracking-widest">訂單成立</h1>

<div class="text-sm opacity-70">
謝謝你選擇 十年一日
</div>

<div id="orderBox" class="text-left text-sm space-y-2"></div>

<a href="index.html"
class="block mt-6 w-full h-11 rounded-2xl bg-[#2f3a2c] text-white font-black flex items-center justify-center">
回首頁
</a>

</div>

</main>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycby06D9BwO2SF3CauIxlBfb2cCyEvuaMLnoOPPhwoyQh57T_wP8Al9L2fQuw2617cLF8/exec";

const q=new URLSearchParams(location.search);
const id=q.get("order_id");

if(!id){
orderBox.innerHTML="找不到訂單編號";
}else{
fetch(`${GAS_URL}?path=order_get&id=${id}`)
.then(r=>r.json())
.then(o=>{
if(!o.ok){
orderBox.innerHTML="訂單讀取失敗";
return;
}

const d=o.data;

orderBox.innerHTML=`
<div><b>訂單編號：</b>${d.order_id}</div>
<div><b>姓名：</b>${d.name}</div>
<div><b>電話：</b>${d.phone}</div>
<div><b>配送：</b>${d.shipping_method==="store"?"超商取貨":"宅配"}</div>
<div><b>地址 / 門市：</b>${d.address_or_store}</div>
<div><b>付款：</b>${d.payment_method==="cod"?"貨到付款":"信用卡"}</div>
<div><b>金額：</b>NT$ ${d.total}</div>
`;
});
}
</script>
  <script>
localStorage.removeItem("ten_cart");
</script>

</body>
</html>
